<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 걸음 수학</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한 걸음 수학">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 모눈종이 위의 수학 노트. 형광펜(노랑)은 '지금 할 것'에만, 파란 잉크는 눌러 볼 수 있는 것에만 쓴다. */
:root{
  --paper:#f6f7f3;
  --grid:rgba(40,60,110,.075);
  --ink:#1d2640;
  --ink-soft:#5a6377;
  --line:#d8dce4;
  --card:#ffffff;
  --accent:#2a4d9e;
  --accent-soft:#e8eefb;
  --hi:#ffe266;
  --hi-soft:#fff6c7;
  --ok:#2b7a4b;
  --ok-soft:#e5f4ea;
  --bad:#b83a3a;
  --bad-soft:#fbe9e9;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --math:"Times New Roman",Times,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.mark{background:linear-gradient(transparent 58%,var(--hi) 58%,var(--hi) 92%,transparent 92%);padding:0 .1em}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:rgba(246,247,243,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink-soft);font-size:15px;flex-wrap:wrap}
.crumbs a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent}
.crumbs a:hover{border-color:var(--ink-soft)}
.crumbs .sep{opacity:.5}

main{padding:28px 0 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}

/* 홈 */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:36px}
.hero h1{font-size:clamp(30px,4.4vw,46px);margin-bottom:14px}
.hero p{color:var(--ink-soft);max-width:34em;margin:0 0 8px}
.hero-fig{aspect-ratio:1/1;max-height:360px;width:100%}
.hero-fig canvas{width:100%;height:100%;display:block}
.hero-note{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:-6px}
.sec-title{display:flex;align-items:baseline;gap:4px 12px;margin:8px 0 14px;flex-wrap:wrap}
.sec-title h2{font-size:24px}
.sec-title span{color:var(--ink-soft);font-size:15px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.unit{padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;min-height:110px;position:relative}
.unit .no{font-family:var(--math);font-size:15px;color:var(--ink-soft)}
.unit b{font-family:var(--display);font-size:20px}
.unit .st{font-size:14px;color:var(--ink-soft);margin-top:auto}
.unit.ready{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.unit.ready:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.unit.ready .st{color:var(--ink);font-weight:500}
.unit.soon{opacity:.55;background:rgba(255,255,255,.6)}

/* 단원 */
.unit-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.unit-head h1{font-size:clamp(28px,4vw,40px)}
.unit-head p{margin:6px 0 0;color:var(--ink-soft)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--ink-soft);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}
.legend i.on{background:var(--ink)}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:16px 20px;text-decoration:none;color:inherit}
.lesson .n{font-family:var(--math);font-size:30px;text-align:center;color:var(--ink-soft)}
.lesson b{font-family:var(--display);font-size:21px;display:block}
.lesson small{color:var(--ink-soft);font-size:15px}
.lesson.ready{border-left:6px solid var(--ink)}
.lesson.ready:hover{background:var(--hi-soft)}
.lesson.soon{opacity:.5}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.pip.on{background:var(--ink)}
.soon-tag{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-soft);justify-self:start}

/* 차시 */
.lesson-head{margin-bottom:16px}
.lesson-head .kicker{font-family:var(--math);color:var(--ink-soft);font-size:16px}
.lesson-head h1{font-size:clamp(28px,4vw,40px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.tab{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;min-height:56px}
.tab .num{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--math);font-size:16px}
.tab .tl{font-weight:700;line-height:1.2}
.tab .tl small{display:block;font-weight:400;font-size:13px;color:var(--ink-soft)}
.tab.on{background:var(--ink);color:#fff}
.tab.on .num{border-color:#fff}
.tab.on .tl small{color:#c9cfdc}
.tab.done .num{background:var(--hi);border-color:var(--ink);color:var(--ink)}
.panel{padding:24px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:24px;margin-bottom:10px}
.panel h3{font-size:19px;margin:18px 0 8px}
.lead{font-size:19px;margin:0 0 14px}
.muted{color:var(--ink-soft)}
.next-row{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:500;min-height:46px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hi-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2c3860}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:9px 16px;cursor:pointer;min-height:44px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}

/* 용어 */
.term{background:none;border:0;padding:0;color:var(--accent);border-bottom:2px dotted var(--accent);cursor:help;font:inherit;line-height:inherit}
.term:hover,.term.open{background:var(--accent-soft)}
.pop{position:fixed;z-index:50;width:min(370px,calc(100vw - 24px));background:var(--card);border:1.5px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 rgba(29,38,64,.18);padding:16px 18px 18px;font-size:16px;line-height:1.6}
.pop[hidden]{display:none}
.pop-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pop-h h4{margin:0;font-family:var(--display);font-size:20px;flex:1}
.pop-h button{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;min-width:36px;min-height:36px}
.pop p{margin:6px 0}
.pop canvas{width:100%;height:150px;display:block;margin-top:8px}
.pop .kicker{font-size:13px;color:var(--ink-soft)}
.pop .pfig3{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pop .pfig3 canvas{height:130px;margin:0;border:1px solid var(--line);border-radius:8px}
@media (max-width:640px){.pop{left:12px!important;right:12px;bottom:12px;top:auto!important;width:auto}}

/* 개념 */
.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.figbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.figbox canvas{width:100%;display:block;touch-action:pan-y}
.figcap{text-align:center;font-size:15px;color:var(--ink-soft);margin-top:4px}
.defs{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.defs li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--paper)}
.defs b{font-family:var(--display);font-size:18px}
.box{border:1.5px solid var(--ink);border-radius:12px;padding:14px 18px;background:var(--hi-soft);margin:14px 0}
.box.plain{background:#fff;border-color:var(--line)}
.formula{font-family:var(--display);font-size:20px;text-align:center;margin:6px 0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:9px 10px;text-align:center}
table.t th{background:var(--paper);font-weight:700}
table.t td.l{text-align:left}
.tablewrap{overflow-x:auto}
.math{font-family:var(--math);font-style:italic}
.rm{font-family:var(--math)}

/* 탐구 */
.explore{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.stage{background:#fff;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
.stage canvas{width:100%;height:420px;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage .hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--ink-soft);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;pointer-events:none}
.ctrl{display:flex;flex-direction:column;gap:16px}
.ctrl .cap{font-weight:700;display:block;margin-bottom:6px}
.ctrl .seg{align-self:flex-start}
.prob-body.nofig{grid-template-columns:1fr;max-width:720px}
.counter{font-size:20px}
.counter b{font-family:var(--math);font-size:34px;padding:0 4px}
.feedback{border-radius:10px;padding:12px 14px;font-size:16px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--accent-soft);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cls{padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.cls canvas{width:100%;height:130px;display:block;touch-action:pan-y}
.cls .nm{text-align:center;font-weight:700}
.cls .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cls .two button{border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:6px 4px;cursor:pointer;font-size:15px;min-height:42px}
.cls .why{font-size:14px;border-radius:8px;padding:6px 8px}
.cls.ok{border-color:var(--ok)}
.cls.ok .why{background:var(--ok-soft);color:var(--ok)}
.cls.bad{border-color:var(--bad)}
.cls.bad .why{background:var(--bad-soft);color:var(--bad)}
.ptable td.q{color:var(--line)}
.ptable tr.cur td{background:var(--hi-soft)}

/* 문제 */
.prob-q{font-weight:700;font-size:19px;margin-bottom:14px;font-family:var(--body)}
.prob-body{display:grid;grid-template-columns:minmax(260px,.85fr) 1.15fr;gap:22px;align-items:start}
.prob-fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.prob-fig canvas{width:100%;height:300px;display:block;touch-action:pan-y}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.step .sq{display:flex;gap:8px}
.step .sn{font-family:var(--math);font-size:18px;flex:none}
.step.lock{opacity:.45}
.step.cur{border-color:var(--ink);box-shadow:inset 6px 0 0 var(--hi)}
.step.done{border-color:var(--ok);background:var(--ok-soft)}
.step.done .ans{font-weight:700;color:var(--ok)}
.step.shown{border-color:var(--bad);background:var(--bad-soft)}
.step .expl{font-size:15px;color:var(--ink-soft);margin-top:4px}
.step .hintmsg{margin-top:8px;font-size:15px;background:var(--hi-soft);border-radius:8px;padding:8px 10px}
.answer{margin-top:10px}
.field{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;min-height:52px;font-family:var(--math);font-size:26px;background:#fff;max-width:280px}
.field .val{min-width:1ch}
.field .ph{color:#b9bfcc}
.field .suf{font-family:var(--body);font-size:18px;color:var(--ink-soft)}
.field .caret{width:2px;height:28px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(4,64px);grid-auto-rows:52px;gap:6px;margin-top:10px}
.keys button{border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:var(--math);font-size:22px}
.keys button:active{background:var(--hi-soft)}
.keys .ok{grid-column:4;grid-row:3/span 2;background:var(--ink);color:#fff;border-color:var(--ink);font-family:var(--body);font-size:17px}
.keys .zero{grid-column:span 2}
.keys .fn{font-family:var(--body);font-size:16px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choices button{border:1.5px solid var(--ink);border-radius:10px;background:#fff;padding:9px 18px;cursor:pointer;min-height:48px;font-size:18px}
.choices button.math{font-family:var(--math);font-style:italic}
.choices button:hover{background:var(--hi-soft)}
.shake{animation:shake .35s}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reg5{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 12px}
.fan{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.fan.ok{border-color:var(--ok);background:#f2faf5}.fan.no{opacity:.82}
.fan small{font-size:14px;color:var(--ink-soft)}.fan.ok small{color:var(--ok);font-weight:700}
.ang{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.angFig{display:flex;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.angFig svg{max-width:100%;height:auto}
.angPoly{display:grid;grid-template-columns:1fr 1fr}.angPoly button+button{border-left:0}.angPoly button:nth-child(2n){border-left:1.5px solid var(--ink)}.angPoly button:nth-child(n+3){border-top:1.5px solid var(--ink)}
.angFound,.vxLog{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.angFound .chip,.vxLog .chip{white-space:nowrap;cursor:default}.angPoly button small{color:inherit;opacity:.75}
.angK{display:flex;align-items:center;gap:10px;font-size:18px}
.angK button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);font-size:22px;cursor:pointer}
.angK button:disabled{opacity:.35;cursor:default}.angKv{font-size:26px;min-width:1.2em;text-align:center}
.angMsg{margin-top:12px;font-size:16px;line-height:1.6}.angMsg.ok{color:var(--ink)}.angMsg.bad{color:var(--bad)}
.angSolid canvas{width:100%;height:170px;display:block}
.chip.off{opacity:.45;border-style:dashed}
.regt{font-size:14px}.regt th,.regt td{padding:6px 1px;font-size:14px;white-space:nowrap}.regt thead th{font-size:12.5px;line-height:1.3}.regt tbody th{font-size:13px}.regt tbody th small{font-weight:400;color:var(--ink-soft);font-size:13px}
.cond{border:1.5px solid var(--ink);padding:8px 12px;margin-top:8px;font-weight:400;line-height:1.7}
@media(max-width:640px){.ang{grid-template-columns:1fr}.duo{grid-template-columns:1fr}.reg5,.fan-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{margin-top:14px;padding:14px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.statbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.stat{display:flex;flex-direction:column}
.stat small{color:var(--ink-soft);font-size:13px}
.stat b{font-family:var(--math);font-size:26px;line-height:1.1}
.lvl{margin-left:auto;font-size:15px;border:1.5px solid var(--ink);border-radius:999px;padding:4px 14px;background:var(--hi-soft)}
.retry-tag{font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:2px 10px;margin-left:6px;font-weight:500}
.prob-fig{position:relative}
.fighint{font-size:13px;color:var(--ink-soft);text-align:center;padding:2px 0 4px}
.netbtn{margin:4px auto 6px;display:flex;min-height:40px;padding:6px 14px;font-size:15px}
/* 개념 접고 펼치기 */
.fold-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.fold-tools{display:flex;gap:6px}
.fold-tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;min-height:38px}
.fold-tools button:hover{background:var(--hi-soft)}
.folds{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.fold{border:1.5px solid var(--line);border-radius:12px;background:#fff}
.fold[open]{border-color:var(--ink)}
.fold summary{list-style:none;display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;min-height:62px;border-radius:12px}
.fold summary::-webkit-details-marker{display:none}
.fold summary:hover{background:var(--hi-soft)}
.fold .fn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--math);font-size:16px}
.fold[open] .fn{background:var(--hi)}
.fold .ft{flex:1;display:flex;flex-direction:column;line-height:1.35}
.fold .ft b{font-family:var(--display);font-size:19px}
.fold .ft small{color:var(--ink-soft);font-size:15px}
.fold[open] .ft small{display:none}
.fold .chev{flex:none;width:11px;height:11px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
.fold[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
.fold .fb{padding:4px 18px 18px}
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.quad{grid-template-columns:repeat(2,1fr)}}
.figcap .rm{font-size:18px}
.lgs{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:13px;color:var(--ink-soft);margin-top:2px}

<script>
"use strict";
/* ───────── 공통 도구 ───────── */
const TAU=Math.PI*2;
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function mulberry(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const newSeed=()=>Math.floor(Math.random()*2**31);
const KD=['','일','이','삼','사','오','육','칠','팔','구'];
function kn(n){if(n<10)return KD[n];const t=Math.floor(n/10),o=n%10;return(t>1?KD[t]:'')+'십'+KD[o]}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(msg){let box=$('#toasts');if(!box){box=el('<div id="toasts" aria-live="polite"></div>');document.body.appendChild(box)}const t=el(`<div class="toast" role="status">${msg}</div>`);box.appendChild(t);while(box.children.length>3)box.firstElementChild.remove();setTimeout(()=>t.remove(),2600)}
const CHECK='<svg width="14" height="14" viewBox="0 0 14 14" aria-label="완료"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const T=(key,label)=>`<button type="button" class="term" data-t="${key}">${label||key}</button>`;

/* ───────── 저장(이 기기 전용) ───────── */
const STORE_KEY='hangeoreum-math-v1',AUTH_KEY='hangeoreum-auth-v1',TKEY='hangeoreum-teacher-v1';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let AUTH=lsGet(AUTH_KEY,null);if(!AUTH||AUTH.role!=='student'||!AUTH.token)AUTH=null;
const isStudent=()=>!!(AUTH&&AUTH.role==='student');
const storeKey=()=>isStudent()?STORE_KEY+':'+AUTH.sid:STORE_KEY;
let DB={};
function loadDB(){DB=lsGet(storeKey(),{})||{};if(typeof DB!=='object'||Array.isArray(DB))DB={}}
loadDB();
const SYNC={timer:null,busy:false,pulling:false,last:null,err:null,contact:0};
/* 기록이 끝없이 커지지 않게 정리 (서버 저장 한도 300KB) */
function tidyDB(){const M=DB._me;if(M&&M.once&&typeof M.once==='object'){const d=new Date();d.setDate(d.getDate()-60);const cut=d.toISOString().slice(0,10);for(const k in M.once){const m=/^(?:drill|mis|misall|boss):(\d{4}-\d\d-\d\d)/.exec(k);if(m&&m[1]<cut)delete M.once[k]}}
  if(Array.isArray(DB._rev)&&DB._rev.length>50)DB._rev=DB._rev.slice(-50);
  for(const k in DB){const v=DB[k];if(v&&v.prac&&Array.isArray(v.prac.retry)&&v.prac.retry.length>20)v.prac.retry=v.prac.retry.slice(-20)}}
function markActive(){try{localStorage.setItem('hangeoreum-active',String(Date.now()))}catch(e){}}
function save(){tidyDB();DB._ts=Date.now();lsSet(storeKey(),DB);markActive();if(isStudent()){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>pushDB(),1500)}}
function prog(id){DB[id]=DB[id]||{concept:false,explore:false,steps:0,prac:{solved:0,streak:0,level:1,fails:0,retry:[]}};return DB[id]}


/* ───────── 내 기록: 포인트·배지·복습 (이 기기 전용) ───────── */
function today(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function addDays(ds,n){const[y,m,d]=ds.split('-').map(Number);return today(new Date(y,m-1,d+n))}
function me(){DB._me=DB._me||{pts:0,last:null,streak:0,once:{},cnt:{},badges:{}};const M=DB._me;M.once=M.once||{};M.cnt=M.cnt||{};M.badges=M.badges||{};return M}
function liveStreak(){const M=me(),t=today();return(M.last===t||M.last===addDays(t,-1))?M.streak:0}
function award(n,onceKey){if(onceKey&&/^(face:|floor:|dup:|rule:|net:|reduce|cls|cut)/.test(onceKey))dayBump('explore');const M=me();if(onceKey){if(M.once[onceKey])return false;M.once[onceKey]=1}
  const t=today();if(M.last!==t){M.streak=(M.last===addDays(t,-1))?M.streak+1:1;M.last=t}
  M.pts+=n;save();updatePill();popPts(n);checkBadges();queuePts(n);return true}
function bump(k,n=1){const M=me();M.cnt[k]=(M.cnt[k]||0)+n;save();checkBadges()}
const onceCount=(M,pre)=>Object.keys(M.once).filter(k=>k.startsWith(pre)).length;
const BADGES=[
  {k:'first',nm:'첫걸음',d:'처음으로 포인트 받기',ok:M=>M.pts>0},
  {k:'face5',nm:'면 모양 탐정',d:'면 목록 5개 완성하기',ok:M=>onceCount(M,'face:')>=5},
  {k:'floor9',nm:'층 세기 달인',d:'층 세기 9개 도형 모두 끝내기',ok:M=>onceCount(M,'floor:')>=9},
  {k:'regular',nm:'정다면체 도전자',d:'정이십면체나 정십이면체 끝까지 세기',ok:M=>!!(M.once['floor:ico']||M.once['floor:dod']||M.once['face:ico']||M.once['face:dod'])},
  {k:'nets',nm:'전개도 박사',d:'전개도 4가지 끝까지 펼치기',ok:M=>onceCount(M,'net:')>=4},

function faceNormal(V,f,c){let nx=0,ny=0,nz=0;for(let i=0;i<f.length;i++){const p=V[f[i]],q=V[f[(i+1)%f.length]];nx+=(p[1]-q[1])*(p[2]+q[2]);ny+=(p[2]-q[2])*(p[0]+q[0]);nz+=(p[0]-q[0])*(p[1]+q[1])}
  const L=Math.hypot(nx,ny,nz)||1;nx/=L;ny/=L;nz/=L;let fx=0,fy=0,fz=0;f.forEach(i=>{fx+=V[i][0];fy+=V[i][1];fz+=V[i][2]});fx/=f.length;fy/=f.length;fz/=f.length;
  if(c&&(fx-c[0])*nx+(fy-c[1])*ny+(fz-c[2])*nz<0){nx=-nx;ny=-ny;nz=-nz}return[nx,ny,nz]}
function makeMesh(V,F,o={}){
  const m={V,F,smooth:o.smooth||F.map(()=>false),hard:new Set(o.hard||[]),curved:!!o.curved};
  const em=new Map();
  F.forEach((f,fi)=>{for(let i=0;i<f.length;i++){const a=f[i],b=f[(i+1)%f.length];const k=Math.min(a,b)+'-'+Math.max(a,b);if(!em.has(k))em.set(k,{a:Math.min(a,b),b:Math.max(a,b),k,f:[]});em.get(k).f.push(fi)}});
  m.E=[...em.values()];
  const c=[0,0,0];V.forEach(p=>{c[0]+=p[0];c[1]+=p[1];c[2]+=p[2]});m.c=c.map(x=>x/V.length);
  m.N=F.map(f=>faceNormal(V,f,m.c));
  m.R=Math.max(...V.map(p=>Math.hypot(p[0]-m.c[0],p[1]-m.c[1],p[2]-m.c[2])));
  return m;
}
function regPoly(n,R,rot){rot=rot??(-Math.PI/2+Math.PI/n);const p=[];for(let k=0;k<n;k++){const t=rot+TAU*k/n;p.push([R*Math.cos(t),R*Math.sin(t)])}return p}
const range=n=>[...Array(n).keys()];
function prism(P,h,smooth){const n=P.length,V=[...P.map(p=>[p[0],p[1],0]),...P.map(p=>[p[0],p[1],h])];const F=[range(n).reverse(),range(n).map(i=>i+n)];const sm=[false,false];
  for(let i=0;i<n;i++){const j=(i+1)%n;F.push([i,j,j+n,i+n]);sm.push(!!smooth)}const m=makeMesh(V,F,{smooth:sm,curved:smooth});m.base=[0,1];return m}
function pyramid(P,h,smooth){const n=P.length;let cx=0,cy=0;P.forEach(p=>{cx+=p[0];cy+=p[1]});const V=[...P.map(p=>[p[0],p[1],0]),[cx/n,cy/n,h]];const F=[range(n).reverse()];const sm=[false];
  for(let i=0;i<n;i++){F.push([i,(i+1)%n,n]);sm.push(!!smooth)}const m=makeMesh(V,F,{smooth:sm,curved:smooth});m.base=[0];return m}
function frustum(P,k,h){const n=P.length;let cx=0,cy=0;P.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=n;cy/=n;
  const V=[...P.map(p=>[p[0],p[1],0]),...P.map(p=>[cx+k*(p[0]-cx),cy+k*(p[1]-cy),h])];const F=[range(n).reverse(),range(n).map(i=>i+n)];
  for(let i=0;i<n;i++){const j=(i+1)%n;F.push([i,j,j+n,i+n])}const m=makeMesh(V,F);m.base=[0,1];return m}
function octahedron(R){const V=[[R,0,0],[-R,0,0],[0,R,0],[0,-R,0],[0,0,R],[0,0,-R]];const F=[];
  [0,1].forEach(x=>[2,3].forEach(y=>[4,5].forEach(z=>F.push([x,y,z]))));return makeMesh(V,F)}
function sphere(R,nu=30,nv=16){const V=[[0,0,R]];for(let i=1;i<nv;i++){const ph=Math.PI*i/nv;for(let j=0;j<nu;j++){const th=TAU*j/nu;V.push([R*Math.sin(ph)*Math.cos(th),R*Math.sin(ph)*Math.sin(th),R*Math.cos(ph)])}}V.push([0,0,-R]);
  const S=V.length-1,id=(i,j)=>1+(i-1)*nu+(j%nu),F=[];
  for(let j=0;j<nu;j++)F.push([0,id(1,j),id(1,j+1)]);
  for(let i=1;i<nv-1;i++)for(let j=0;j<nu;j++)F.push([id(i,j),id(i+1,j),id(i+1,j+1),id(i,j+1)]);
  for(let j=0;j<nu;j++)F.push([S,id(nv-1,j+1),id(nv-1,j)]);
  const eq=nv/2,hard=[];for(let j=0;j<nu;j++){const a=id(eq,j),b=id(eq,j+1);hard.push(Math.min(a,b)+'-'+Math.max(a,b))}
  return makeMesh(V,F,{smooth:F.map(()=>true),hard,curved:true})}

function icosahedron(e=1.1){const r=e/(2*Math.sin(Math.PI/5)),dz=Math.sqrt(e*e-(2*r*Math.sin(Math.PI/10))**2),dz2=Math.sqrt(e*e-r*r);
  const V=[[0,0,dz/2+dz2]];for(let k=0;k<5;k++){const t=TAU*k/5;V.push([r*Math.cos(t),r*Math.sin(t),dz/2])}for(let k=0;k<5;k++){const t=TAU*k/5+Math.PI/5;V.push([r*Math.cos(t),r*Math.sin(t),-dz/2])}V.push([0,0,-dz/2-dz2]);
  const U=k=>1+(k%5),D=k=>6+(k%5),F=[];for(let k=0;k<5;k++){F.push([0,U(k),U(k+1)]);F.push([U(k),D(k),U(k+1)]);F.push([D(k),D(k+1),U(k+1)]);F.push([11,D(k+1),D(k)])}return makeMesh(V,F)}
function dodecahedron(){const I=icosahedron(1.65);const C=I.F.map(f=>{const c=[0,0,0];f.forEach(i=>{for(let q=0;q<3;q++)c[q]+=I.V[i][q]/3});return c});
  const F=I.V.map((v,vi)=>{const L=Math.hypot(...v),n=v.map(x=>x/L);let u=Math.abs(n[0])<0.9?[1,0,0]:[0,1,0];const d=u[0]*n[0]+u[1]*n[1]+u[2]*n[2];u=u.map((x,q)=>x-d*n[q]);const ul=Math.hypot(...u);u=u.map(x=>x/ul);
    const w=[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]];
    const fs=I.F.map((f,fi)=>f.includes(vi)?fi:-1).filter(x=>x>=0);
    return fs.sort((a,b)=>{const A=C[a].map((x,q)=>x-v[q]),B=C[b].map((x,q)=>x-v[q]);return Math.atan2(A[0]*w[0]+A[1]*w[1]+A[2]*w[2],A[0]*u[0]+A[1]*u[1]+A[2]*u[2])-Math.atan2(B[0]*w[0]+B[1]*w[1]+B[2]*w[2],B[0]*u[0]+B[1]*u[1]+B[2]*u[2])})});
  return makeMesh(C,F)}

/* ───────── 뷰어(캔버스 3D) ───────── */
const VIEWERS=new Set();
const HI='#ffe266';
class Viewer{
  constructor(canvas,o={}){
    this.cv=canvas;this.ctx=canvas.getContext('2d');this.o=o;
    this.yaw=o.yaw??-0.55;this.pitch=o.pitch??0.42;this.auto=!!o.auto&&!reduced;this.style=o.style||'shade';this.pad=o.pad??0.40;
    this.scene=[];this.marks={f:new Set(),e:new Set(),v:new Set()};this.mode=null;this.dirty=true;this.userMoved=false;
    if(o.interactive!==false)this._bind();
    this._resize();VIEWERS.add(this);
    if('ResizeObserver' in window){this.ro=new ResizeObserver(()=>this._resize());this.ro.observe(canvas)}
    this.visible=true;if('IntersectionObserver' in window){this.io=new IntersectionObserver(es=>{es.forEach(en=>{this.visible=en.isIntersecting;if(this.visible)this.dirty=true})});this.io.observe(canvas)}
  }
  flyTo(yaw,pitch,ms=450){let d=yaw-this.yaw;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;this.anim={y0:this.yaw,p0:this.pitch,dy:d,dp:pitch-this.pitch,t0:performance.now(),ms:reduced?1:ms};this.userMoved=true}
  stepAnim(){const A=this.anim;if(!A)return;let t=Math.min(1,(performance.now()-A.t0)/A.ms);const e=t*t*(3-2*t);this.yaw=A.y0+A.dy*e;this.pitch=A.p0+A.dp*e;this.dirty=true;if(t>=1)this.anim=null}
  _resize(){const d=window.devicePixelRatio||1;const w=this.cv.clientWidth||300,h=this.cv.clientHeight||300;if(w===this.w&&h===this.h)return;this.w=w;this.h=h;this.cv.width=Math.round(w*d);this.cv.height=Math.round(h*d);this.ctx.setTransform(d,0,0,d,0,0);this.dirty=true;this.draw()}
  setScene(sc,o={}){this.scene=sc;this.cen=o.center||sc[0].mesh.c;this.R=o.R||Math.max(...sc.map(s=>s.mesh.R));this.dirty=true}
  setMesh(m){this.marks={f:new Set(),e:new Set(),v:new Set()};this.setScene([{mesh:m}])}
  get scale(){return Math.min(this.w,this.h)*this.pad/(this.R||1)}
  proj(p){const a=this.yaw,b=this.pitch,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);const c=this.cen||[0,0,0];
    const x=p[0]-c[0],y=p[1]-c[1],z=p[2]-c[2];const x1=x*ca-y*sa,y1=x*sa+y*ca;const s=this.scale;
    return[this.w/2+(this.o.dx||0)+s*x1,this.h/2+(this.o.dy||0)-s*(y1*sb+z*cb),-y1*cb+z*sb]}
  facing(n){const y1=n[0]*Math.sin(this.yaw)+n[1]*Math.cos(this.yaw);return -y1*Math.cos(this.pitch)+n[2]*Math.sin(this.pitch)}
  _bind(){
    const cv=this.cv;let st=null;
    cv.addEventListener('pointerdown',e=>{this.touch=e.pointerType==='touch';st={x:e.clientX,y:e.clientY,yaw:this.yaw,pitch:this.pitch,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
    cv.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.moved&&Math.hypot(dx,dy)>6){st.moved=true;this.dragging=true}
      if(st.moved){this.yaw=st.yaw+dx*0.011;this.pitch=Math.max(-1.57,Math.min(1.57,st.pitch+dy*0.011));this.anim=null;this.userMoved=true;this.dirty=true}});
    const end=e=>{if(!st)return;if(!st.moved&&this.mode){const r=cv.getBoundingClientRect();this.tap(e.clientX-r.left,e.clientY-r.top)}st=null;this.dragging=false};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',()=>{st=null;this.dragging=false});
  }
  tap(x,y){
    const m=this.scene[0].mesh,P=m.V.map(v=>this.proj(v));let hit=null;
    if(this.mode==='f'){m.F.forEach((f,i)=>{if(this.facing(m.N[i])<=1e-6)return;if(inPoly(x,y,f.map(k=>P[k])))hit=i});
      }
    else if(this.mode==='v'){let best=1e9;P.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y)-p[2]*2;if(Math.hypot(p[0]-x,p[1]-y)<(this.touch?32:24)&&d<best){best=d;hit=i}})}
    else if(this.mode==='e'){let best=1e9;m.E.forEach(e=>{const A=P[e.a],B=P[e.b];const d=segDist(x,y,A,B);if(d<(this.touch?22:16)){const sc=d-(A[2]+B[2]);if(sc<best){best=sc;hit=e.k}}})}
    if(this.onHit){if(hit!=null)this.onHit(this.mode,hit);this.dirty=true;return}
    if(hit!=null)toggle(this.marks[this.mode],hit);
    this.dirty=true;if(hit!=null&&this.onMark)this.onMark();
  }
  draw(){
    if(!this.w)return;if(!this.scene.length&&!this.o.draw)return;const ctx=this.ctx;ctx.clearRect(0,0,this.w,this.h);
    if(this.o.draw){this.o.draw(ctx,this);}
    else{this.scene.forEach((s,i)=>{this.drawMesh(s.mesh,s.off,s.st||{});if(this.o.between)this.o.between(ctx,this,i)})}
    if(this.o.after)this.o.after(ctx,this);
  }
  drawMesh(m,off=[0,0,0],st={}){
    const ctx=this.ctx,tb=this.style==='textbook';
    const P=m.V.map(v=>this.proj([v[0]+off[0],v[1]+off[1],v[2]+off[2]]));
    const fr=m.N.map(n=>this.facing(n)>1e-6);
    const L=[-0.45,-0.55,0.7];
    m.F.forEach((f,i)=>{if(!fr[i])return;ctx.beginPath();f.forEach((k,j)=>{const p=P[k];j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.closePath();
      let col;
      const hc=this.fcol&&this.fcol(i);
      if(hc)col=hc;
      else if(this.marks.f.has(i)&&this.mode)col=HI;
      else if(tb)col='#ffffff';
      else{const n=m.N[i];const lam=Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);const base=st.tint||[232,237,247];const k=0.86+0.14*lam;col=`rgb(${base.map(c=>Math.round(c*k+ (255-c)*0.0)).join(',')})`;
        col=`rgb(${base.map(c=>Math.min(255,Math.round(c*k+40*lam))).join(',')})`}
      ctx.fillStyle=col;ctx.fill();if(m.smooth[i]&&!tb){ctx.strokeStyle=col;ctx.lineWidth=.8;ctx.stroke()}});
    const vis=[],hid=[];
    m.E.forEach(e=>{const sm=e.f.every(fi=>m.smooth[fi]);const hard=!sm||m.hard.has(e.k);const any=e.f.some(fi=>fr[fi]);
      if(hard)(any?vis:hid).push(e);else if(e.f.length===2&&fr[e.f[0]]!==fr[e.f[1]])vis.push(e)});
    const lw=tb?2.2:2.4;
    if(this.ecol){ctx.lineCap='round';ctx.lineWidth=11;m.E.forEach(e=>{const c=this.ecol(e.k);if(c){ctx.strokeStyle=c;line(ctx,P[e.a],P[e.b])}})}
    else if(this.mode==='e'){ctx.lineCap='round';ctx.strokeStyle='rgba(255,210,40,.95)';ctx.lineWidth=11;m.E.forEach(e=>{if(this.marks.e.has(e.k))line(ctx,P[e.a],P[e.b])})}
    if(st.noHidden!==true){ctx.setLineDash([5,5]);ctx.strokeStyle=tb?'#222':'#3b4256';ctx.lineWidth=tb?1.5:1.5;hid.forEach(e=>line(ctx,P[e.a],P[e.b]));ctx.setLineDash([])}
    ctx.strokeStyle=st.stroke||'#151a28';ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';vis.forEach(e=>line(ctx,P[e.a],P[e.b]));
    if(this.mode==='v'){P.forEach((p,i)=>{const front=m.F.some((f,fi)=>fr[fi]&&f.includes(i));ctx.beginPath();const vc=this.vcol&&this.vcol(i);ctx.arc(p[0],p[1],(vc||this.marks.v.has(i))?8.5:5.5,0,TAU);
      ctx.fillStyle=vc||(this.marks.v.has(i)?HI:(front?'#151a28':'#fff'));ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle='#151a28';ctx.stroke()})}
    return P;
  }
}
function toggle(s,k){s.has(k)?s.delete(k):s.add(k)}
function line(ctx,A,B){ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}
function segDist(x,y,A,B){const dx=B[0]-A[0],dy=B[1]-A[1];const L=dx*dx+dy*dy||1;let t=((x-A[0])*dx+(y-A[1])*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(A[0]+t*dx-x,A[1]+t*dy-y)}
(function loop(){for(const v of VIEWERS){if(!v.cv.isConnected){VIEWERS.delete(v);v.ro&&v.ro.disconnect();v.io&&v.io.disconnect();continue}
  if(v.tick)v.tick();v.stepAnim();if(!v.visible)continue;if(v.auto&&!v.dragging&&!v.userMoved){v.yaw+=0.006;v.dirty=true}if(v.dirty){v.dirty=false;v.draw()}}requestAnimationFrame(loop)})();

/* 교과서 글씨 */
function cssW(ctx){return ctx.canvas.clientWidth||ctx.canvas.width}
function mtext(ctx,text,x,y,o={}){ctx.save();const size=o.size||21;ctx.font=`${o.italic?'italic ':''}${size}px "Times New Roman",Times,serif`;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
  if(!o.align||o.align==='center'){const hw=ctx.measureText(text).width/2+4,W=cssW(ctx);x=Math.min(Math.max(x,hw),W-hw)}
  ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(text,x,y);ctx.fillStyle=o.color||'#111';ctx.fillText(text,x,y);ctx.restore()}
function ktext(ctx,text,x,y,o={}){ctx.save();const size=o.size||16;ctx.font=`${o.bold?'700 ':''}${size}px "IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif`;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
  if(o.halo!==false){ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(text,x,y)}ctx.fillStyle=o.color||'#1d2640';ctx.fillText(text,x,y);ctx.restore()}
function chip(ctx,text,x,y,o={}){ctx.save();const it=!!o.italic,size=o.size||(it?22:17);
  ctx.font=it?`italic ${size}px "Times New Roman",Times,serif`:`700 ${size}px "IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(text).width,pw=w/2+8,ph=size/2+5;{const W=cssW(ctx);x=Math.min(Math.max(x,pw+2),W-pw-2)}ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-pw,y-ph,pw*2,ph*2,8);else ctx.rect(x-pw,y-ph,pw*2,ph*2);
  ctx.fillStyle=o.bg||'#fff';ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle=o.border||'#2a4d9e';ctx.stroke();ctx.fillStyle=o.color||'#1d2640';ctx.fillText(text,x,y+1);ctx.restore();return pw*2}
const lab=(ctx,text,x,y,o={})=>o.chip?chip(ctx,text,x,y,o):mtext(ctx,text,x,y,o);
function edgeLabel(ctx,v,a,b,text,o={}){const A=v.proj(a),B=v.proj(b);const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;let nx=-(B[1]-A[1]),ny=B[0]-A[0];const L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;
  const C=o.from?v.proj(o.from):v.proj(v.cen);if((mx-C[0])*nx+(my-C[1])*ny<0){nx=-nx;ny=-ny}if(o.flip){nx=-nx;ny=-ny}
  ctx.font=o.chip?'700 17px "IBM Plex Sans KR",sans-serif':'21px "Times New Roman",serif';const tw=ctx.measureText(text).width+(o.chip?16:0);const off=(o.off??14)+Math.abs(nx)*tw/2+Math.abs(ny)*(o.chip?14:8);lab(ctx,text,mx+nx*off,my+ny*off,o)}

/* 교과서 형식 정지 그림 */
/* f.visual: 1~3단계용(색·회전·이름표), 아니면 4단계 연습용 교과서 형식 */
function figure(canvas,f){
  const vis=!!f.visual;
  const v=new Viewer(canvas,{style:vis?'shade':'textbook',interactive:vis,chip:vis,yaw:f.yaw??-0.5,pitch:f.pitch??0.36,pad:f.pad??0.36,dy:f.dy||0,
    after:(ctx,vw)=>{(f.labels||[]).forEach(L=>edgeLabel(ctx,vw,L[0],L[1],L[2],Object.assign({chip:vis},L[3]||{})));if(f.after)f.after(ctx,vw)}});
  v.setScene([{mesh:f.mesh,st:f.st||(vis?{tint:[236,239,245]}:{})}],{R:f.R,center:f.center});return v}
const HL_BASE='#9fbcf2',HL_SIDE='#f7c97f';
function applyHl(v,m,hl){v.fcol=null;v.ecol=null;v.vcol=null;v.mode=null;v.dirty=true;if(!hl)return;
  const base=m.base||[],side=m.F.map((f,i)=>i).filter(i=>!base.includes(i)),top=base.length>1?[base[1]]:base.slice(0,1);
  const keysOf=fs=>{const K=new Set();fs.forEach(fi=>{const f=m.F[fi];f.forEach((a,j)=>{const b=f[(j+1)%f.length];K.add(Math.min(a,b)+'-'+Math.max(a,b))})});return K};
  if(hl==='base')v.fcol=i=>base.includes(i)?HL_BASE:null;
  else if(hl==='base1')v.fcol=i=>top.includes(i)?HL_BASE:null;
  else if(hl==='side')v.fcol=i=>side.includes(i)?HL_SIDE:null;
  else if(hl==='all')v.fcol=i=>base.includes(i)?HL_BASE:HL_SIDE;
  else if(hl==='E')v.ecol=()=>'#e08a1e';
  else if(hl==='A')v.fcol=()=>HL_SIDE;
  else if(hl.startsWith('V:')){const t=+hl.slice(2);v.mode='v';v.vcol=i=>i===t?'#e08a1e':null;v.fcol=i=>m.F[i].includes(t)?HL_SIDE:null}
  else if(hl==='baseEdge'){const K=keysOf(top);v.ecol=k=>K.has(k)?'rgba(42,77,158,.8)':null;v.fcol=i=>top.includes(i)?'#e6eefc':null}
  else if(hl[0]==='F'){const kind=hl[1],I=floorInfo(m),gi=(k,id)=>I.G[k].findIndex(g=>g.ids.includes(id));
    if(kind==='v'){v.mode='v';v.vcol=i=>GC[gi('v',i)%5]}if(kind==='e')v.ecol=k=>GC[gi('e',k)%5]+'cc';if(kind==='f')v.fcol=i=>FC[gi('f',i)%5]}}

/* ───────── 전개도 펼치기 ───────── */
function buildUnfold(P,h,t,smooth){
  const n=P.length;const[x0,y0]=P[0];const ang=Math.atan2(P[1][1]-y0,P[1][0]-x0);const c=Math.cos(-ang),s=Math.sin(-ang);
  const Q=P.map(([x,y])=>{x-=x0;y-=y0;return[x*c-y*s,x*s+y*c]});
  const Ls=[],ext=[];for(let i=0;i<n;i++){const a=Q[i],b=Q[(i+1)%n],d=Q[(i+2)%n];Ls.push(Math.hypot(b[0]-a[0],b[1]-a[1]));let e=Math.atan2(d[1]-b[1],d[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]);while(e>Math.PI)e-=TAU;while(e<=-Math.PI)e+=TAU;ext.push(e)}
  let px=0,py=0,phi=0;const faces=[];
  for(let i=0;i<n;i++){const nx=px+Ls[i]*Math.cos(phi),ny=py+Ls[i]*Math.sin(phi);faces.push({kind:'side',pts:[[px,py,0],[nx,ny,0],[nx,ny,h],[px,py,h]],sl:smooth&&i>0,sr:smooth&&i<n-1});px=nx;py=ny;phi+=ext[i]*(1-t)}
  const th=t*Math.PI/2,ct=Math.cos(th),st=Math.sin(th);
  faces.push({kind:'base',pts:Q.map(([u,w])=>[u,w*ct,-w*st])});
  faces.push({kind:'base',pts:Q.map(([u,w])=>[u,w*ct,h+w*st])});
  return{faces,perim:Ls.reduce((a,b)=>a+b,0),L0:Ls[0],maxW:Math.max(...Q.map(q=>q[1]))}}
function bbox(faces){const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];faces.forEach(f=>f.pts.forEach(p=>{for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],p[i]);mx[i]=Math.max(mx[i],p[i])}}));return{c:mn.map((v,i)=>(v+mx[i])/2),r:Math.hypot(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])/2}}
function unfoldViewer(canvas,o){
  const U={t:o.t??0,shape:o.shape};
  const v=new Viewer(canvas,{yaw:-0.6,pitch:0.42,pad:o.pad||0.6,draw:(ctx,vw)=>drawUnfold(ctx,vw,U,o)});
  U.set=sh=>{U.shape=sh;const a=buildUnfold(sh.P,sh.h,0,sh.smooth),b=buildUnfold(sh.P,sh.h,1,sh.smooth);U.b0=bbox(a.faces);U.b1=bbox(b.faces);v.R=U.b1.r;v.cen=U.b0.c;v.scene=[{mesh:{c:U.b0.c,R:U.b1.r}}];v.dirty=true};
  U.set(o.shape);U.v=v;return U}
function drawUnfold(ctx,vw,U,o){
  if(!U.b0)return;const sh=U.shape,t=U.t;const B=buildUnfold(sh.P,sh.h,t,sh.smooth);
  const e=t*t*(3-2*t);vw.cen=U.b0.c.map((c,i)=>c+(U.b1.c[i]-c)*e);
  if(!vw.userMoved){vw.yaw=-0.6*(1-e);vw.pitch=0.42*(1-e)+0.02*e}
  const items=B.faces.map(f=>{const P=f.pts.map(p=>vw.proj(p));const d=P.reduce((a,p)=>a+p[2],0)/P.length;return{f,P,d}}).sort((a,b)=>a.d-b.d);
  items.forEach(({f,P})=>{ctx.beginPath();P.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
    ctx.fillStyle=f.kind==='base'?(o.textbook?'#fff':'#e6eefc'):(o.textbook?'#fff':'#fff4c2');ctx.fill();
    ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=2.2;ctx.strokeStyle='#151a28';
    if(f.kind==='base'){ctx.stroke()}else{line(ctx,P[2],P[3]);if(!f.sl)line(ctx,P[3],P[0]);if(!f.sr)line(ctx,P[1],P[2]);
      ctx.strokeStyle=o.textbook?'#151a28':'#2a4d9e';ctx.lineWidth=o.textbook?2.2:4;line(ctx,P[0],P[1])}});
  if(!o.textbook){const bb=items.find(i=>i.f===B.faces[B.faces.length-2]);ctx.strokeStyle='#2a4d9e';ctx.lineWidth=4;ctx.beginPath();bb.P.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke()}
  if(t>0.97&&o.areas&&sh.areas){const fmtA=x=>{const r=Math.round(x*100)/100;return String(r)};
    B.faces.forEach((f,fi)=>{const P=f.pts;if(f.kind==='side'){if(sh.smooth)return;const L=Math.hypot(P[1][0]-P[0][0],P[1][1]-P[0][1],P[1][2]-P[0][2]);const c=vw.proj([(P[0][0]+P[1][0])/2,(P[0][1]+P[2][1])/2,sh.h/2]);chip(ctx,fmtA(L*sh.h),c[0],c[1],{size:14,bg:'#fff',border:'#e08a1e'})}
      else{let cx=0,cy=0,cz=0;P.forEach(p=>{cx+=p[0];cy+=p[1];cz+=p[2]});const c=vw.proj([cx/P.length,cy/P.length,cz/P.length]);chip(ctx,sh.areas.base,c[0],c[1],{size:14,bg:'#fff',border:'#2a4d9e'})}});
    if(sh.smooth){const c=vw.proj([B.perim/2,0,sh.h*0.72]);chip(ctx,sh.areas.lateral,c[0],c[1],{size:14,bg:'#fff',border:'#e08a1e'})}}
  if(t>0.97&&o.labels!==false){
    const A=vw.proj([0,0,0]),Bp=vw.proj([B.perim,0,0]),Tp=vw.proj([B.perim,0,sh.h]);
    ctx.strokeStyle='#2a4d9e';ctx.lineWidth=1.6;
    if(sh.inside){const y=A[1]-12;arrow(ctx,[A[0]+4,y],[Bp[0]-4,y]);ktext(ctx,sh.perimLabel,(A[0]+Bp[0])/2,(A[1]+Tp[1])/2,{color:'#2a4d9e',bold:true,size:16})}
    else{const y=A[1]+16;arrow(ctx,[A[0],y],[Bp[0],y]);const lx=(vw.proj([B.L0,0,0])[0]+Bp[0])/2;ktext(ctx,sh.perimLabel||'밑면의 둘레',lx,y+18,{color:'#2a4d9e',bold:true,size:16})}
    const x=Bp[0]+16;arrow(ctx,[x,Bp[1]],[x,Tp[1]]);
    if(sh.hItalic)mtext(ctx,sh.hLabel,x+16,(Bp[1]+Tp[1])/2,{italic:true,size:22});else ktext(ctx,sh.hLabel||'높이',x+10,(Bp[1]+Tp[1])/2,{align:'left',bold:true,size:16});
  }
}
function arrow(ctx,A,B){line(ctx,A,B);const a=Math.atan2(B[1]-A[1],B[0]-A[0]);[[A,a+Math.PI],[B,a]].forEach(([P,an])=>{ctx.beginPath();ctx.moveTo(P[0],P[1]);ctx.lineTo(P[0]-9*Math.cos(an-0.4),P[1]-9*Math.sin(an-0.4));ctx.moveTo(P[0],P[1]);ctx.lineTo(P[0]-9*Math.cos(an+0.4),P[1]-9*Math.sin(an+0.4));ctx.stroke()})}

const TERMS={
  '다각형':{k:'초등 · 평면도형',b:`<p>선분으로만 둘러싸인 평면도형이에요. 변이 3개면 삼각형, 4개면 사각형, ….</p><p>원은 굽은 선(곡선)이 있으니까 다각형이 <b>아니에요</b>.</p>`,fig:'polys'},
  'n각형':{k:'다각형',b:`<p>변이 <span class="math">n</span>개인 다각형이에요. 변이 <span class="math">n</span>개면 꼭짓점도 <span class="math">n</span>개예요.</p><p>예) 오각형: 변 5개, 꼭짓점 5개</p>`},
  '입체도형':{k:'초등 · 도형',b:`<p>공간을 차지하는 도형이에요. 상자, 주사위, 캔처럼 손으로 쥘 수 있는 모양을 떠올리세요.</p><p>종이 위에 그려지는 ${T('평면도형')}과 비교해 보세요.</p>`,fig:'solid'},
  '평면도형':{k:'초등 · 도형',b:`<p>한 평면 위에 있는 도형이에요. 삼각형, 사각형, 원처럼 종이 위에 납작하게 그려져요. 두께가 없어요.</p><p>상자나 캔 같은 ${T('입체도형')}과 비교해 보세요.</p>`,fig:'flat'},
  '곡면':{k:'입체도형',b:`<p>평평하지 않고 둥글게 굽은 면이에요. 캔의 옆면, 공의 겉면이 곡면이에요.</p><p>곡면이 하나라도 있으면 ${T('다각형')}으로만 둘러싸인 게 아니니 다면체가 아니에요.</p>`},
  '합동':{k:'도형',b:`<p>모양과 크기가 똑같아서 완전히 포개어지는 두 도형을 서로 합동이라고 해요.</p><p>각기둥의 두 밑면은 합동이에요.</p>`},
  '평행':{k:'도형',b:`<p>두 직선(또는 두 평면)을 아무리 늘여도 만나지 않을 때 평행하다고 해요.</p><p>각기둥의 두 밑면은 위아래로 마주 보며 평행해요.</p>`},
  '사다리꼴':{k:'초등 · 사각형',b:`<p>마주 보는 한 쌍의 변이 서로 ${T('평행')}한 사각형이에요.</p>`,fig:'trap'},
  '넓이':{k:'초등 · 측정',b:`<p>평면도형이 차지하는 크기예요. 한 변이 1 cm인 정사각형(1 cm²)이 몇 개 들어가는지로 나타내요.</p><p>가장 기본은 ${T('직사각형의 넓이')}예요.</p>`,fig:'grid'},
  '직사각형의 넓이':{k:'초등 · 넓이',b:`<p class="formula">(가로) × (세로)</p><p>가로 4 cm, 세로 3 cm이면 1 cm² 정사각형이 4개씩 3줄 → 12 cm²</p>`,fig:'grid'},
  '삼각형의 넓이':{k:'초등 · 넓이',b:`<p class="formula">(밑변) × (높이) ÷ 2</p><p>직사각형을 대각선으로 자른 절반이에요. 직각삼각형은 직각을 낀 두 변을 곱해서 2로 나누면 돼요.</p>`,fig:'tri'},
  '원주율':{k:'6학년 · 원',b:`<p>원의 둘레가 지름의 몇 배인지 나타내는 수로, 약 3.14예요. 중학교에서는 기호 <span class="rm">π</span>(파이)로 써요.</p><p>답은 3.14로 계산하지 않고 <span class="rm">12π</span>처럼 π를 붙여 나타내요.</p>`},
  '원의 넓이':{k:'6학년 · 원',b:`<p class="formula">π × (반지름) × (반지름)</p><p>반지름이 3 cm이면 π × 3 × 3 = <span class="rm">9π</span> (cm²)</p><p>${T('원주율')} π가 뭔지 다시 보기</p>`,fig:'circle'},
  '원의 둘레':{k:'6학년 · 원',b:`<p class="formula">2 × π × (반지름)</p><p>지름 × π와 같아요. 반지름이 3 cm이면 2 × π × 3 = <span class="rm">6π</span> (cm)</p>`,fig:'circle'},
  '둘레':{k:'초등 · 측정',b:`<p>도형의 바깥을 한 바퀴 도는 길이예요. 다각형이면 모든 변의 길이를 더해요.</p><p>원이면 ${T('원의 둘레')}를 써요.</p>`},
  '전개도':{k:'입체도형',b:`<p>입체도형의 모서리를 잘라 평면 위에 펼쳐 놓은 그림이에요. 전개도의 넓이가 곧 입체도형의 겉넓이예요.</p>`},

const pop=$('#pop');let popStack=[],popAnchor=null,popPinned=false,popHideT=null;
function showTerm(key,anchor,push){
  const t=TERMS[key];if(!t)return;dayTerm(key);
  if(push)popStack.push(key);else popStack=[key];
  if(anchor){popAnchor&&popAnchor.classList.remove('open');popAnchor=anchor;anchor.classList.add('open')}
  pop.innerHTML=`<div class="kicker">${t.k} · 미리 알아야 할 것</div><div class="pop-h">${popStack.length>1?'<button type="button" data-back aria-label="이전 용어로">‹</button>':''}<h4>${key}</h4><button type="button" data-close aria-label="닫기">✕</button></div>${t.b}${t.fig?'<canvas></canvas>':''}${t.fig3?`<div class="pfig3">${t.fig3.map(()=>'<canvas></canvas>').join('')}</div>`:''}`;
  pop.hidden=false;
  if(t.fig)termFig($('canvas',pop),t.fig);
  if(t.fig3)$$('.pfig3 canvas',pop).forEach((cv,i)=>{const F=t.fig3[i],m=SOLIDS[F.s].mk();const v=figure(cv,{visual:true,mesh:m,pitch:0.34,pad:0.4});applyHl(v,m,F.hl)});
  if(popAnchor&&innerWidth>640){const r=popAnchor.getBoundingClientRect();const pw=pop.offsetWidth,ph=pop.offsetHeight;let x=Math.min(innerWidth-pw-12,Math.max(12,r.left));let y=r.bottom+8;if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-8);pop.style.left=x+'px';pop.style.top=y+'px'}
}
function hideTerm(){pop.hidden=true;popStack=[];popPinned=false;popAnchor&&popAnchor.classList.remove('open');popAnchor=null}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.term');
  if(tb){e.preventDefault();const inPop=pop.contains(tb);if(!inPop&&popAnchor===tb&&popPinned&&!pop.hidden){hideTerm();return}showTerm(tb.dataset.t,inPop?null:tb,inPop);popPinned=true;return}
  if(e.target.closest('[data-close]')){hideTerm();return}
  if(e.target.closest('[data-back]')){popStack.pop();const k=popStack.pop();showTerm(k,null,true);return}
  if(!pop.hidden&&!pop.contains(e.target))hideTerm();
});
const canHover=matchMedia('(hover: hover)').matches;
if(canHover){
  document.addEventListener('mouseover',e=>{const tb=e.target.closest('.term');if(tb&&!pop.contains(tb)){clearTimeout(popHideT);if(popAnchor!==tb||pop.hidden){popPinned=false;showTerm(tb.dataset.t,tb,false)}}
    else if(pop.contains(e.target))clearTimeout(popHideT)});
  document.addEventListener('mouseout',e=>{const tb=e.target.closest('.term');if((tb&&!pop.contains(tb))||(pop.contains(e.target)&&!pop.contains(e.relatedTarget))){if(!popPinned){clearTimeout(popHideT);popHideT=setTimeout(()=>{if(!popPinned)hideTerm()},350)}}});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTerm()});

    wrap.appendChild(box);return wrap}

  const render=()=>{$('.val',field).innerHTML=val?val.replace(/π/g,'<span class="rm">π</span>'):'<span class="ph">?</span>'};
  const press=k=>{if(k==='⌫')val=val.slice(0,-1);else if(k==='확인'){if(!val)return;if(onTry(val)===false){field.classList.add('shake');setTimeout(()=>field.classList.remove('shake'),400)}return}
    else if(k==='π'){if(!val.includes('π'))val+='π'}else if(k==='.'){if(!val.includes('.')&&!val.includes('π'))val+=(val?'':'0')+'.'}else{if(val.includes('π'))return;if(val.length<7)val=(val==='0'?'':val)+k}render()};
  L.forEach(k=>{if(k===''){keys.appendChild(el('<span></span>'));return}const b=el(`<button type="button" class="${k==='확인'?'ok':k==='0'?'zero':k==='⌫'?'fn':''}">${k==='π'?'<span class="rm">π</span>':k}</button>`);b.onclick=()=>press(k);keys.appendChild(b)});

}

  lab(ctx,lr||r+' cm',(C[0]+Rp[0])/2,(C[1]+Rp[1])/2-18,{italic:!!lr,chip:v.o.chip});
  let best=null;for(let k=0;k<64;k++){const th=TAU*k/64;const p=v.proj([r*Math.cos(th),r*Math.sin(th),0]);if(!best||p[0]>best.p[0])best={p,th}}
  const T2=v.proj([r*Math.cos(best.th),r*Math.sin(best.th),h]);ctx.font='21px "Times New Roman",serif';const ht=lh||h+' cm';const tw=ctx.measureText(ht).width+(v.o.chip?16:0);lab(ctx,ht,best.p[0]+12+tw/2,(best.p[1]+T2[1])/2,{italic:!!lh,chip:v.o.chip})}

/* 오늘의 계산: 짧고 쉬운 계산을 빠르고 정확하게 (작업기억을 문제 이해에 쓰도록) */
function drillQs(seed){const r=mulberry(seed);
  const mul=()=>{const a=ri(r,2,9),b=ri(r,2,9);return{q:`<span class="rm">${a} × ${b}</span>`,ans:a*b,type:'num'}};
  const mul2=()=>{const a=ri(r,11,19),b=ri(r,2,9);return{q:`<span class="rm">${a} × ${b}</span>`,ans:a*b,type:'num'}};
  const rect=()=>{const a=ri(r,3,12),b=ri(r,2,9);return{q:`가로 <span class="rm">${a} cm</span>, 세로 <span class="rm">${b} cm</span>인<br>직사각형의 넓이`,ans:a*b,type:'num',suffix:'cm²'}};
  const tri=()=>{let a=ri(r,2,12),b=ri(r,2,10);if((a*b)%2)a++;return{q:`밑변 <span class="rm">${a} cm</span>, 높이 <span class="rm">${b} cm</span>인<br>삼각형의 넓이`,ans:a*b/2,type:'num',suffix:'cm²'}};
  const per=()=>{const a=ri(r,3,12),b=ri(r,2,9);return{q:`가로 <span class="rm">${a} cm</span>, 세로 <span class="rm">${b} cm</span>인<br>직사각형의 둘레`,ans:2*(a+b),type:'num',suffix:'cm'}};
  const pi1=()=>{const k=ri(r,2,9);return{q:`<span class="rm">π × ${k} × ${k}</span>`,ans:k*k,type:'pi'}};
  const pi2=()=>{const k=ri(r,2,9);return{q:`<span class="rm">2 × π × ${k}</span>`,ans:2*k,type:'pi'}};
  const cnt=()=>{const tp=pick(r,['prism','pyramid','frustum']),Ty=TYPE[tp],n=ri(r,3,9),pp=pick(r,['F','E','V']);return{q:`${kn(n)}${Ty.nm}의<br>${PART[pp]}의 개수`,ans:Ty[pp](n),type:'num',suffix:'개'}};
  const eq=()=>{const a=ri(r,2,5),n=ri(r,3,12);return{q:`<span class="rm">${a}<i>n</i> = ${a*n}</span>일 때,<br><i class="math">n</i>의 값`,ans:n,type:'num'}};
  return shuffle(r,[mul,mul,mul2,rect,tri,per,pi1,pi2,cnt,eq].map(f=>f()))}
function viewDrill(){
  crumbs.innerHTML=`<span class="sep">›</span><span>오늘의 계산</span>`;
  const D=DB._drill=DB._drill||{};
  app.innerHTML=`<div class="unit-head"><div><h1>오늘의 계산</h1><p>짧은 계산이 손에 붙으면, 문제를 풀 때 머릿속 자리를 생각하는 데 쓸 수 있어요. 빠르기보다 <b>정확하게</b>가 먼저예요.</p></div></div>
   <div class="card panel"><div class="drill"><div class="dbar"></div><div class="dmeta"><span class="dNo"></span><span class="dTime">0:00</span></div><div class="dq"></div><div class="dIn"></div><div class="dflash"></div></div></div>`;
  const Q=drillQs(newSeed()).map(q=>Object.assign(q,{state:null}));const queue=Q.slice();let first=0,t0=performance.now(),timer=null,busy=false;
  const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  timer=setInterval(()=>{const tt=$('.dTime',app);if(!tt){clearInterval(timer);return}tt.textContent=fmt(performance.now()-t0)},500);
  const bar=()=>{$('.dbar',app).innerHTML=Q.map(q=>`<i class="${q.state==='ok'?'ok':q.state==='bad'?'bad':q===queue[0]?'cur':''}"></i>`).join('')};
  function ask(){busy=false;bar();const q=queue[0];if(!q){return finish()}
    $('.dNo',app).textContent=q.retry?'다시 한 번':`${Q.indexOf(q)+1} / ${Q.length}`;$('.dq',app).innerHTML=q.q;$('.dflash',app).textContent='';$('.dflash',app).className='dflash';
    const host=$('.dIn',app);host.innerHTML='';
    host.appendChild(answerUI({type:q.type,suffix:q.suffix},v=>{if(busy)return true;const r=check({type:q.type,ans:q.ans},v);const fl=$('.dflash',app);
      if(r===true){busy=true;if(!q.retry){q.state='ok';first++}queue.shift();fl.textContent='정답!';fl.className='dflash ok';setTimeout(ask,reduced?0:380);return true}
      if(r==='nopi'){fl.textContent='π를 붙여서 답해요. 예) 12π';fl.className='dflash bad';return false}
      busy=true;if(!q.retry){q.state='bad'}fl.innerHTML=`정답은 <span class="rm">${q.type==='pi'?(q.ans===1?'':q.ans)+'π':q.ans}</span>${q.suffix?' '+q.suffix:''}. 끝에 한 번 더 나와요.`;fl.className='dflash bad';
      queue.shift();if(!q.retry)queue.push(Object.assign({},q,{retry:true}));setTimeout(ask,reduced?0:1500);return true}))}
  function finish(){clearInterval(timer);const ms=performance.now()-t0;const best=D.best;const isBest=first>=8&&(!best||ms<best);if(isBest)D.best=ms;
    const firstToday=D.last!==today();D.last=today();D.lastScore=first;D.runs=(D.runs||0)+1;save();bump('drill');dayBump('drill');if(first>=8)dayBump('drill8');if(first)award(first);award(5,'drill:'+today());
    $('.dq',app).innerHTML='';$('.dflash',app).textContent='';$('.dNo',app).textContent='끝!';bar();
    $('.dIn',app).innerHTML=`<div class="feedback ok" style="text-align:center">첫 시도에 맞힌 문제 <b class="rm">${first}</b> / ${Q.length} · 걸린 시간 <b class="rm">${fmt(ms)}</b><br>${isBest?'최고 기록이에요!':D.best?`내 최고 기록은 ${fmt(D.best)} (8문제 이상 맞혔을 때)`:'8문제 이상 맞히면 최고 기록이 남아요.'}</div>
      <div class="next-row" style="justify-content:center"><a class="btn" href="#home">처음 화면으로</a><button type="button" class="btn primary dAgain">한 번 더</button></div>`;
    $('.dAgain',app).onclick=()=>viewDrill()}
  ask();
}

function viewSteps(body,id){
  const p=prog(id);
  const wrap=el(`<div><div class="card panel"><div class="statbar"><div class="stat"><small>단계 문제를 끝까지 푼 횟수</small><b>${p.steps}</b></div>

function viewPractice(body,id){
  const p=prog(id),P=p.prac;
  const wrap=el(`<div class="card panel"><div class="statbar">
     <div class="stat"><small>푼 문제</small><b id="sSolved">${P.solved}</b></div>
     <div class="stat"><small>연속 정답</small><b id="sStreak">${P.streak}</b></div>
     <span class="lvl" id="sLvl"></span>${(DB._rev||[]).length?`<a class="lvl" style="margin-left:0;background:#fff" href="#review">복습 노트 ${dueReviews().length?'· 오늘 '+dueReviews().length+'문제':'· '+(DB._rev||[]).length+'문제 대기'}</a>`:''}</div><div id="practHost"></div></div>`);
  body.appendChild(wrap);
  const upd=()=>{$('#sSolved',wrap).textContent=P.solved;$('#sStreak',wrap).textContent=P.streak;$('#sLvl',wrap).textContent=P.level>=2?'단계 없이 도전 중':'단계 따라 풀기';save()};
  function next(){
    let seed,isRetry=false;
    P.retry.forEach(x=>x.due--);const ri_=P.retry.findIndex(x=>x.due<=0);
    if(ri_>=0){seed=P.retry[ri_].seed;P.retry.splice(ri_,1);isRetry=true}else seed=newSeed();
    const prob=GEN[id](seed);
    if(isRetry)prob.title+='<span class="retry-tag">다시 도전</span>';
    renderProblem($('#practHost',wrap),prob,{mode:P.level>=2?'final':'steps',onDone:({good,usedSteps,mode,wrongs,stepWrongs,revealed,box})=>{
      logAttempt({lesson:id,kind:'practice',good,wrongs,mode,gen:id,seed,ptype:prob.ptype,stepWrongs,revealed});dayBump('prac');if(good&&wrongs===0)dayBump('clean');
      P.solved++;award(good?(mode==='final'&&!usedSteps&&prob.steps.length>1?5:3):1);if(!good||wrongs>=2){addReview(id,seed,id);box.insertAdjacentHTML('afterbegin','<span style="flex-basis:100%;font-size:15px">헷갈린 문제라 복습 노트에 넣었어요.</span>')}
      if(good){P.fails=0;if(prob.steps.length>1&&P.level<2){P.streak++;if(P.streak>=3){P.level=2;toast('3번 연속 성공! 이제 단계 없이 도전해요.')}}else if(prob.steps.length>1&&!usedSteps){P.streak++}else{P.streak++}}
      else{P.streak=0;P.fails++;P.retry.push({seed,due:2});if(P.level>=2&&P.fails>=2){P.level=1;P.fails=0;toast('다시 단계를 따라 풀어 봐요.')}}
      upd();const nb=el('<button type="button" class="btn primary">다음 문제 →</button>');nb.onclick=next;box.appendChild(nb);nb.focus()}});
  }
  upd();next();
}

function drawPlates(ctx,vw,base,I,labels){
  I.lv.forEach((z,f)=>{const ids=I.G.v.find(q=>q.key==='v'+f).ids;let cx=0,cy=0;ids.forEach(i=>{cx+=base.V[i][0];cy+=base.V[i][1]});cx/=ids.length;cy/=ids.length;
    const r=Math.max(0.28,...ids.map(i=>Math.hypot(base.V[i][0]-cx,base.V[i][1]-cy)))*1.18+0.18;
    const pts=range(40).map(q=>vw.proj([cx+r*Math.cos(TAU*q/40),cy+r*Math.sin(TAU*q/40),z]));
    if(!labels){ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='rgba(42,77,158,.07)';ctx.fill();ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(42,77,158,.4)';ctx.lineWidth=1.3;ctx.stroke();ctx.setLineDash([])}
    else{const L=pts.reduce((a,p)=>p[0]<a[0]?p:a,pts[0]);ktext(ctx,`${f+1}층`,L[0]-6,L[1],{align:'right',bold:true,size:15,color:'#2a4d9e'})}})}
function floorFig(canvas,mesh,kind,o={}){
  const I=floorInfo(mesh);const gi=(k,id)=>I.G[k].findIndex(g=>g.ids.includes(id));
  const v=new Viewer(canvas,{interactive:false,yaw:o.yaw??-0.5,pitch:o.pitch??0.3,pad:o.pad??0.40,draw:(ctx,vw)=>{drawPlates(ctx,vw,mesh,I,false);vw.drawMesh(mesh);drawPlates(ctx,vw,mesh,I,true)}});
  if(kind==='v'){v.mode='v';v.vcol=i=>GC[gi('v',i)%5]}
  if(kind==='e')v.ecol=k=>GC[gi('e',k)%5]+'cc';
  if(kind==='f')v.fcol=i=>FC[gi('f',i)%5];
  v.setScene([{mesh}],{R:mesh.R*1.12});return I}
function floorCap(I,kind){const parts=I.G[kind].map((g,i)=>`<span style="color:${GC[i%5]};font-weight:700">${g.ids.length}</span>`);
  return `${KIND_NM[kind]} = <span class="rm">${parts.join(' + ')} = ${I.G[kind].reduce((a,g)=>a+g.ids.length,0)}</span>`}
function floorLegend(I,kind){return I.G[kind].map((g,i)=>`<span class="lg"><i style="background:${kind==='f'?FC[i%5]:GC[i%5]}"></i>${g.label}</span>`).join('')}
const fold=(i,title,tease,inner,open)=>`<details class="fold" data-i="${i}"${open?' open':''}><summary><span class="fn">${i}</span><span class="ft"><b>${title}</b><small>${tease}</small></span><span class="chev" aria-hidden="true"></span></summary><div class="fb">${inner}</div></details>`;
const foldPanel=(title,lead,folds)=>`<div class="card panel"><div class="fold-head"><h2>${title}</h2><div class="fold-tools"><button type="button" data-all="1">모두 펼치기</button><button type="button" data-all="0">모두 접기</button></div></div>${lead}<div class="folds">${folds}</div></div>`;
function wireFolds(body,id){
  const p=prog(id);const D=$$('details.fold',body);
  if(p.fold)D.forEach(d=>{if(d.dataset.i in p.fold)d.open=p.fold[d.dataset.i]});

function floorInfo(m){
  const zs=m.V.map(v=>v[2]).sort((a,b)=>a-b),lv=[];zs.forEach(z=>{if(!lv.length||z-lv[lv.length-1]>1e-4)lv.push(z)});
  const fi=m.V.map(v=>lv.findIndex(l=>Math.abs(l-v[2])<=1e-4));const top=lv.length-1;
  const G={v:[],e:[],f:[]};
  const add=(kind,key,label,z,id,floors)=>{let g=G[kind].find(g=>g.key===key);if(!g){g={key,label,z,floors,ids:[]};G[kind].push(g)}g.ids.push(id)};
  m.V.forEach((v,i)=>add('v','v'+fi[i],`${fi[i]+1}층`,lv[fi[i]],i,[fi[i]]));
  m.E.forEach(e=>{const a=fi[e.a],b=fi[e.b];if(a===b)add('e','in'+a,`${a+1}층 안`,lv[a],e.k,[a]);
    else{const lo=Math.min(a,b),hi=Math.max(a,b);add('e','bt'+lo+'-'+hi,`${lo+1}층과 ${hi+1}층 사이`,(lv[lo]+lv[hi])/2,e.k,[lo,hi])}});
  m.F.forEach((f,i)=>{const fs=f.map(k=>fi[k]),lo=Math.min(...fs),hi=Math.max(...fs);
    if(lo===hi)add('f','fl'+lo,lo===top?'지붕':lo===0?'바닥':`${lo+1}층 바닥`,lv[lo]+(lo===top?1e-3:-1e-3),i,[lo]);
    else add('f','w'+lo+'-'+hi,'벽',(lv[lo]+lv[hi])/2,i,range(hi-lo+1).map(q=>lo+q))});
  const walls=G.f.filter(g=>g.key[0]==='w');if(walls.length>1)walls.forEach(g=>{g.label=`벽 (${g.floors[0]+1}~${g.floors[g.floors.length-1]+1}층)`});
  ['v','e','f'].forEach(k=>G[k].sort((a,b)=>b.z-a.z));
  return{lv,fi,G,n:lv.length}}
const KIND_NM={v:'꼭짓점',e:'모서리',f:'면'};
const DIGIT_JONG={'0':21,'1':8,'2':0,'3':16,'4':0,'5':0,'6':1,'7':8,'8':8,'9':0};
function jong(w){const ch=String(w).slice(-1);if(ch in DIGIT_JONG)return DIGIT_JONG[ch];const c=ch.charCodeAt(0)-0xAC00;return(c>=0&&c<11172)?c%28:0}
function josa(w,a,b){return w+(jong(w)?a:b)}
function josaRo(w){const j=jong(w);return w+((j&&j!==8)?'으로':'로')}
const KIND_TIP={v:'같은 높이에 있는 꼭짓점끼리 한 층이에요.',e:'층 안 모서리는 바닥 둘레, 층 사이 모서리는 층과 층을 잇는 기둥이나 계단이에요.',f:'지붕과 바닥, 그리고 옆을 둘러싼 벽으로 나누어 세요.'};

    <div class="ctrl">

    </div></div>`;

  const S={key:keys[0],base:null,info:null,ph:'floors',gi:0,found:{v:new Set(),e:new Set(),f:new Set()},doneG:{v:[],e:[],f:[]},gap:0,showFloors:false,msg:''};

  const groupOfId=(kind,id)=>S.info.G[kind].findIndex(g=>g.ids.includes(id));
  v.vcol=i=>{if(S.ph==='floors')return null;if(S.found.v.has(i))return S.ph==='v'&&groupOfId('v',i)===S.gi?HI:DONE_COL.v;return null};
  v.ecol=k=>{if(S.found.e.has(k))return S.ph==='e'&&groupOfId('e',k)===S.gi?'rgba(255,210,40,.95)':DONE_COL.e;return null};
  v.fcol=i=>{if(S.found.f.has(i))return S.ph==='f'&&groupOfId('f',i)===S.gi?HI:DONE_COL.f;return null};

      if(n===g.ids.length){S.doneG[kind].push(g.ids.length);S.msg=`<span class="ok">${g.label} ${KIND_NM[kind]} ${g.ids.length}개!</span>`;S.gi++;
        if(S.gi>=G.length){S.msg=`<span class="ok">${josa(KIND_NM[kind],'을','를')} 모두 셌어요.</span>`}render()}else render()}

  function drawAll(ctx,vw){

      const r=Math.max(0.28,...ids.map(i=>Math.hypot(S.base.V[i][0]-cx,S.base.V[i][1]-cy)))*1.18+0.18;
      const pts=range(40).map(q=>vw.proj([cx+r*Math.cos(TAU*q/40),cy+r*Math.sin(TAU*q/40),z+f*g]));return{f,pts}});

    vw.drawMesh(m);
    if(S.showFloors)plates.forEach(({f,pts})=>{const L=pts.reduce((a,p)=>p[0]<a[0]?p:a,pts[0]);ktext(ctx,`${f+1}층`,L[0]-8,L[1],{align:'right',bold:true,size:16,color:act.includes(f)?'#8a6300':'#2a4d9e'})});
  }
  function eqLine(kind){const G=S.info.G[kind];const parts=G.map((g,i)=>i<S.doneG[kind].length?S.doneG[kind][i]:'?');const done=S.doneG[kind].length===G.length;
    return `<div class="${kind===S.ph?'cur':''}"><b>${KIND_NM[kind]}</b> = <span class="rm">${parts.join(' + ')}${done?' = '+parts.reduce((a,b)=>a+b,0):''}</span></div>`}

function reduceActivity(host,onDone){
  host.innerHTML=`<div class="explore"><div class="stage"><canvas class="rdCv" aria-label="면의 개수를 줄여 보는 그림"></canvas><span class="hint">끌어서 돌려 보세요</span></div>

      <div class="feedback info rdTxt"></div><p class="muted" style="margin:0;font-size:15px">진한 색은 면의 <b>안쪽</b>이에요. 안쪽이 보인다는 건 어딘가 뚫려 있다는 뜻이에요.</p></div></div>`;
  const P=regPoly(3,1.2),H=1.75;const base=pyramid(P,H);const V=base.V,cen=base.c;
  const S={n:3,th:0,target:0,reported:false};
  const TXT={2:'면 2개는 책처럼 펼쳐질 뿐이에요. 안쪽 공간을 둘러싸지 못해요.',3:'면 3개를 이어 붙이면 아래가 뚫린 텐트가 돼요. 아래에서 올려다보면 속(진한 색)이 다 보여요. 아직 다면체가 아니에요.',
    4:'아래 면을 붙이니 빈틈없이 막혔어요! 면이 4개인 <b>사면체(삼각뿔)</b>가 가장 적은 면으로 만들 수 있는 다면체예요. 그래서 면이 3개인 다면체는 없어요.'};
  const rotBase=p=>{const a=V[0],ax=v3.sub(V[1],a),al=v3.len(ax),u=ax.map(x=>x/al);const d=v3.sub(p,a),k=v3.dot(d,u),par=u.map(x=>x*k),perp=v3.sub(d,par),f=Math.PI-S.th,c=Math.cos(f),s=Math.sin(f),cr=v3.cross(u,perp);
    return[a[0]+par[0]+perp[0]*c-cr[0]*s,a[1]+par[1]+perp[1]*c-cr[1]*s,a[2]+par[2]+perp[2]*c-cr[2]*s]};
  const poly=(ctx,P2,fill,stroke,dash)=>{ctx.beginPath();P2.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.setLineDash(dash||[]);ctx.lineJoin='round';ctx.lineWidth=dash?1.6:2.4;ctx.strokeStyle=stroke;ctx.stroke();ctx.setLineDash([])}};
  const v=new Viewer($('.rdCv',host),{pad:0.36,yaw:-0.5,pitch:-0.62,draw:(ctx,vw)=>{
    const sides=[[0,1,3],[1,2,3],[2,0,3]],polys=sides.slice(0,S.n===2?2:3).map(f=>f.map(i=>V[i]));
    if(S.n<4)poly(ctx,[V[0],V[1],V[2]].map(p=>vw.proj(p)),null,'#7a86a3',[6,5]);
    if(S.n===2)poly(ctx,[V[2],V[0],V[3]].map(p=>vw.proj(p)),null,'#7a86a3',[6,5]);
    if(S.n===4)polys.push([V[0],V[1],rotBase(V[2])]);
    const items=polys.map(pts=>{const Pp=pts.map(p=>vw.proj(p));let n=v3.cross(v3.sub(pts[1],pts[0]),v3.sub(pts[2],pts[0]));const c=pts.reduce((q,p)=>[q[0]+p[0]/3,q[1]+p[1]/3,q[2]+p[2]/3],[0,0,0]);
      if(v3.dot(n,v3.sub(c,cen))<0)n=n.map(x=>-x);const L=v3.len(n);n=n.map(x=>x/L);return{Pp,out:vw.facing(n)>0,d:Pp.reduce((a,p)=>a+p[2],0)/3}}).sort((a,b)=>a.d-b.d);
    items.forEach(({Pp,out})=>poly(ctx,Pp,out?'rgba(219,230,250,.97)':'rgba(112,136,190,.97)','#151a28'));
    if(S.n===3){const C=vw.proj([cen[0],cen[1],0]);chip(ctx,'뚫린 곳',C[0],C[1],{bg:'#fff6c7',border:'#b88a00',size:15})}
    if(S.n===4&&S.th>3.1)chip(ctx,'빈틈없이 막혔어요 → 사면체',vw.w/2,26,{bg:'#e5f4ea',border:'#2b7a4b',color:'#2b7a4b',size:15})}});
  v.setScene([{mesh:base}],{R:1.5,center:[cen[0],cen[1],H*0.32]});
  v.tick=()=>{if(S.n===4&&Math.abs(S.th-S.target)>0.002){S.th+=Math.sign(S.target-S.th)*Math.min(Math.abs(S.target-S.th),reduced?9:0.04);v.dirty=true;if(S.th>3.1&&!S.reported){S.reported=true;onDone&&onDone()}}};
  const set=n=>{S.n=n;$$('.rdSeg button',host).forEach(b=>b.classList.toggle('on',+b.dataset.n===n));$('.rdTxt',host).innerHTML=TXT[n];if(n===4){S.th=0;S.target=Math.PI}v.dirty=true};
  $$('.rdSeg button',host).forEach(b=>b.onclick=()=>set(+b.dataset.n));set(3);
}

const REG=[{k:'tet',nm:'정사면체',face:'정삼각형',n:3,deg:3,F:4,E:6,V:4},{k:'cube',nm:'정육면체',face:'정사각형',n:4,deg:3,F:6,E:12,V:8},{k:'oct',nm:'정팔면체',face:'정삼각형',n:3,deg:4,F:8,E:12,V:6},
  {k:'dod',nm:'정십이면체',face:'정오각형',n:5,deg:3,F:12,E:30,V:20},{k:'ico',nm:'정이십면체',face:'정삼각형',n:3,deg:5,F:20,E:30,V:12}];
const REG_FLOOR={tet:'1+3',cube:'4+4',oct:'1+4+1',dod:'5+5+5+5',ico:'1+5+5+1'};
const REG_FLOOR_X={cube:['2+4+2','4+4+4'],oct:['2+4','1+3+1','4+4'],dod:['5+10+5','1+5+5+1','5+5+5'],ico:['1+5+1','5+5+5','1+10+1']};
const REG_OF={'3,3':'tet','3,4':'oct','3,5':'ico','4,3':'cube','5,3':'dod'};
const POLY_NM={3:'정삼각형',4:'정사각형',5:'정오각형',6:'정육각형'},inAng=n=>(n-2)*180/n;
function bipyramid(R=1.15){const B=regPoly(3,R),h=R*Math.SQRT2;const V=[...B.map(p=>[p[0],p[1],0]),[0,0,h],[0,0,-h]];
  const F=[];for(let i=0;i<3;i++){const j=(i+1)%3;F.push([i,j,3],[j,i,4])}return makeMesh(V,F)}
function topVertex(m){let b=0;m.V.forEach((p,i)=>{const s=p[2]-0.001*p[1],t=m.V[b][2]-0.001*m.V[b][1];if(s>t+1e-9)b=i});return b}
/* 한 꼭짓점에 정다각형 k개를 모은 그림 */
function fanSVG(n,k,size=240){const O=size/2,a=inAng(n)*Math.PI/180,s=size*(n>=5?0.24:0.29),Rc=s/(2*Math.sin(Math.PI/n)),f=v=>v.toFixed(1),sum=inAng(n)*k;
  let g='';for(let j=0;j<k;j++){const th=-Math.PI/2+j*a,cx=O+Rc*Math.cos(th+a/2),cy=O+Rc*Math.sin(th+a/2),p0=th+a/2+Math.PI;
    const pts=range(n).map(i=>[cx+Rc*Math.cos(p0+2*Math.PI*i/n),cy+Rc*Math.sin(p0+2*Math.PI*i/n)]);
    g+=`<polygon points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="${FC[j%5]}" fill-opacity="${sum>360?0.62:0.9}" stroke="#1d2640" stroke-width="2" stroke-linejoin="round"/>`}
  if(sum<360){const r=s*0.75,t0=-Math.PI/2+k*a,t1=1.5*Math.PI,large=(t1-t0)>Math.PI?1:0;
    g+=`<path d="M${O} ${O} L${f(O+r*Math.cos(t0))} ${f(O+r*Math.sin(t0))} A${r} ${r} 0 ${large} 1 ${f(O+r*Math.cos(t1))} ${f(O+r*Math.sin(t1))} Z" fill="rgba(210,59,59,.14)" stroke="#d23b3b" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    const tm=(t0+t1)/2;g+=`<text x="${f(O+r*0.62*Math.cos(tm))}" y="${f(O+r*0.62*Math.sin(tm)+5)}" text-anchor="middle" font-family="Times New Roman,serif" font-size="${size>150?17:13}" font-weight="700" fill="#b02a2a">${360-sum}°</text>`}

  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${POLY_NM[n]} ${k}개를 한 꼭짓점에 모은 그림, 각의 합 ${sum}도">${g}</svg>`}
function vtxFig(cv,mesh,marks,o={}){const v=new Viewer(cv,{auto:o.auto!==false,pad:0.40,yaw:o.yaw??-0.5,pitch:o.pitch??0.38});v.mode='v';

/* 탐구: 한 꼭짓점에 모인 면 세기 (삼각쌍뿔 함정 포함) */

  let v=null;
  function show(){const q=Q[idx];if(!q)return end();const m=q.k==='bip'?bipyramid():SOLIDS[q.k].mk(),t=q.i??topVertex(m);if(v&&v.destroy)v.destroy();

    $('.vxQ',host).innerHTML=`<b>${q.nm}</b>${q.k==='bip'?` (${q.i===3?'꼭대기':'가운데'} 꼭짓점)`:''} · 주황색 꼭짓점에 모인 면은 몇 개인가요?`;$('.vxMsg',host).textContent='';
    $('.vxC',host).innerHTML=[3,4,5,6].map(n=>`<button type="button">${n}개</button>`).join('');
    const right=q.k==='bip'?(q.i===3?3:4):REG.find(R=>R.k===q.k).deg;

/* ───────── 게임: 오늘의 미션 · 꾸미기 상점 · 우리 반 보스전 ───────── */
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0};
function celebrate(msg){if(msg)toast(msg);if(reduced)return;const box=el('<div class="confetti" aria-hidden="true"></div>');
  const cols=['#ffe266','#8ec5ff','#ff8f8f','#7fdcb8','#c7a7ff','#ffb59b'];
  for(let i=0;i<36;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*0.35)+'s';p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2600)}

/* 오늘의 미션: 하루 3개. 하나에 +3, 셋 다 하면 +10 */
function dayState(){const t=today();let D=DB._day;if(!D||typeof D!=='object'||D.d!==t)D=DB._day={d:t,c:{},t:{},m:null};D.c=OBJ(D.c);D.t=OBJ(D.t);return D}
const MISSIONS={
  term3:{nm:'용어 카드 3개 열어 보기',k:'term',n:3},
  drill:{nm:'오늘의 계산 끝내기',k:'drill',n:1},
  steps1:{nm:'단계 문제 1개 끝까지 풀기',k:'steps',n:1},
  prac3:{nm:'연습 문제 3개 풀기',k:'prac',n:3},
  prac5:{nm:'연습 문제 5개 풀기',k:'prac',n:5},
  explore1:{nm:'탐구 활동 1개 끝내기',k:'explore',n:1},
  clean2:{nm:'연습 문제를 한 번도 안 틀리고 2개 맞히기',k:'clean',n:2},
  drill8:{nm:'오늘의 계산에서 8문제 이상 첫 시도에 맞히기',k:'drill8',n:1},
  review1:{nm:'복습 노트 문제 1개 풀기',k:'review',n:1},
  calc1:{nm:'기초 연산 한 세트 끝내기',k:'calc',n:1}};
function todayMissions(){const D=dayState();if(Array.isArray(D.m)&&D.m.length===3&&D.m.every(x=>MISSIONS[x]))return D.m;
  const r=mulberry(hashStr('mission:'+D.d));const A=pick(r,['term3','drill','calc1']),B=pick(r,['steps1','prac3']);
  let C=['explore1','clean2','drill8','prac5'];if(B==='prac3')C=C.filter(x=>x!=='prac5');if(A==='drill')C=C.filter(x=>x!=='drill8');if(dueReviews().length)C=C.concat(['review1','review1']);
  D.m=[A,B,pick(r,C)];save();return D.m}
const missionProg=id=>Math.min(MISSIONS[id].n,NUM(dayState().c[MISSIONS[id].k]));
function dayBump(k,n=1){const D=dayState();D.c[k]=NUM(D.c[k])+n;checkMissions()}
function dayTerm(key){const D=dayState();if(D.t[key])return;D.t[key]=1;D.c.term=Object.keys(D.t).length;checkMissions()}
function missionStreak(){const S=OBJ(DB._mis),t=today();return(S.last===t||S.last===addDays(t,-1))?NUM(S.streak):0}
function checkMissions(){const D=dayState(),ms=todayMissions();
  ms.forEach(id=>{if(missionProg(id)>=MISSIONS[id].n&&award(3,'mis:'+D.d+':'+id))toast(`오늘의 미션 완료 · ${MISSIONS[id].nm} (+3)`)});
  if(ms.every(id=>missionProg(id)>=MISSIONS[id].n)&&award(10,'misall:'+D.d)){const S=DB._mis=OBJ(DB._mis);S.streak=(S.last===addDays(D.d,-1))?NUM(S.streak)+1:1;S.last=D.d;bump('misall');setTimeout(()=>celebrate('오늘의 미션 3개를 모두 해냈어요! 보너스 +10'),700)}
  save();refreshMissionCard()}
function missionHref(id){const last=(DB._last&&LESSONS.find(l=>l.id===DB._last.id&&l.ready))||LESSONS.find(l=>l.ready);const L=last?last.id:'poly';
  return{term3:'#'+L,drill:'#drill',drill8:'#drill',steps1:'#'+L+'-steps',prac3:'#'+L+'-practice',prac5:'#'+L+'-practice',clean2:'#'+L+'-practice',explore1:'#'+L+'-explore',review1:'#review',calc1:'#calc'}[id]||'#home'}
function missionCardHTML(){const ms=todayMissions(),done=ms.filter(id=>missionProg(id)>=MISSIONS[id].n).length,sk=missionStreak();
  return`<div class="g-head"><b class="t">오늘의 미션</b><span class="k">${done}/3${done===3?' · 다 했어요!':' · 셋 다 하면 보너스 +10'}${sk?` · 미션 연속 ${sk}일`:''}</span></div>
  <ol class="mis">${ms.map(id=>{const M=MISSIONS[id],p=missionProg(id),ok=p>=M.n;return`<li class="${ok?'ok':''}"><span class="mchk">${ok?CHECK:''}</span><span class="mnm">${M.nm}${M.n>1?` <small class="rm">${p}/${M.n}</small>`:''}</span>${ok?'<span class="mpt rm">+3</span>':`<a class="mgo" href="${missionHref(id)}">하러 가기</a>`}</li>`}).join('')}</ol>`}

  const c=m.c,cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pitch),sP=Math.sin(pitch),s=r/m.R,L=[-0.45,-0.55,0.7],ll=Math.hypot(...L);

  P.forEach(p=>{const y=cy+p[1]*s;if(y<top)top=y});

    out+=`<polygon points="${f.map(k=>(cx+P[k][0]*s).toFixed(1)+','+(cy+P[k][1]*s).toFixed(1)).join(' ')}" fill="${shadeHex(color,0.74+0.46*d)}" stroke="${stroke}" stroke-width="${sw.toFixed(2)}" stroke-linejoin="round"/>`});
  return{svg:out,top}}
const AVM={};

      `<path d="M${f(x-10*u)} ${f(y+13*u)} Q${f(x)} ${f(y+6*u)} ${f(x+10*u)} ${f(y+13*u)}" fill="none" stroke="${k}" stroke-width="${f(2.8*u)}" stroke-linecap="round"/><path d="M${f(x-4*u)} ${f(y+9.6*u)} l${f(1.6*u)} ${f(3*u)} l${f(1.6*u)} ${f(-3.4*u)} M${f(x+1*u)} ${f(y+9.4*u)} l${f(1.6*u)} ${f(3*u)} l${f(1.6*u)} ${f(-3*u)}" fill="#fff" stroke="${k}" stroke-width="${f(1.1*u)}" stroke-linejoin="round"/>`}
  let s;
  if(kind==='sparkle')s=[-1,1].map(d=>`<circle cx="${f(x+d*e)}" cy="${f(y-2*u)}" r="${f(5.2*u)}" fill="${k}"/><circle cx="${f(x+d*e+1.8*u)}" cy="${f(y-4*u)}" r="${f(1.9*u)}" fill="#fff"/><circle cx="${f(x+d*e-1.6*u)}" cy="${f(y)}" r="${f(0.9*u)}" fill="#fff"/>`).join('');

function shopState(){const S=OBJ(DB._shop);S.spent=NUM(S.spent);S.own=OBJ(S.own);S.eq=OBJ(S.eq);DB._shop=S;return S}
function owns(c,id){const C=shopCat(c),it=C&&C.items.find(x=>x.id===id);return!!it&&(it.p===0||!!shopState().own[c+':'+id])}
function myEq(){const S=shopState(),o={};SHOP.forEach(C=>{const id=S.eq[C.cat];o[C.cat]=(id&&owns(C.cat,id))?id:C.items[0].id});return o}

function equipItem(c,id){if(!owns(c,id))return false;shopState().eq[c]=id;save();applyTheme();return true}
function buyItem(c,id){const it=shopItem(c,id);if(!it||it.id!==id)return false;if(owns(c,id))return equipItem(c,id);

  let v='',lock=false;
  const draw=()=>{$$('.dslot',w).forEach((d,i)=>{d.textContent=v[i]||'';d.classList.toggle('on',i<v.length)});
    $$('.dkeys button',w).forEach(b=>{const k=b.dataset.k;if(k==='go')b.disabled=lock||v.length!==len;else if(k==='⌫')b.disabled=lock||!v.length;else b.disabled=lock||v.length>=len||(distinct&&v.includes(k))})};
  const submit=()=>{if(lock||v.length!==len)return;lock=true;draw();const val=v;onSubmit(val,ok=>{lock=false;if(ok!==false)v='';draw()})};
  const press=k=>{if(lock)return;if(k==='go')return submit();if(k==='⌫')v=v.slice(0,-1);else if(v.length<len&&!(distinct&&v.includes(k))&&(zero||k!=='0'))v+=k;draw();if(auto&&v.length===len)setTimeout(submit,120)};

 {id:'pow',nm:'제곱수와 세제곱수',use:'원의 넓이 πr², 정육면체 부피',

 {id:'sub',nm:'식에 수 넣기',use:'n각기둥·각뿔의 면·모서리·꼭짓점 개수',

  gen(L,r){const n=ri(r,3,12);

 {id:'eq',nm:'거꾸로 풀기',use:'개수를 보고 몇 각기둥인지 찾을 때',

 {id:'area',nm:'넓이 공식',use:'겉넓이를 구할 때 면마다',
