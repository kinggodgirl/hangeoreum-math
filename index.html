  gen(L,r){if(L===1){if(r()<0.5){const a=ri(r,3,12),b=ri(r,2,9);return{q:`가로 ${M_(a+' cm')}, 세로 ${M_(b+' cm')}인<br>직사각형의 넓이`,ans:a*b,suffix:'cm²',hint:'가로 × 세로'}}const a=ri(r,3,12);return{q:`한 변이 ${M_(a+' cm')}인<br>정사각형의 넓이`,ans:a*a,suffix:'cm²',hint:`${M_(`${a} × ${a}`)}`}}
    if(L===2){if(r()<0.6){let a=ri(r,3,14),b=ri(r,2,10);if((a*b)%2)a++;return{q:`밑변 ${M_(a+' cm')}, 높이 ${M_(b+' cm')}인<br>삼각형의 넓이`,ans:a*b/2,suffix:'cm²',hint:`${M_(`${a} × ${b} ÷ 2`)} (÷ 2를 잊지 않았나요?)`}}const a=ri(r,3,12),b=ri(r,2,9);return{q:`밑변 ${M_(a+' cm')}, 높이 ${M_(b+' cm')}인<br>평행사변형의 넓이`,ans:a*b,suffix:'cm²',hint:'밑변 × 높이 (평행사변형은 ÷ 2가 없어요)'}}
    let a=ri(r,2,9),b=ri(r,a+1,14),h=ri(r,2,8);if(((a+b)*h)%2)h++;return{q:`윗변 ${M_(a+' cm')}, 아랫변 ${M_(b+' cm')}, 높이 ${M_(h+' cm')}인<br>사다리꼴의 넓이`,ans:(a+b)*h/2,suffix:'cm²',hint:`${M_(`(${a} + ${b}) × ${h} ÷ 2`)}`}}},
 {id:'pi',nm:'π가 있는 계산',use:'원기둥·원뿔·구',
  tip:`<p><b>π는 문자처럼</b> 남겨 둬요. ${M_('12π + 8π = 20π')}, ${M_('3 × 4π = 12π')}</p><p>원의 둘레 ${M_('2πr')}, 원의 넓이 ${M_('πr²')}. ${M_('π × 3²')} = ${M_('9π')} <span class="muted">(3을 먼저 제곱)</span></p><p class="muted">답은 ${M_('12π')}처럼 수 뒤에 π를 붙여서 써요. 입력판의 π 단추를 누르세요.</p>`,
  gen(L,r){if(L===1){const k=ri(r,0,2);if(k===0){const a=ri(r,2,20),b=ri(r,2,20);return{q:M_(`${a}π + ${b}π`),ans:a+b,type:'pi',hint:'π 앞의 수끼리 더해요.'}}if(k===1){const a=ri(r,12,30),b=ri(r,2,11);return{q:M_(`${a}π − ${b}π`),ans:a-b,type:'pi',hint:'π 앞의 수끼리 빼요.'}}const a=ri(r,2,9),b=ri(r,2,9);return{q:M_(`${a} × ${b}π`),ans:a*b,type:'pi',hint:`${M_(`${a} × ${b}`)}에 π를 붙여요.`}}
    if(L===2){const rr=ri(r,2,9);if(r()<0.5)return{q:`반지름 ${M_(rr+' cm')}인 원의 둘레<br>${M_('2 × π × '+rr)}`,ans:2*rr,type:'pi',suffix:'cm',hint:`${M_(`2 × ${rr}`)} = ${2*rr}에 π를 붙여요.`};return{q:`반지름 ${M_(rr+' cm')}인 원의 넓이<br>${M_(`π × ${rr}²`)}`,ans:rr*rr,type:'pi',suffix:'cm²',hint:`${M_(`${rr}²`)} = ${rr*rr} (${M_(`2 × ${rr}`)}가 아니에요!)`}}
    const rr=ri(r,2,5),h=ri(r,2,9);if(r()<0.5)return{q:`원기둥의 부피<br>${M_(`π × ${rr}² × ${h}`)}`,ans:rr*rr*h,type:'pi',suffix:'cm³',hint:`${M_(`${rr}² × ${h}`)} = ${M_(`${rr*rr} × ${h}`)}`};return{q:`원기둥의 옆넓이<br>${M_(`2 × π × ${rr} × ${h}`)}`,ans:2*rr*h,type:'pi',suffix:'cm²',hint:`${M_(`2 × ${rr} × ${h}`)}에 π를 붙여요.`}}},
 {id:'frac',nm:'분수 곱하기',use:'뿔의 부피 ⅓, 삼각형 ½',
  tip:`<p>${M_('⅓ ×')}는 <b>÷ 3</b>, ${M_('½ ×')}는 <b>÷ 2</b>예요. ${M_('⅓ × 12 = 4')}</p><p>곱하는 순서를 바꿔서 <b>나누어떨어지는 수부터</b> 나눠요. ${M_('⅓ × 5 × 9 = 5 × (9 ÷ 3) = 15')}</p>`,
  gen(L,r){if(L===1){if(r()<0.5){const a=ri(r,2,15)*2;return{q:M_(`½ × ${a}`),ans:a/2,hint:`${M_(`${a} ÷ 2`)}`}}const a=ri(r,2,12)*3;return{q:M_(`⅓ × ${a}`),ans:a/3,hint:`${M_(`${a} ÷ 3`)}`}}
    if(L===2){if(r()<0.4){let a=ri(r,3,12),b=ri(r,2,9);if((a*b)%2)b++;return{q:M_(`½ × ${a} × ${b}`),ans:a*b/2,hint:'짝수부터 2로 나눠 보세요.'}}const a=ri(r,2,9),b=ri(r,1,6)*3;const[x,y]=r()<0.5?[a,b]:[b,a];return{q:M_(`⅓ × ${x} × ${y}`),ans:a*b/3,hint:`3으로 나누어떨어지는 ${b}부터: ${M_(`${b} ÷ 3 = ${b/3}`)}`}}
    if(r()<0.6){const a=ri(r,2,6),b=ri(r,2,6),h=ri(r,1,4)*3;return{q:`각뿔의 부피<br>${M_(`⅓ × ${a} × ${b} × ${h}`)}`,ans:a*b*h/3,suffix:'cm³',hint:`높이 ${h}부터 3으로 나누면 ${h/3}, 그다음 ${M_(`${a} × ${b} × ${h/3}`)}`}}
    const rr=pick(r,[3,6]);return{q:`구의 부피<br>${M_(`<span class="fr"><sup>4</sup>⁄<sub>3</sub></span> × π × ${rr}³`)}`,ans:4*rr**3/3,type:'pi',suffix:'cm³',hint:`${M_(`${rr}³ = ${rr**3}`)}, ${M_(`${rr**3} ÷ 3 = ${rr**3/3}`)}, ${M_(`× 4`)}`}}},
 {id:'surf',nm:'겉넓이 더하기',use:'기둥의 겉넓이 = 밑넓이 × 2 + 옆넓이',
  tip:`<p>직육면체는 <b>같은 면이 2개씩</b> 있어요.</p><p>겉넓이 = ${M_('2 × (가로 × 세로 + 세로 × 높이 + 높이 × 가로)')}</p><p>기둥의 겉넓이 = ${M_('밑넓이 × 2 + 옆넓이')}</p>`,
  gen(L,r){if(L===1){const a=ri(r,6,30),b=ri(r,6,30),c=ri(r,6,30);return{q:M_(`2 × ${a} + ${b}`),ans:2*a+b,hint:`곱하기 먼저: ${M_(`2 × ${a}`)} = ${2*a}`,_:c}}
    if(L===2){const a=ri(r,4,25),b=ri(r,4,25),c=ri(r,4,25);return{q:M_(`2 × (${a} + ${b} + ${c})`),ans:2*(a+b+c),hint:`괄호 안 먼저: ${M_(`${a} + ${b} + ${c}`)} = ${a+b+c}`}}
    const a=ri(r,2,6),b=ri(r,2,6),c=ri(r,2,7);return{q:`가로 ${M_(a+' cm')}, 세로 ${M_(b+' cm')}, 높이 ${M_(c+' cm')}인<br>직육면체의 겉넓이`,ans:2*(a*b+b*c+c*a),suffix:'cm²',hint:`${M_(`2 × (${a}×${b} + ${b}×${c} + ${c}×${a})`)} = ${M_(`2 × (${a*b} + ${b*c} + ${c*a})`)}`}}}];
const CALC_LV=['1단계 · 쉬운 수','2단계 · 조금 큰 수','3단계 · 입체도형 문제처럼'];
function calcState(id){const C=DB._calc=OBJ(DB._calc);const s=C[id]=OBJ(C[id]);s.stars=Math.min(3,NUM(s.stars));s.best=OBJ(s.best);s.n=NUM(s.n);return s}
const calcStars=()=>CALC.reduce((a,t)=>a+Math.min(3,NUM(OBJ(OBJ(DB._calc)[t.id]).stars)),0);
const starRow=n=>`<span class="stars" aria-label="별 ${n}개">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')}</span>`;
function viewCalc(){crumbs.innerHTML=`<span class="sep">›</span><span>기초 연산</span>`;
  app.innerHTML=`<div class="unit-head"><div><h1>기초 연산</h1><p>입체도형 문제에서 자주 나오는 계산을 따로 연습해요. 계산이 손에 붙으면, 문제를 풀 때 <b>생각하는 데</b> 힘을 쓸 수 있어요.</p></div></div>
   <div class="card panel calc-sum"><div class="stat"><small>모은 별</small><b class="rm">${calcStars()} / ${CALC.length*3}</b></div><p class="muted" style="margin:0">한 단계에서 10문제 중 8문제 이상을 처음에 맞히면 별을 받고, 다음 단계가 열려요.</p><a class="btn" href="#drill">섞어서 10문제 (오늘의 계산)</a></div>
   <div class="calc-grid">${CALC.map(t=>{const s=calcState(t.id);return`<a class="card calc-card" href="#calc-${t.id}"><b>${t.nm}</b><small>${t.use}</small>${starRow(s.stars)}</a>`}).join('')}</div>`}
function viewCalcTopic(id){const T=CALC.find(t=>t.id===id);if(!T){location.hash='#calc';return}
  crumbs.innerHTML=`<span class="sep">›</span><a href="#calc">기초 연산</a><span class="sep">›</span><span>${T.nm}</span>`;
  const s=calcState(id);let L=Math.min(3,s.stars+1);
  const draw=()=>{const st=calcState(id);app.innerHTML=`<div class="unit-head"><div><h1>${T.nm}</h1><p>어디에 쓰여요? <b>${T.use}</b></p></div><div>${starRow(st.stars)}</div></div>
    <details class="card panel calc-tip" ${st.n?'':'open'}><summary><b>원리 한 장</b> <span class="muted">눌러서 ${st.n?'펼치기':'접기'}</span></summary><div class="tipbody">${T.tip}</div></details>
    <div class="card panel"><div class="seg calcLv" role="tablist">${[1,2,3].map(k=>`<button type="button" data-l="${k}" class="${k===L?'on':''}" ${k>st.stars+1?'disabled':''}>${k}단계${k<=st.stars?' ★':''}</button>`).join('')}</div>
     <p class="muted" style="margin:10px 0 0">${CALC_LV[L-1]}${L>st.stars+1?'':st.best[L]!=null?` · 내 최고 ${NUM(st.best[L])}/10`:''}</p>
     <p style="margin:14px 0 0"><button type="button" class="btn primary calcGo">10문제 시작</button></p></div>
    <div class="next-row" style="justify-content:flex-start"><a class="btn ghost" href="#calc">기초 연산 목록</a></div>`;
    $$('.calcLv button',app).forEach(b=>b.onclick=()=>{L=+b.dataset.l;draw()});
    $('.calcGo',app).onclick=()=>run()};
  function run(){const seed=newSeed(),r=mulberry(seed),Q=[];const seen=new Set();for(let i=0;i<40&&Q.length<10;i++){const q=T.gen(L,r);const k=q.q;if(seen.has(k))continue;seen.add(k);Q.push(Object.assign({type:'num'},q,{state:null}))}
    app.innerHTML=`<div class="unit-head"><div><h1>${T.nm} <small class="muted" style="font-size:18px">${L}단계</small></h1></div></div>
     <div class="card panel"><div class="drill"><div class="dbar"></div><div class="dmeta"><span class="dNo"></span><button type="button" class="t-mini calcStop">그만하기</button></div><div class="dq"></div><div class="dIn"></div><div class="dflash"></div></div></div>`;
    $('.calcStop',app).onclick=()=>draw();
    const queue=Q.slice();let first=0,busy=false;
    const bar=()=>{$('.dbar',app).innerHTML=Q.map(q=>`<i class="${q.state||(q===queue[0]?'cur':'')}"></i>`).join('')};
    function ask(){busy=false;bar();const q=queue[0];if(!q)return finish();
      $('.dNo',app).textContent=q.retry?'다시 한 번':`${Q.indexOf(q)+1} / ${Q.length}`;$('.dq',app).innerHTML=q.q;const fl=$('.dflash',app);fl.textContent='';fl.className='dflash';
      const host=$('.dIn',app);host.innerHTML='';
      host.appendChild(answerUI({type:q.type,suffix:q.suffix},v=>{if(busy)return true;const res=check({type:q.type,ans:q.ans},v);
        if(res===true){busy=true;if(!q.retry){if(q.tried)q.state='hint';else{q.state='ok';first++}}queue.shift();fl.textContent=q.tried?'맞았어요! 힌트를 보고 맞힌 문제는 별 계산에서 빠져요.':'정답!';fl.className='dflash ok';setTimeout(ask,reduced?0:(q.tried?900:350));return true}
        if(res==='nopi'){fl.textContent='π를 붙여서 답해요. 예) 12π';fl.className='dflash bad';return false}
        if(!q.tried){q.tried=true;fl.innerHTML=`다시 생각해 봐요. <span class="hint">${q.hint||''}</span>`;fl.className='dflash bad';return false}
        busy=true;if(!q.retry)q.state='bad';fl.innerHTML=`정답은 ${M_(fmtAns({type:q.type,ans:q.ans,suffix:q.suffix}))}. 끝에 한 번 더 나와요.`;fl.className='dflash bad';
        queue.shift();if(!q.retry)queue.push(Object.assign({},q,{retry:true,tried:false}));setTimeout(ask,reduced?0:1600);return true}))}
    function finish(){const st=calcState(id);st.n++;st.last=today();const prevBest=NUM(st.best[L]);if(first>prevBest||st.best[L]==null)st.best[L]=first;
      const need=Math.ceil(Q.length*0.8),star=first>=need&&L>st.stars;if(star)st.stars=L;save();dayBump('calc');if(first)award(first);if(star)award(5,'calc:'+id+':'+L);
      bar();$('.dq',app).innerHTML='';$('.dNo',app).textContent='끝!';$('.dflash',app).textContent='';
      $('.dIn',app).innerHTML=`<div class="feedback ${first>=8?'ok':''}" style="text-align:center">처음에 맞힌 문제 <b class="rm">${first}</b> / ${Q.length}<br>${star?`${L}단계 별을 받았어요!${L<3?' 다음 단계가 열렸어요.':' 이 계산은 다 익혔어요!'}`:first>=need?'잘했어요! 이미 받은 별이에요.':'8문제 이상 맞히면 별을 받아요. 원리 한 장을 다시 보고 도전해요.'}</div>
        <div class="next-row" style="justify-content:center"><button type="button" class="btn calcBack">${T.nm}</button><button type="button" class="btn primary calcAgain">${star&&L<3?'다음 단계':'한 번 더'}</button></div>`;
      if(star)celebrate('');
      $('.calcBack',app).onclick=()=>draw();$('.calcAgain',app).onclick=()=>{if(star&&L<3)L++;run()}}
    ask()}
  draw()}


/* ───────── 오늘의 길잡이: 집에서 혼자 해도 순서를 잃지 않게 ───────── */
const CALC_FOR={poly:['sub','mul'],types:['sub','eq'],area:['area','pi','surf','frac'],regular:['mul','frac']};
const TAB_DO={concept:'개념 읽기',explore:'탐구 활동 해 보기',steps:'단계 문제 1개 풀기',practice:'연습 문제 5개 풀기'};
function guideSteps(){const S=[],D=dayState(),due=dueReviews().length;
  if(due||NUM(D.c.review))S.push({done:!due,t:due?`복습 노트 ${due}문제`:'복습 노트',s:due?'틀렸던 문제를 다시 풀어요':'오늘 복습을 끝냈어요',href:'#review'});
  const L=LESSONS.filter(l=>l.ready),cur=L.find(l=>lessonDone(l.id)<4),moved=NUM(D.c.steps)+NUM(D.c.prac)+NUM(D.c.explore)>0;
  if(cur){const p=OBJ(DB[cur.id]),tab=!p.concept?'concept':!p.explore?'explore':!(NUM(p.steps)>0)?'steps':'practice';
    S.push({done:moved,more:true,t:`${cur.no}차시 ${cur.title}`,s:TAB_DO[tab]+(tab==='practice'?` (지금 ${NUM(OBJ(p.prac).solved)}개)`:''),href:'#'+cur.id+(tab==='concept'?'':'-'+tab)})}
  else S.push({done:moved,more:true,t:'열린 차시를 모두 마쳤어요',s:'연습 문제로 실력을 다져요',href:'#'+L[L.length-1].id+'-practice'});
  const ids=CALC_FOR[cur?cur.id:'area']||[];const tp=ids.map(id=>CALC.find(c=>c.id===id)).find(t=>t&&calcState(t.id).stars<3)||CALC.slice().sort((a,b)=>calcState(a.id).stars-calcState(b.id).stars)[0];
  const cdone=NUM(D.c.calc)>0;S.push({done:cdone,more:true,t:`기초 연산 · ${tp.nm}`,s:cdone?'오늘 한 세트 했어요':`${Math.min(3,calcState(tp.id).stars+1)}단계 10문제`,href:'#calc-'+tp.id});
  const dd=OBJ(DB._drill).last===today();S.push({done:dd,t:'오늘의 계산',s:dd?'오늘 끝냈어요':'섞어서 10문제 · 3분쯤',href:'#drill'});
  return S}
function guideHTML(){const S=guideSteps(),ci=S.findIndex(x=>!x.done),n=S.filter(x=>x.done).length;
  return`<div class="g-head"><b class="t">오늘의 길잡이</b><span class="k">${n===S.length?'오늘 할 일을 다 했어요!':'위에서부터 하나씩 해 봐요'} · ${n}/${S.length}</span></div>
  <ol class="gsteps">${S.map((x,i)=>`<li class="${x.done?'done':i===ci?'cur':''}"><span class="gn">${x.done?CHECK:i+1}</span><span class="gt"><b>${x.t}</b><small>${x.s}</small></span>${x.done&&!x.more?'':`<a class="btn ${i===ci?'primary':'ghost'}" href="${x.href}">${x.done?'더 하기':i===ci?'시작':'하기'}</a>`}</li>`).join('')}</ol>`}

/* ───────── 길찾기 ───────── */
function route(soft){
  hideTerm();activeBox=null;pinKeyHandler=null;themePreview=null;applyTheme();if(!$('#labov').hidden)closeLab();
  const h=(location.hash||'').replace('#','');
  if(!h||h==='home')viewHome();
  else if(h==='unit-solid')viewUnit();
  else if(h==='me')viewMe();
  else if(h==='review')viewReview();
  else if(h==='drill')viewDrill();
  else if(h==='login')viewLogin();
  else if(h==='teacher')viewTeacher();
  else if(h==='shop')viewShop();
  else if(h==='calc')viewCalc();
  else if(/^calc-[a-z]+$/.test(h))viewCalcTopic(h.slice(5));
  else if(h==='baseball')viewBaseball();
  else if(/^bb-\d+$/.test(h))viewBBGame(+h.slice(3));
  else if(/^bb-cpu-(easy|hard|easy4)$/.test(h))viewBBCpu(h.slice(7));
  else if(h==='boss')viewBoss();
  else if(/^bossview-\d+-\d+$/.test(h)){const[,g,k]=h.split('-');viewBossView(+g,+k)}
  else{const[id,tab]=h.split('-');const L=LESSONS.find(l=>l.id===id&&l.ready);if(L)viewLesson(id,TABS.some(t=>t.id===tab)?tab:'concept');else viewHome()}
  if(!soft)window.scrollTo(0,0);updateWho();
}
addEventListener('hashchange',()=>route());route();updatePill();if(isStudent()){maybeConfirmWho();pullDB();flushPts()}
