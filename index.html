<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 걸음 수학</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한 걸음 수학">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 모눈종이 위의 수학 노트. 형광펜(노랑)은 '지금 할 것'에만, 파란 잉크는 눌러 볼 수 있는 것에만 쓴다. */
:root{
  --paper:#f6f7f3;
  --grid:rgba(40,60,110,.075);
  --ink:#1d2640;
  --ink-soft:#5a6377;
  --line:#d8dce4;
  --card:#ffffff;
  --accent:#2a4d9e;
  --accent-soft:#e8eefb;
  --hi:#ffe266;
  --hi-soft:#fff6c7;
  --ok:#2b7a4b;
  --ok-soft:#e5f4ea;
  --bad:#b83a3a;
  --bad-soft:#fbe9e9;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --math:"Times New Roman",Times,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.mark{background:linear-gradient(transparent 58%,var(--hi) 58%,var(--hi) 92%,transparent 92%);padding:0 .1em}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:rgba(246,247,243,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink-soft);font-size:15px;flex-wrap:wrap}
.crumbs a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent}
.crumbs a:hover{border-color:var(--ink-soft)}
.crumbs .sep{opacity:.5}

main{padding:28px 0 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}

/* 홈 */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:36px}
.hero h1{font-size:clamp(30px,4.4vw,46px);margin-bottom:14px}
.hero p{color:var(--ink-soft);max-width:34em;margin:0 0 8px}
.hero-fig{aspect-ratio:1/1;max-height:360px;width:100%}
.hero-fig canvas{width:100%;height:100%;display:block}
.hero-note{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:-6px}
.sec-title{display:flex;align-items:baseline;gap:4px 12px;margin:8px 0 14px;flex-wrap:wrap}
.sec-title h2{font-size:24px}
.sec-title span{color:var(--ink-soft);font-size:15px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.unit{padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;min-height:110px;position:relative}
.unit .no{font-family:var(--math);font-size:15px;color:var(--ink-soft)}
.unit b{font-family:var(--display);font-size:20px}
.unit .st{font-size:14px;color:var(--ink-soft);margin-top:auto}
.unit.ready{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.unit.ready:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.unit.ready .st{color:var(--ink);font-weight:500}
.unit.soon{opacity:.55;background:rgba(255,255,255,.6)}

/* 단원 */
.unit-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.unit-head h1{font-size:clamp(28px,4vw,40px)}
.unit-head p{margin:6px 0 0;color:var(--ink-soft)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--ink-soft);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}
.legend i.on{background:var(--ink)}
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:16px 20px;text-decoration:none;color:inherit}
.lesson .n{font-family:var(--math);font-size:30px;text-align:center;color:var(--ink-soft)}
.lesson b{font-family:var(--display);font-size:21px;display:block}
.lesson small{color:var(--ink-soft);font-size:15px}
.tbref{font-family:var(--sans,inherit);font-size:13px!important;color:#6b7690}.lesson small.tbref{display:block;margin-top:2px}
.lesson.ready{border-left:6px solid var(--ink)}
.lesson.ready:hover{background:var(--hi-soft)}
.lesson.soon{opacity:.5}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.pip.on{background:var(--ink)}
.soon-tag{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-soft);justify-self:start}

/* 차시 */
.lesson-head{margin-bottom:16px}
.lesson-head .kicker{font-family:var(--math);color:var(--ink-soft);font-size:16px}
.lesson-head h1{font-size:clamp(28px,4vw,40px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.tab{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;min-height:56px}
.tab .num{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--math);font-size:16px}
.tab .tl{font-weight:700;line-height:1.2}
.tab .tl small{display:block;font-weight:400;font-size:13px;color:var(--ink-soft)}
.tab.on{background:var(--ink);color:#fff}
.tab.on .num{border-color:#fff}
.tab.on .tl small{color:#c9cfdc}
.tab.done .num{background:var(--hi);border-color:var(--ink);color:var(--ink)}
.panel{padding:24px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:24px;margin-bottom:10px}
.panel h3{font-size:19px;margin:18px 0 8px}
.lead{font-size:19px;margin:0 0 14px}
.muted{color:var(--ink-soft)}
.next-row{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:500;min-height:46px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hi-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2c3860}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:9px 16px;cursor:pointer;min-height:44px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}

/* 용어 */
.term{background:none;border:0;padding:0;color:var(--accent);border-bottom:2px dotted var(--accent);cursor:help;font:inherit;line-height:inherit}
.term:hover,.term.open{background:var(--accent-soft)}
.pop{position:fixed;z-index:50;width:min(370px,calc(100vw - 24px));background:var(--card);border:1.5px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 rgba(29,38,64,.18);padding:16px 18px 18px;font-size:16px;line-height:1.6}
.pop[hidden]{display:none}
.pop-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pop-h h4{margin:0;font-family:var(--display);font-size:20px;flex:1}
.pop-h button{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;min-width:36px;min-height:36px}
.pop p{margin:6px 0}
.pop canvas{width:100%;height:150px;display:block;margin-top:8px}
.pop .kicker{font-size:13px;color:var(--ink-soft)}
.pop .pfig3{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pop .pfig3 canvas{height:130px;margin:0;border:1px solid var(--line);border-radius:8px}
@media (max-width:640px){.pop{left:12px!important;right:12px;bottom:12px;top:auto!important;width:auto}}

/* 개념 */
.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.figbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.figbox canvas{width:100%;display:block;touch-action:pan-y}
.figcap{text-align:center;font-size:15px;color:var(--ink-soft);margin-top:4px}
.defs{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.defs li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--paper)}
.defs b{font-family:var(--display);font-size:18px}
.box{border:1.5px solid var(--ink);border-radius:12px;padding:14px 18px;background:var(--hi-soft);margin:14px 0}
.box.plain{background:#fff;border-color:var(--line)}
.formula{font-family:var(--display);font-size:20px;text-align:center;margin:6px 0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:9px 10px;text-align:center}
table.t th{background:var(--paper);font-weight:700}
table.t td.l{text-align:left}
.tablewrap{overflow-x:auto}
.math{font-family:var(--math);font-style:italic}
.rm{font-family:var(--math)}

/* 탐구 */
.explore{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.stage{background:#fff;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
.stage canvas{width:100%;height:420px;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage .hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--ink-soft);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;pointer-events:none}
.ctrl{display:flex;flex-direction:column;gap:16px}
.ctrl .cap{font-weight:700;display:block;margin-bottom:6px}
.ctrl .seg{align-self:flex-start}
.prob-body.nofig{grid-template-columns:1fr;max-width:720px}
.counter{font-size:20px}
.counter b{font-family:var(--math);font-size:34px;padding:0 4px}
.feedback{border-radius:10px;padding:12px 14px;font-size:16px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--accent-soft);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media(max-width:520px){.cls-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cls{padding:8px}.cls canvas{height:110px}.cls .two{grid-template-columns:1fr}.cls .two button{font-size:15px;padding:6px 2px;white-space:nowrap;min-height:40px}.cls .mk{font-size:24px;right:7px}}
.cls{padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.cls canvas{width:100%;height:130px;display:block;touch-action:pan-y}
.cls .nm{text-align:center;font-weight:700}
.cls .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cls .two button{border:1.5px solid var(--ink);border-radius:8px;background:#fff;padding:6px 4px;cursor:pointer;font-size:15px;min-height:42px}
.cls .why{font-size:14px;border-radius:8px;padding:6px 8px}
.cls{position:relative}
.cls.isP{border-color:#2a4d9e;background:#eef3fc}.cls.isP .why{background:#dbe6fa;color:#1f3c7a}
.cls.notP{border-color:#c46a17;background:#fdf3e7}.cls.notP .why{background:#f8e0c2;color:#7a4210}
.cls .mk{position:absolute;top:4px;right:10px;font-size:30px;line-height:1;font-weight:700;color:var(--ink);font-family:var(--display)}
.cls .why small{color:var(--ink-soft)}
.cls-key{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--ink-soft)}.cls-key i{width:14px;height:14px;border-radius:4px;display:inline-block}
.cls-key .kp{background:#dbe6fa;border:1.5px solid #2a4d9e}.cls-key .kn{background:#f8e0c2;border:1.5px solid #c46a17}
.ptable td.q{color:var(--line)}
.ptable tr.cur td{background:var(--hi-soft)}

/* 문제 */
.prob-q{font-weight:700;font-size:19px;margin-bottom:14px;font-family:var(--body)}
.prob-body{display:grid;grid-template-columns:minmax(260px,.85fr) 1.15fr;gap:22px;align-items:start}
.prob-fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.prob-fig canvas{width:100%;height:300px;display:block;touch-action:pan-y}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.step .sq{display:flex;gap:8px}
.step .sq>.sb{display:block;margin-left:0;flex:1;min-width:0}
.step .sn{font-family:var(--math);font-size:18px;flex:none}
.step.lock{opacity:.45}
.step.cur{border-color:var(--ink);box-shadow:inset 6px 0 0 var(--hi)}
.step.done{border-color:var(--ok);background:var(--ok-soft)}
.step.done .ans{font-weight:700;color:var(--ok)}
.step.shown{border-color:var(--bad);background:var(--bad-soft)}
.step .expl{font-size:15px;color:var(--ink-soft);margin-top:4px}
.step .hintmsg{margin-top:8px;font-size:15px;background:var(--hi-soft);border-radius:8px;padding:8px 10px}
.answer{margin-top:10px}
.field{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;padding:6px 12px;min-height:52px;font-family:var(--math);font-size:26px;background:#fff;max-width:280px}
.field .val{min-width:1ch}
.field .ph{color:#b9bfcc}
.field .suf{font-family:var(--body);font-size:18px;color:var(--ink-soft)}
.field .caret{width:2px;height:28px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(4,64px);grid-auto-rows:52px;gap:6px;margin-top:10px}
.keys button{border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:var(--math);font-size:22px}
.keys button:active{background:var(--hi-soft)}
.keys .ok{grid-column:4;grid-row:3/span 2;background:var(--ink);color:#fff;border-color:var(--ink);font-family:var(--body);font-size:17px}
.keys .zero{grid-column:span 2}
.keys .fn{font-family:var(--body);font-size:16px}
.keys.sn .ok{grid-row:auto;grid-column:auto}.keys .sg{font-size:28px;font-weight:700;background:var(--paper)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choices button{border:1.5px solid var(--ink);border-radius:10px;background:#fff;padding:9px 18px;cursor:pointer;min-height:48px;font-size:18px}
.choices button.math{font-family:var(--math);font-style:italic}
.choices button:hover{background:var(--hi-soft)}
.shake{animation:shake .35s}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reg5{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 12px}
.fan{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.fan.ok{border-color:var(--ok);background:#f2faf5}.fan.no{opacity:.82}
.fan small{font-size:14px;color:var(--ink-soft)}.fan.ok small{color:var(--ok);font-weight:700}
.ang{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.angFig{display:flex;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.angFig svg{max-width:100%;height:auto}
.angPoly{display:grid;grid-template-columns:1fr 1fr}.angPoly button+button{border-left:0}.angPoly button:nth-child(2n){border-left:1.5px solid var(--ink)}.angPoly button:nth-child(n+3){border-top:1.5px solid var(--ink)}
.angFound,.vxLog{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.angFound .chip,.vxLog .chip{white-space:nowrap;cursor:default}.angPoly button small{color:inherit;opacity:.75}
.angK{display:flex;align-items:center;gap:10px;font-size:18px}
.angK button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);font-size:22px;cursor:pointer}
.angK button:disabled{opacity:.35;cursor:default}.angKv{font-size:26px;min-width:1.2em;text-align:center}
.angMsg{margin-top:12px;font-size:16px;line-height:1.6}.angMsg.ok{color:var(--ink)}.angMsg.bad{color:var(--bad)}
.angSolid canvas{width:100%;height:170px;display:block}
.chip.off{opacity:.45;border-style:dashed}
.regt{font-size:14px}.regt th,.regt td{padding:6px 1px;font-size:14px;white-space:nowrap}.regt thead th{font-size:12.5px;line-height:1.3}.regt tbody th{font-size:13px}.regt tbody th small{font-weight:400;color:var(--ink-soft);font-size:13px}
.pv{border:2px solid #f2d36b;background:#fffbea;margin-bottom:14px}.pv-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}.pv-h b{font-size:20px}.pv-h span{color:#7a5b00;font-size:14px}
.pv-ct{font-size:22px;font-weight:800;margin:0 0 8px}.pv-ct small{display:inline;font-size:14px;font-weight:700;color:#c0504d;margin-left:8px}
.pv-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:12px}
.pvc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:#fff;border:3px solid #151a28;border-radius:14px;padding:14px 16px;box-shadow:4px 4px 0 #151a28;cursor:zoom-in;transition:transform .15s}
.pvc:hover{transform:translate(-1px,-2px)}.pvc.ex{border-style:dashed;box-shadow:none;border-width:2px}
.pv-t{border-collapse:collapse;margin:8px 0 2px;font-size:16px}.pv-t th,.pv-t td{border:1.5px solid #151a28;padding:3px 10px;text-align:center}.pv-t th{background:#f3f0e4;font-weight:700}
.tpc .d b{font-size:inherit;margin:0;font-weight:800}
.pvn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#151a28;color:#ffe07a;font-weight:800;font-size:15px}
.pvh{font-size:21px;margin:8px 0 6px}.pvb{font-size:17px;line-height:1.6}.pvb b{background:linear-gradient(transparent 58%,#ffe07a 58%)}.pvb small{display:block;font-size:14px;color:#5a6377;line-height:1.5;margin-top:4px}
.pv-tag{display:inline-block;font-size:12px;background:#151a28;color:#fff;border-radius:999px;padding:0 8px;margin-right:8px}
.pv-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.pv-l{font-size:13px;color:#7a5b00;font-weight:700;margin-right:4px}.pv-w{background:#fff;border:1px solid #f2e2a6;border-radius:999px;padding:1px 10px;font-size:14px}.pv-ty{background:#eef2fb;border:1px solid #c9d6f2;border-radius:8px;padding:1px 8px;font-size:14px;color:#2a4d9e}

function tidyDB(){const M=DB._me;if(M&&M.once&&typeof M.once==='object'){const d=new Date();d.setDate(d.getDate()-60);const cut=d.toISOString().slice(0,10);for(const k in M.once){const m=/^(?:drill|mis|misall|boss):(\d{4}-\d\d-\d\d)/.exec(k);if(m&&m[1]<cut)delete M.once[k]}}

function today(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function addDays(ds,n){const[y,m,d]=ds.split('-').map(Number);return today(new Date(y,m-1,d+n))}
function me(){DB._me=DB._me||{pts:0,last:null,streak:0,once:{},cnt:{},badges:{}};const M=DB._me;M.once=M.once||{};M.cnt=M.cnt||{};M.badges=M.badges||{};return M}
function liveStreak(){const M=me(),t=today();return(M.last===t||M.last===addDays(t,-1))?M.streak:0}
function award(n,onceKey){if(onceKey&&/^(face:|floor:|dup:|rule:|net:|reduce|cls|cut|i:)/.test(onceKey))dayBump('explore');const M=me();if(onceKey){if(M.once[onceKey])return false;M.once[onceKey]=1}
  const t=today();if(M.last!==t){M.streak=(M.last===addDays(t,-1))?M.streak+1:1;M.last=t}
  M.pts+=n;save();updatePill();popPts(n);checkBadges();queuePts(n);return true}
function bump(k,n=1){const M=me();M.cnt[k]=(M.cnt[k]||0)+n;save();checkBadges()}

function badgeIcon(i,on){const n=3+(i%4),R=17,c=22;const pts=regPoly(n,R,-Math.PI/2).map(p=>`${(c+p[0]).toFixed(1)},${(c+p[1]).toFixed(1)}`).join(' ');

function addReview(g,seed,lid){DB._rev=DB._rev||[];if(DB._rev.some(x=>x.g===g&&x.seed===seed))return;DB._rev.push({g,seed,lid,due:addDays(today(),1),stage:0,added:today()});save()}

/* ───────── 3D 메시 ───────── */
function faceNormal(V,f,c){let nx=0,ny=0,nz=0;for(let i=0;i<f.length;i++){const p=V[f[i]],q=V[f[(i+1)%f.length]];nx+=(p[1]-q[1])*(p[2]+q[2]);ny+=(p[2]-q[2])*(p[0]+q[0]);nz+=(p[0]-q[0])*(p[1]+q[1])}
  const L=Math.hypot(nx,ny,nz)||1;nx/=L;ny/=L;nz/=L;let fx=0,fy=0,fz=0;f.forEach(i=>{fx+=V[i][0];fy+=V[i][1];fz+=V[i][2]});fx/=f.length;fy/=f.length;fz/=f.length;
  if(c&&(fx-c[0])*nx+(fy-c[1])*ny+(fz-c[2])*nz<0){nx=-nx;ny=-ny;nz=-nz}return[nx,ny,nz]}
function makeMesh(V,F,o={}){
  const m={V,F,smooth:o.smooth||F.map(()=>false),hard:new Set(o.hard||[]),curved:!!o.curved};
  const em=new Map();
  F.forEach((f,fi)=>{for(let i=0;i<f.length;i++){const a=f[i],b=f[(i+1)%f.length];const k=Math.min(a,b)+'-'+Math.max(a,b);if(!em.has(k))em.set(k,{a:Math.min(a,b),b:Math.max(a,b),k,f:[]});em.get(k).f.push(fi)}});
  m.E=[...em.values()];
  const c=[0,0,0];V.forEach(p=>{c[0]+=p[0];c[1]+=p[1];c[2]+=p[2]});m.c=c.map(x=>x/V.length);
  m.N=F.map(f=>faceNormal(V,f,m.c));
  m.R=Math.max(...V.map(p=>Math.hypot(p[0]-m.c[0],p[1]-m.c[1],p[2]-m.c[2])));
  return m;
}
function regPoly(n,R,rot){rot=rot??(-Math.PI/2+Math.PI/n);const p=[];for(let k=0;k<n;k++){const t=rot+TAU*k/n;p.push([R*Math.cos(t),R*Math.sin(t)])}return p}
const range=n=>[...Array(n).keys()];
function prism(P,h,smooth){const n=P.length,V=[...P.map(p=>[p[0],p[1],0]),...P.map(p=>[p[0],p[1],h])];const F=[range(n).reverse(),range(n).map(i=>i+n)];const sm=[false,false];
  for(let i=0;i<n;i++){const j=(i+1)%n;F.push([i,j,j+n,i+n]);sm.push(!!smooth)}const m=makeMesh(V,F,{smooth:sm,curved:smooth});m.base=[0,1];return m}
function pyramid(P,h,smooth){const n=P.length;let cx=0,cy=0;P.forEach(p=>{cx+=p[0];cy+=p[1]});const V=[...P.map(p=>[p[0],p[1],0]),[cx/n,cy/n,h]];const F=[range(n).reverse()];const sm=[false];
  for(let i=0;i<n;i++){F.push([i,(i+1)%n,n]);sm.push(!!smooth)}const m=makeMesh(V,F,{smooth:sm,curved:smooth});m.base=[0];return m}
function frustum(P,k,h){const n=P.length;let cx=0,cy=0;P.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=n;cy/=n;
  const V=[...P.map(p=>[p[0],p[1],0]),...P.map(p=>[cx+k*(p[0]-cx),cy+k*(p[1]-cy),h])];const F=[range(n).reverse(),range(n).map(i=>i+n)];
  for(let i=0;i<n;i++){const j=(i+1)%n;F.push([i,j,j+n,i+n])}const m=makeMesh(V,F);m.base=[0,1];return m}
function octahedron(R){const V=[[R,0,0],[-R,0,0],[0,R,0],[0,-R,0],[0,0,R],[0,0,-R]];const F=[];
  [0,1].forEach(x=>[2,3].forEach(y=>[4,5].forEach(z=>F.push([x,y,z]))));return makeMesh(V,F)}
function sphere(R,nu=30,nv=16){const V=[[0,0,R]];for(let i=1;i<nv;i++){const ph=Math.PI*i/nv;for(let j=0;j<nu;j++){const th=TAU*j/nu;V.push([R*Math.sin(ph)*Math.cos(th),R*Math.sin(ph)*Math.sin(th),R*Math.cos(ph)])}}V.push([0,0,-R]);
  const S=V.length-1,id=(i,j)=>1+(i-1)*nu+(j%nu),F=[];
  for(let j=0;j<nu;j++)F.push([0,id(1,j),id(1,j+1)]);
  for(let i=1;i<nv-1;i++)for(let j=0;j<nu;j++)F.push([id(i,j),id(i+1,j),id(i+1,j+1),id(i,j+1)]);
  for(let j=0;j<nu;j++)F.push([S,id(nv-1,j+1),id(nv-1,j)]);
  const eq=nv/2,hard=[];for(let j=0;j<nu;j++){const a=id(eq,j),b=id(eq,j+1);hard.push(Math.min(a,b)+'-'+Math.max(a,b))}
  return makeMesh(V,F,{smooth:F.map(()=>true),hard,curved:true})}

function icosahedron(e=1.1){const r=e/(2*Math.sin(Math.PI/5)),dz=Math.sqrt(e*e-(2*r*Math.sin(Math.PI/10))**2),dz2=Math.sqrt(e*e-r*r);
  const V=[[0,0,dz/2+dz2]];for(let k=0;k<5;k++){const t=TAU*k/5;V.push([r*Math.cos(t),r*Math.sin(t),dz/2])}for(let k=0;k<5;k++){const t=TAU*k/5+Math.PI/5;V.push([r*Math.cos(t),r*Math.sin(t),-dz/2])}V.push([0,0,-dz/2-dz2]);
  const U=k=>1+(k%5),D=k=>6+(k%5),F=[];for(let k=0;k<5;k++){F.push([0,U(k),U(k+1)]);F.push([U(k),D(k),U(k+1)]);F.push([D(k),D(k+1),U(k+1)]);F.push([11,D(k+1),D(k)])}return makeMesh(V,F)}
function dodecahedron(){const I=icosahedron(1.65);const C=I.F.map(f=>{const c=[0,0,0];f.forEach(i=>{for(let q=0;q<3;q++)c[q]+=I.V[i][q]/3});return c});
  const F=I.V.map((v,vi)=>{const L=Math.hypot(...v),n=v.map(x=>x/L);let u=Math.abs(n[0])<0.9?[1,0,0]:[0,1,0];const d=u[0]*n[0]+u[1]*n[1]+u[2]*n[2];u=u.map((x,q)=>x-d*n[q]);const ul=Math.hypot(...u);u=u.map(x=>x/ul);
    const w=[n[1]*u[2]-n[2]*u[1],n[2]*u[0]-n[0]*u[2],n[0]*u[1]-n[1]*u[0]];
    const fs=I.F.map((f,fi)=>f.includes(vi)?fi:-1).filter(x=>x>=0);
    return fs.sort((a,b)=>{const A=C[a].map((x,q)=>x-v[q]),B=C[b].map((x,q)=>x-v[q]);return Math.atan2(A[0]*w[0]+A[1]*w[1]+A[2]*w[2],A[0]*u[0]+A[1]*u[1]+A[2]*u[2])-Math.atan2(B[0]*w[0]+B[1]*w[1]+B[2]*w[2],B[0]*u[0]+B[1]*u[1]+B[2]*u[2])})});
  return makeMesh(C,F)}

const VIEWERS=new Set();
const HI='#ffe266';
class Viewer{
  constructor(canvas,o={}){
    this.cv=canvas;this.ctx=canvas.getContext('2d');this.o=o;
    this.yaw=o.yaw??-0.55;this.pitch=o.pitch??0.42;this.auto=!!o.auto&&!reduced;this.style=o.style||'shade';this.pad=o.pad??0.40;
    this.scene=[];this.marks={f:new Set(),e:new Set(),v:new Set()};this.mode=null;this.dirty=true;this.userMoved=false;
    if(o.interactive!==false)this._bind();
    this._resize();VIEWERS.add(this);
    if('ResizeObserver' in window){this.ro=new ResizeObserver(()=>this._resize());this.ro.observe(canvas)}
    this.visible=true;if('IntersectionObserver' in window){this.io=new IntersectionObserver(es=>{es.forEach(en=>{this.visible=en.isIntersecting;if(this.visible)this.dirty=true})});this.io.observe(canvas)}
  }
  flyTo(yaw,pitch,ms=450){let d=yaw-this.yaw;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;this.anim={y0:this.yaw,p0:this.pitch,dy:d,dp:pitch-this.pitch,t0:performance.now(),ms:reduced?1:ms};this.userMoved=true}
  stepAnim(){const A=this.anim;if(!A)return;let t=Math.min(1,(performance.now()-A.t0)/A.ms);const e=t*t*(3-2*t);this.yaw=A.y0+A.dy*e;this.pitch=A.p0+A.dp*e;this.dirty=true;if(t>=1)this.anim=null}
  _resize(){const d=window.devicePixelRatio||1;const w=this.cv.clientWidth||300,h=this.cv.clientHeight||300;if(w===this.w&&h===this.h)return;this.w=w;this.h=h;this.cv.width=Math.round(w*d);this.cv.height=Math.round(h*d);this.ctx.setTransform(d,0,0,d,0,0);this.dirty=true;this.draw()}
  setScene(sc,o={}){this.scene=sc;this.cen=o.center||sc[0].mesh.c;this.R=o.R||Math.max(...sc.map(s=>s.mesh.R));this.dirty=true}
  setMesh(m){this.marks={f:new Set(),e:new Set(),v:new Set()};this.setScene([{mesh:m}])}
  get scale(){return Math.min(this.w,this.h)*this.pad/(this.R||1)}
  proj(p){const a=this.yaw,b=this.pitch,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);const c=this.cen||[0,0,0];
    const x=p[0]-c[0],y=p[1]-c[1],z=p[2]-c[2];const x1=x*ca-y*sa,y1=x*sa+y*ca;const s=this.scale;
    return[this.w/2+(this.o.dx||0)+s*x1,this.h/2+(this.o.dy||0)-s*(y1*sb+z*cb),-y1*cb+z*sb]}
  facing(n){const y1=n[0]*Math.sin(this.yaw)+n[1]*Math.cos(this.yaw);return -y1*Math.cos(this.pitch)+n[2]*Math.sin(this.pitch)}
  _bind(){
    const cv=this.cv;let st=null;
    cv.addEventListener('pointerdown',e=>{this.touch=e.pointerType==='touch';st={x:e.clientX,y:e.clientY,yaw:this.yaw,pitch:this.pitch,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
    cv.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!st.moved&&Math.hypot(dx,dy)>6){st.moved=true;this.dragging=true}
      if(st.moved){this.yaw=st.yaw+dx*0.011;this.pitch=Math.max(-1.57,Math.min(1.57,st.pitch+dy*0.011));this.anim=null;this.userMoved=true;this.dirty=true}});
    const end=e=>{if(!st)return;if(!st.moved&&this.mode){const r=cv.getBoundingClientRect();this.tap(e.clientX-r.left,e.clientY-r.top)}st=null;this.dragging=false};
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',()=>{st=null;this.dragging=false});
  }
  tap(x,y){
    const m=this.scene[0].mesh,P=m.V.map(v=>this.proj(v));let hit=null;
    if(this.mode==='f'){m.F.forEach((f,i)=>{if(this.facing(m.N[i])<=1e-6)return;if(inPoly(x,y,f.map(k=>P[k])))hit=i});

    const r=Math.max(0.28,...ids.map(i=>Math.hypot(base.V[i][0]-cx,base.V[i][1]-cy)))*1.18+0.18;
    const pts=range(40).map(q=>vw.proj([cx+r*Math.cos(TAU*q/40),cy+r*Math.sin(TAU*q/40),z]));
    if(!labels){ctx.beginPath();pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='rgba(42,77,158,.07)';ctx.fill();ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(42,77,158,.4)';ctx.lineWidth=1.3;ctx.stroke();ctx.setLineDash([])}
    else{const L=pts.reduce((a,p)=>p[0]<a[0]?p:a,pts[0]);ktext(ctx,`${f+1}층`,L[0]-6,L[1],{align:'right',bold:true,size:15,color:'#2a4d9e'})}})}
function floorFig(canvas,mesh,kind,o={}){
  const I=floorInfo(mesh);const gi=(k,id)=>I.G[k].findIndex(g=>g.ids.includes(id));
  const v=new Viewer(canvas,{interactive:false,yaw:o.yaw??-0.5,pitch:o.pitch??0.3,pad:o.pad??0.40,draw:(ctx,vw)=>{drawPlates(ctx,vw,mesh,I,false);vw.drawMesh(mesh);drawPlates(ctx,vw,mesh,I,true)}});
  if(kind==='v'){v.mode='v';v.vcol=i=>GC[gi('v',i)%5]}
  if(kind==='e')v.ecol=k=>GC[gi('e',k)%5]+'cc';
  if(kind==='f')v.fcol=i=>FC[gi('f',i)%5];
  v.setScene([{mesh}],{R:mesh.R*1.12});return I}
function floorCap(I,kind){const parts=I.G[kind].map((g,i)=>`<span style="color:${GC[i%5]};font-weight:700">${g.ids.length}</span>`);
  return `${KIND_NM[kind]} = <span class="rm">${parts.join(' + ')} = ${I.G[kind].reduce((a,g)=>a+g.ids.length,0)}</span>`}
function floorLegend(I,kind){return I.G[kind].map((g,i)=>`<span class="lg"><i style="background:${kind==='f'?FC[i%5]:GC[i%5]}"></i>${g.label}</span>`).join('')}
const fold=(i,title,tease,inner,open)=>`<details class="fold" data-i="${i}"${open?' open':''}><summary><span class="fn">${i}</span><span class="ft"><b>${title}</b><small>${tease}</small></span><span class="chev" aria-hidden="true"></span></summary><div class="fb">${inner}</div></details>`;
const foldPanel=(title,lead,folds)=>`<div class="card panel"><div class="fold-head"><h2>${title}</h2><div class="fold-tools"><button type="button" data-all="1">모두 펼치기</button><button type="button" data-all="0">모두 접기</button></div></div>${lead}<div class="folds">${folds}</div></div>`;
function wireFolds(body,id){
  const D=$$('details.fold',body);$$('.folds',body).forEach(f=>f.classList.add('cardmode'));$$('.fold-tools',body).forEach(t=>t.remove());
  D.forEach(d=>{d.open=false;$('summary',d).insertAdjacentHTML('beforeend','<span class="fold-x" aria-hidden="true">✕ 닫기</span>');
    d.addEventListener('toggle',()=>{if(d.open){D.forEach(o=>{if(o!==d)o.open=false});if(!$('.zoom-bg.fz'))document.body.appendChild(Object.assign(el('<div class="zoom-bg fz"></div>'),{onclick:()=>D.forEach(o=>o.open=false)}))}
      else if(!D.some(o=>o.open))$$('.zoom-bg.fz').forEach(b=>b.remove())})});
  if(!wireFolds.k){wireFolds.k=1;document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('details.fold[open]').forEach(d=>d.open=false)});window.addEventListener('hashchange',()=>$$('.zoom-bg').forEach(b=>b.remove()))}
}

  const rotBase=p=>{const a=V[0],ax=v3.sub(V[1],a),al=v3.len(ax),u=ax.map(x=>x/al);const d=v3.sub(p,a),k=v3.dot(d,u),par=u.map(x=>x*k),perp=v3.sub(d,par),f=Math.PI-S.th,c=Math.cos(f),s=Math.sin(f),cr=v3.cross(u,perp);
    return[a[0]+par[0]+perp[0]*c-cr[0]*s,a[1]+par[1]+perp[1]*c-cr[1]*s,a[2]+par[2]+perp[2]*c-cr[2]*s]};
  const poly=(ctx,P2,fill,stroke,dash)=>{ctx.beginPath();P2.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.setLineDash(dash||[]);ctx.lineJoin='round';ctx.lineWidth=dash?1.6:2.4;ctx.strokeStyle=stroke;ctx.stroke();ctx.setLineDash([])}};
  const v=new Viewer($('.rdCv',host),{pad:0.36,yaw:-0.5,pitch:-0.62,draw:(ctx,vw)=>{
    const sides=[[0,1,3],[1,2,3],[2,0,3]],polys=sides.slice(0,S.n===2?2:3).map(f=>f.map(i=>V[i]));
    if(S.n<4)poly(ctx,[V[0],V[1],V[2]].map(p=>vw.proj(p)),null,'#7a86a3',[6,5]);
    if(S.n===2)poly(ctx,[V[2],V[0],V[3]].map(p=>vw.proj(p)),null,'#7a86a3',[6,5]);
    if(S.n===4)polys.push([V[0],V[1],rotBase(V[2])]);

      if(v3.dot(n,v3.sub(c,cen))<0)n=n.map(x=>-x);const L=v3.len(n);n=n.map(x=>x/L);return{Pp,out:vw.facing(n)>0,d:Pp.reduce((a,p)=>a+p[2],0)/3}}).sort((a,b)=>a.d-b.d);
    items.forEach(({Pp,out})=>poly(ctx,Pp,out?'rgba(219,230,250,.97)':'rgba(112,136,190,.97)','#151a28'));
    if(S.n===3){const C=vw.proj([cen[0],cen[1],0]);chip(ctx,'뚫린 곳',C[0],C[1],{bg:'#fff6c7',border:'#b88a00',size:15})}

}

  const mark=k=>{if(!p.acts[k]){p.acts[k]=true;save()}const b=$(`.actnav button[data-k="${k}"] .an`,body);if(b)b.innerHTML=CHECK;$(`.actnav button[data-k="${k}"]`,body)?.classList.add('done')};

  {k:'dod',nm:'정십이면체',face:'정오각형',n:5,deg:3,F:12,E:30,V:20},{k:'ico',nm:'정이십면체',face:'정삼각형',n:3,deg:5,F:20,E:30,V:12}];
const REG_FLOOR={tet:'1+3',cube:'4+4',oct:'1+4+1',dod:'5+5+5+5',ico:'1+5+5+1'};
const REG_FLOOR_X={cube:['2+4+2','4+4+4'],oct:['2+4','1+3+1','4+4'],dod:['5+10+5','1+5+5+1','5+5+5'],ico:['1+5+1','5+5+5','1+10+1']};
const REG_OF={'3,3':'tet','3,4':'oct','3,5':'ico','4,3':'cube','5,3':'dod'};
const POLY_NM={3:'정삼각형',4:'정사각형',5:'정오각형',6:'정육각형'},inAng=n=>(n-2)*180/n;
function bipyramid(R=1.15){const B=regPoly(3,R),h=R*Math.SQRT2;const V=[...B.map(p=>[p[0],p[1],0]),[0,0,h],[0,0,-h]];
  const F=[];for(let i=0;i<3;i++){const j=(i+1)%3;F.push([i,j,3],[j,i,4])}return makeMesh(V,F)}
function topVertex(m){let b=0;m.V.forEach((p,i)=>{const s=p[2]-0.001*p[1],t=m.V[b][2]-0.001*m.V[b][1];if(s>t+1e-9)b=i});return b}
/* 한 꼭짓점에 정다각형 k개를 모은 그림 */
function fanSVG(n,k,size=240){const O=size/2,a=inAng(n)*Math.PI/180,s=size*(n>=5?0.24:0.29),Rc=s/(2*Math.sin(Math.PI/n)),f=v=>v.toFixed(1),sum=inAng(n)*k;
  let g='';for(let j=0;j<k;j++){const th=-Math.PI/2+j*a,cx=O+Rc*Math.cos(th+a/2),cy=O+Rc*Math.sin(th+a/2),p0=th+a/2+Math.PI;
    const pts=range(n).map(i=>[cx+Rc*Math.cos(p0+2*Math.PI*i/n),cy+Rc*Math.sin(p0+2*Math.PI*i/n)]);
    g+=`<polygon points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="${FC[j%5]}" fill-opacity="${sum>360?0.62:0.9}" stroke="#1d2640" stroke-width="2" stroke-linejoin="round"/>`}
  if(sum<360){const r=s*0.75,t0=-Math.PI/2+k*a,t1=1.5*Math.PI,large=(t1-t0)>Math.PI?1:0;
    g+=`<path d="M${O} ${O} L${f(O+r*Math.cos(t0))} ${f(O+r*Math.sin(t0))} A${r} ${r} 0 ${large} 1 ${f(O+r*Math.cos(t1))} ${f(O+r*Math.sin(t1))} Z" fill="rgba(210,59,59,.14)" stroke="#d23b3b" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    const tm=(t0+t1)/2;g+=`<text x="${f(O+r*0.62*Math.cos(tm))}" y="${f(O+r*0.62*Math.sin(tm)+5)}" text-anchor="middle" font-family="Times New Roman,serif" font-size="${size>150?17:13}" font-weight="700" fill="#b02a2a">${360-sum}°</text>`}
  g+=`<circle cx="${O}" cy="${O}" r="${size>150?5:3.5}" fill="#1d2640"/>`;
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${POLY_NM[n]} ${k}개를 한 꼭짓점에 모은 그림, 각의 합 ${sum}도">${g}</svg>`}
function vtxFig(cv,mesh,marks,o={}){const v=new Viewer(cv,{auto:o.auto!==false,pad:0.40,yaw:o.yaw??-0.5,pitch:o.pitch??0.38});v.mode='v';
  v.vcol=i=>{const q=marks.find(x=>x.i===i);return q?q.c:null};if(marks[0]&&marks[0].f)v.fcol=i=>mesh.F[i].includes(marks[0].i)?marks[0].f:null;v.setMesh(mesh);return v}

/* 탐구: 한 꼭짓점에 모인 면 세기 (삼각쌍뿔 함정 포함) */
function vertexActivity(host,done){
  const Q=[{k:'tet',nm:'정사면체'},{k:'cube',nm:'정육면체'},{k:'oct',nm:'정팔면체'},{k:'ico',nm:'정이십면체'},{k:'dod',nm:'정십이면체'},{k:'bip',nm:'삼각쌍뿔',i:3},{k:'bip',nm:'삼각쌍뿔',i:0}];
  let idx=0;const ans=[];
  host.innerHTML=`<div class="explore"><div class="stage"><canvas class="vxCv"></canvas><span class="hint">끌어서 돌려 보세요</span></div><div class="ctrl"><p class="vxQ" style="margin-top:0"></p><div class="choices vxC"></div><div class="flmsg vxMsg"></div><div class="vxLog"></div></div></div>`;
  let v=null;
  function show(){const q=Q[idx];if(!q)return end();const m=q.k==='bip'?bipyramid():SOLIDS[q.k].mk(),t=q.i??topVertex(m);if(v&&v.destroy)v.destroy();
    $('.vxCv',host).replaceWith(el('<canvas class="vxCv"></canvas>'));v=vtxFig($('.vxCv',host),m,[{i:t,c:'#e08a1e',f:'#f6d9b0'}],{auto:false,yaw:-0.6,pitch:q.i===0?0.05:0.45});
    $('.vxQ',host).innerHTML=`<b>${q.nm}</b>${q.k==='bip'?` (${q.i===3?'꼭대기':'가운데'} 꼭짓점)`:''} · 주황색 꼭짓점에 모인 면은 몇 개인가요?`;$('.vxMsg',host).textContent='';
    $('.vxC',host).innerHTML=[3,4,5,6].map(n=>`<button type="button">${n}개</button>`).join('');
    const right=q.k==='bip'?(q.i===3?3:4):REG.find(R=>R.k===q.k).deg;
    $$('.vxC button',host).forEach(b=>b.onclick=()=>{if(parseInt(b.textContent)===right){ans.push({...q,deg:right});$('.vxLog',host).innerHTML=ans.map(a=>`<span class="chip">${a.nm}${a.k==='bip'?(a.i===3?'(꼭대기)':'(가운데)'):''} · ${a.deg}개</span>`).join(' ');idx++;setTimeout(show,450)}
      else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);$('.vxMsg',host).textContent='주황색으로 칠한 면을 하나씩 세어 보세요. 그림을 돌리면 뒤쪽도 보여요.'}})}
  function end(){$('.vxQ',host).innerHTML='<b>생각 정리</b> · 삼각쌍뿔은 모든 면이 합동인 정삼각형이에요. 그런데 정다면체일까요?';
    $('.vxC',host).innerHTML=['정다면체이다','정다면체가 아니다'].map(c=>`<button type="button">${c}</button>`).join('');
    $$('.vxC button',host).forEach(b=>b.onclick=()=>{if(b.textContent.endsWith('아니다')){$('.vxMsg',host).innerHTML=`<span class="ok">맞아요! 꼭짓점에 모인 면이 3개인 곳과 4개인 곳이 섞여 있어서 정다면체가 아니에요. 정다면체는 <b>모든 꼭짓점에 같은 개수</b>의 면이 모여요.</span>`;done();award(3,'vtx')}
      else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);$('.vxMsg',host).textContent='꼭대기 꼭짓점과 가운데 꼭짓점에 모인 면의 개수를 비교해 보세요.'}})}
  show()}
/* 탐구: 한 꼭짓점에 정다각형 모아 보기 → 다섯 가지 발견 */

    else{$('.angSolid',host).style.display='none';m.className='angMsg bad';m.innerHTML=s===360?`<span class="rm">${a}° × ${k} = 360°</span> → 딱 360°라서 평평하게 깔려요. 접어 올릴 틈이 없어서 입체가 안 돼요.`:`<span class="rm">${a}° × ${k} = ${s}°</span> → 360°를 넘어서 면끼리 겹쳐요. 한 꼭짓점에 모일 수 없어요.`}

const baseKey=()=>'hangeoreum-base:'+(AUTH?AUTH.sid:'');

const STALE_MS=2*60*1000;
function mergeVal(x,y){if(x===undefined||x===null)return y;if(y===undefined||y===null)return x;
  if(typeof x==='boolean'&&typeof y==='boolean')return x||y;
  if(typeof x==='number'&&typeof y==='number')return Math.max(x,y);
  if(typeof x==='string'&&typeof y==='string')return x>y?x:y;
  if(Array.isArray(x)||Array.isArray(y))return y;
  if(typeof x==='object'&&typeof y==='object'){const o={};new Set([...Object.keys(x),...Object.keys(y)]).forEach(k=>{o[k]=mergeVal(x[k],y[k])});return o}
  return y}
function mergeDB(L,S){L=L||{};S=S||{};const out={},newer=(+L._ts||0)>(+S._ts||0)?L:S;
  new Set([...Object.keys(L),...Object.keys(S)]).forEach(k=>{const a=L[k],b=S[k];
    if(a===undefined){out[k]=b;return}if(b===undefined){out[k]=a;return}
    if(k==='_ts'||k==='_last'){out[k]=newer[k];return}
    if(k==='_shop'&&a&&b){const o=mergeVal(a,b);o.eq=(newer[k]&&newer[k].eq)||o.eq;out[k]=o;return}
    if(k==='_rev'){const m=new Map();[...(Array.isArray(b)?b:[]),...(Array.isArray(a)?a:[])].forEach(x=>{if(!x||typeof x!=='object')return;const id=x.g+'|'+x.seed,o=m.get(id);
      if(!o||(x.stage||0)>(o.stage||0)||((x.stage||0)===(o.stage||0)&&String(x.due)>String(o.due)))m.set(id,x)});out[k]=[...m.values()];return}
    if(k==='_drill'){const o=mergeVal(a,b);const bs=[a&&a.best,b&&b.best].filter(v=>typeof v==='number');if(bs.length)o.best=Math.min(...bs);out[k]=o;return}
    if(k==='_me'&&a&&b){const o=mergeVal(a,b);const la=a.last||'',lb=b.last||'';o.streak=(la===lb?Math.max(a.streak||0,b.streak||0):(la>lb?a.streak:b.streak))||0;
      if(a.badges&&b.badges){o.badges={};new Set([...Object.keys(a.badges),...Object.keys(b.badges)]).forEach(x=>{o.badges[x]=[a.badges[x],b.badges[x]].filter(Boolean).sort()[0]})}
      out[k]=o;return}
    if(a&&b&&typeof a==='object'&&typeof b==='object'&&(a.prac||b.prac)){const o=mergeVal(Object.assign({},a,{prac:null}),Object.assign({},b,{prac:null}));
      o.prac=!a.prac?b.prac:!b.prac?a.prac:((a.prac.solved||0)>=(b.prac.solved||0)?a.prac:b.prac);out[k]=o;return}
    out[k]=mergeVal(a,b)});
  return out}

async function pushDB(keepalive){if(!isStudent()||SYNC.busy||!localDirty())return;SYNC.busy=true;

    setBase(snap._ts,snap);SYNC.contact=Date.now();SYNC.last=new Date();SYNC.err=null;flushOutbox()}
  catch(e){SYNC.err=e.message;if(isAuthErr(e))authExpired()}

/* ───────── 게임: 오늘의 미션 · 꾸미기 상점 · 우리 반 보스전 ───────── */
const hashStr=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0};
function celebrate(msg){if(msg)toast(msg);if(reduced)return;const box=el('<div class="confetti" aria-hidden="true"></div>');
  const cols=['#ffe266','#8ec5ff','#ff8f8f','#7fdcb8','#c7a7ff','#ffb59b'];
  for(let i=0;i<36;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*0.35)+'s';p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2600)}

/* 오늘의 미션: 하루 3개. 하나에 +3, 셋 다 하면 +10 */
function dayState(){const t=today();let D=DB._day;if(!D||typeof D!=='object'||D.d!==t)D=DB._day={d:t,c:{},t:{},m:null};D.c=OBJ(D.c);D.t=OBJ(D.t);return D}
const MISSIONS={
  term3:{nm:'용어 카드 3개 열어 보기',k:'term',n:3},
  drill:{nm:'오늘의 계산 끝내기',k:'drill',n:1},
  steps1:{nm:'단계 문제 1개 끝까지 풀기',k:'steps',n:1},
  prac3:{nm:'연습 문제 3개 풀기',k:'prac',n:3},
  prac5:{nm:'연습 문제 5개 풀기',k:'prac',n:5},
  explore1:{nm:'탐구 활동 1개 끝내기',k:'explore',n:1},
  clean2:{nm:'연습 문제를 한 번도 안 틀리고 2개 맞히기',k:'clean',n:2},
  drill8:{nm:'오늘의 계산에서 8문제 이상 첫 시도에 맞히기',k:'drill8',n:1},
  review1:{nm:'복습 노트 문제 1개 풀기',k:'review',n:1},
  calc1:{nm:'기초 연산 한 세트 끝내기',k:'calc',n:1}};
function todayMissions(){const D=dayState();if(Array.isArray(D.m)&&D.m.length===3&&D.m.every(x=>MISSIONS[x]))return D.m;
  const r=mulberry(hashStr('mission:'+D.d));const A=pick(r,['term3','drill','calc1']),B=pick(r,['steps1','prac3']);
  let C=['explore1','clean2','drill8','prac5'];if(B==='prac3')C=C.filter(x=>x!=='prac5');if(A==='drill')C=C.filter(x=>x!=='drill8');if(dueReviews().length)C=C.concat(['review1','review1']);
  D.m=[A,B,pick(r,C)];save();return D.m}
const missionProg=id=>Math.min(MISSIONS[id].n,NUM(dayState().c[MISSIONS[id].k]));
function dayBump(k,n=1){const D=dayState();D.c[k]=NUM(D.c[k])+n;checkMissions()}
function dayTerm(key){const D=dayState();if(D.t[key])return;D.t[key]=1;D.c.term=Object.keys(D.t).length;checkMissions()}
function missionStreak(){const S=OBJ(DB._mis),t=today();return(S.last===t||S.last===addDays(t,-1))?NUM(S.streak):0}
function checkMissions(){const D=dayState(),ms=todayMissions();
  ms.forEach(id=>{if(missionProg(id)>=MISSIONS[id].n&&award(3,'mis:'+D.d+':'+id))toast(`오늘의 미션 완료 · ${MISSIONS[id].nm} (+3)`)});
  if(ms.every(id=>missionProg(id)>=MISSIONS[id].n)&&award(10,'misall:'+D.d)){const S=DB._mis=OBJ(DB._mis);S.streak=(S.last===addDays(D.d,-1))?NUM(S.streak)+1:1;S.last=D.d;bump('misall');setTimeout(()=>celebrate('오늘의 미션 3개를 모두 해냈어요! 보너스 +10'),700)}
  save();refreshMissionCard()}
function missionHref(id){const last=(DB._last&&LESSONS.find(l=>l.id===DB._last.id&&l.ready))||LESSONS.find(l=>l.ready);const L=last?last.id:'poly';
  return{term3:'#'+L,drill:'#drill',drill8:'#drill',steps1:'#'+L+'-steps',prac3:'#'+L+'-practice',prac5:'#'+L+'-practice',clean2:'#'+L+'-practice',explore1:'#'+L+'-explore',review1:'#review',calc1:'#calc'}[id]||'#home'}
function missionCardHTML(){const ms=todayMissions(),done=ms.filter(id=>missionProg(id)>=MISSIONS[id].n).length,sk=missionStreak();
  return`<div class="g-head"><b class="t">오늘의 미션</b><span class="k">${done}/3${done===3?' · 다 했어요!':' · 셋 다 하면 보너스 +10'}${sk?` · 미션 연속 ${sk}일`:''}</span></div>
  <ol class="mis">${ms.map(id=>{const M=MISSIONS[id],p=missionProg(id),ok=p>=M.n;return`<li class="${ok?'ok':''}"><span class="mchk">${ok?CHECK:''}</span><span class="mnm">${M.nm}${M.n>1?` <small class="rm">${p}/${M.n}</small>`:''}</span>${ok?'<span class="mpt rm">+3</span>':`<a class="mgo" href="${missionHref(id)}">하러 가기</a>`}</li>`}).join('')}</ol>`}

/* 다면체 그리기 (SVG): 볼록 다면체라 앞을 보는 면만 그리면 겹치지 않아요 */
function shadeHex(hex,f){const n=parseInt(hex.slice(1),16);let c=[n>>16&255,n>>8&255,n&255];const to=f>=1?[255,255,255]:[29,38,64],t=f>=1?Math.min(1,f-1):Math.min(1,1-f);c=c.map((v,i)=>Math.round(v+(to[i]-v)*t));return`rgb(${c[0]},${c[1]},${c[2]})`}
function solidSVG(m,{yaw=0.6,pitch=0.36,cx=60,cy=60,r=40,color='#8ec5ff',sw=2.2,stroke='#1d2640'}={}){
  const c=m.c,cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pitch),sP=Math.sin(pitch),s=r/m.R,L=[-0.45,-0.55,0.7],ll=Math.hypot(...L);
  const tr=(x,y,z)=>{const x1=x*cY-y*sY,y1=x*sY+y*cY;return[x1,-(y1*sP+z*cP),-y1*cP+z*sP]};
  const P=m.V.map(p=>tr(p[0]-c[0],p[1]-c[1],p[2]-c[2])),N=m.N.map(n=>tr(n[0],n[1],n[2]));let out='',top=Infinity;
  P.forEach(p=>{const y=cy+p[1]*s;if(y<top)top=y});
  m.F.forEach((f,i)=>{const n=N[i];if(n[2]<=1e-4)return;const d=Math.max(0,(n[0]*L[0]+n[1]*L[1]+n[2]*L[2])/ll);
    out+=`<polygon points="${f.map(k=>(cx+P[k][0]*s).toFixed(1)+','+(cy+P[k][1]*s).toFixed(1)).join(' ')}" fill="${shadeHex(color,0.74+0.46*d)}" stroke="${stroke}" stroke-width="${sw.toFixed(2)}" stroke-linejoin="round"/>`});
  return{svg:out,top}}
const AVM={};
function avMesh(id){if(AVM[id])return AVM[id];const m=id==='tetra'?pyramid(regPoly(3,1.25),1.25*Math.SQRT2):id==='octa'?octahedron(1.3):id==='dodeca'?dodecahedron():id==='icosa'?icosahedron(1.15):(SOLIDS[id]||SOLIDS.cube).mk();return AVM[id]=m}
function faceSVG(kind,x,y,u,boss){const k='#1d2640',e=10*u,f=v=>v.toFixed(1);
  const dot=cx=>`<ellipse cx="${f(cx)}" cy="${f(y-2*u)}" rx="${f(3.4*u)}" ry="${f(4.4*u)}" fill="${k}"/><circle cx="${f(cx+1.2*u)}" cy="${f(y-3.6*u)}" r="${f(1.2*u)}" fill="#fff"/>`;
  if(boss){const eye=d=>`<circle cx="${f(x+d*10*u)}" cy="${f(y-u)}" r="${f(4.6*u)}" fill="#fff" stroke="${k}" stroke-width="${f(1.6*u)}"/><circle cx="${f(x+d*9*u)}" cy="${f(y-0.4*u)}" r="${f(2.1*u)}" fill="${k}"/>`;
    return[-1,1].map(d=>`<path d="M${f(x+d*18*u)} ${f(y-12*u)} L${f(x+d*5*u)} ${f(y-6.5*u)}" stroke="${k}" stroke-width="${f(3.2*u)}" stroke-linecap="round"/>`).join('')+eye(-1)+eye(1)+
      `<path d="M${f(x-10*u)} ${f(y+13*u)} Q${f(x)} ${f(y+6*u)} ${f(x+10*u)} ${f(y+13*u)}" fill="none" stroke="${k}" stroke-width="${f(2.8*u)}" stroke-linecap="round"/><path d="M${f(x-4*u)} ${f(y+9.6*u)} l${f(1.6*u)} ${f(3*u)} l${f(1.6*u)} ${f(-3.4*u)} M${f(x+1*u)} ${f(y+9.4*u)} l${f(1.6*u)} ${f(3*u)} l${f(1.6*u)} ${f(-3*u)}" fill="#fff" stroke="${k}" stroke-width="${f(1.1*u)}" stroke-linejoin="round"/>`}
  let s;
  if(kind==='sparkle')s=[-1,1].map(d=>`<circle cx="${f(x+d*e)}" cy="${f(y-2*u)}" r="${f(5.2*u)}" fill="${k}"/><circle cx="${f(x+d*e+1.8*u)}" cy="${f(y-4*u)}" r="${f(1.9*u)}" fill="#fff"/><circle cx="${f(x+d*e-1.6*u)}" cy="${f(y)}" r="${f(0.9*u)}" fill="#fff"/>`).join('');
  else if(kind==='sleepy')s=[-1,1].map(d=>`<path d="M${f(x+d*e-4*u)} ${f(y-2*u)} Q${f(x+d*e)} ${f(y+1.6*u)} ${f(x+d*e+4*u)} ${f(y-2*u)}" fill="none" stroke="${k}" stroke-width="${f(2.2*u)}" stroke-linecap="round"/>`).join('');
  else if(kind==='wink')s=dot(x-e)+`<path d="M${f(x+e-4*u)} ${f(y-u)} L${f(x+e)} ${f(y-4.6*u)} L${f(x+e+4*u)} ${f(y-u)}" fill="none" stroke="${k}" stroke-width="${f(2.2*u)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  else if(kind==='glasses')s=dot(x-e)+dot(x+e)+[-1,1].map(d=>`<circle cx="${f(x+d*e)}" cy="${f(y-2*u)}" r="${f(7*u)}" fill="rgba(255,255,255,.28)" stroke="${k}" stroke-width="${f(1.8*u)}"/>`).join('')+`<path d="M${f(x-3*u)} ${f(y-3*u)} Q${f(x)} ${f(y-5*u)} ${f(x+3*u)} ${f(y-3*u)}" fill="none" stroke="${k}" stroke-width="${f(1.8*u)}"/>`;
  else s=dot(x-e)+dot(x+e);
  return s+[-1,1].map(d=>`<ellipse cx="${f(x+d*17*u)}" cy="${f(y+7.5*u)}" rx="${f(4.6*u)}" ry="${f(2.8*u)}" fill="#ff8fa3" opacity=".55"/>`).join('')+
    `<path d="M${f(x-5*u)} ${f(y+7*u)} Q${f(x)} ${f(y+11*u)} ${f(x+5*u)} ${f(y+7*u)}" fill="none" stroke="${k}" stroke-width="${f(2.2*u)}" stroke-linecap="round"/>`}
function hatSVG(kind,x,t,u,cy,r){const k='#1d2640',w=(1.8*u).toFixed(2),b=t+3*u,f=v=>v.toFixed(1);
  switch(kind){
    case'sprout':return`<path d="M${f(x)} ${f(b)} L${f(x)} ${f(b-12*u)}" stroke="#4f9a3a" stroke-width="${f(2.4*u)}" stroke-linecap="round"/><path d="M${f(x)} ${f(b-10*u)} Q${f(x-12*u)} ${f(b-21*u)} ${f(x-15*u)} ${f(b-8*u)} Q${f(x-6*u)} ${f(b-5*u)} ${f(x)} ${f(b-10*u)}Z" fill="#8fd16a" stroke="${k}" stroke-width="${w}"/><path d="M${f(x)} ${f(b-11*u)} Q${f(x+11*u)} ${f(b-23*u)} ${f(x+15*u)} ${f(b-11*u)} Q${f(x+6*u)} ${f(b-7*u)} ${f(x)} ${f(b-11*u)}Z" fill="#a6e07f" stroke="${k}" stroke-width="${w}"/>`;
    case'ribbon':{const X=x+9*u,Y=b-3*u;return`<path d="M${f(X)} ${f(Y)} L${f(X-13*u)} ${f(Y-8*u)} L${f(X-13*u)} ${f(Y+8*u)}Z M${f(X)} ${f(Y)} L${f(X+13*u)} ${f(Y-8*u)} L${f(X+13*u)} ${f(Y+8*u)}Z" fill="#ff8fb8" stroke="${k}" stroke-width="${w}" stroke-linejoin="round"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(3.6*u)}" fill="#ff6fa3" stroke="${k}" stroke-width="${w}"/>`}

    case'headphones':{const R=r*1.04;return`<path d="M${f(x-R)} ${f(cy)} Q${f(x-R)} ${f(t-10*u)} ${f(x)} ${f(t-10*u)} Q${f(x+R)} ${f(t-10*u)} ${f(x+R)} ${f(cy)}" fill="none" stroke="${k}" stroke-width="${f(5.4*u)}" stroke-linecap="round"/><path d="M${f(x-R)} ${f(cy)} Q${f(x-R)} ${f(t-10*u)} ${f(x)} ${f(t-10*u)} Q${f(x+R)} ${f(t-10*u)} ${f(x+R)} ${f(cy)}" fill="none" stroke="#ff7a7a" stroke-width="${f(2.4*u)}" stroke-linecap="round"/>`+[-1,1].map(d=>`<rect x="${f(x+d*R-5*u)}" y="${f(cy-8*u)}" width="${f(10*u)}" height="${f(16*u)}" rx="${f(4*u)}" fill="#ff7a7a" stroke="${k}" stroke-width="${w}"/>`).join('')}
    case'grad':return`<rect x="${f(x-11*u)}" y="${f(b-8*u)}" width="${f(22*u)}" height="${f(8*u)}" rx="${f(1.5*u)}" fill="#2b3350" stroke="${k}" stroke-width="${w}"/><path d="M${f(x-23*u)} ${f(b-11*u)} L${f(x)} ${f(b-19*u)} L${f(x+23*u)} ${f(b-11*u)} L${f(x)} ${f(b-4*u)}Z" fill="#2b3350" stroke="${k}" stroke-width="${w}" stroke-linejoin="round"/><path d="M${f(x)} ${f(b-11*u)} L${f(x+16*u)} ${f(b-8*u)} L${f(x+16*u)} ${f(b+3*u)}" fill="none" stroke="#ffd23f" stroke-width="${f(2*u)}" stroke-linecap="round"/><circle cx="${f(x+16*u)}" cy="${f(b+4*u)}" r="${f(2.2*u)}" fill="#ffd23f"/>`;
    case'crown':return`<path d="M${f(x-16*u)} ${f(b)} L${f(x-17*u)} ${f(b-15*u)} L${f(x-8*u)} ${f(b-7*u)} L${f(x)} ${f(b-19*u)} L${f(x+8*u)} ${f(b-7*u)} L${f(x+17*u)} ${f(b-15*u)} L${f(x+16*u)} ${f(b)}Z" fill="#ffd23f" stroke="${k}" stroke-width="${w}" stroke-linejoin="round"/><circle cx="${f(x)}" cy="${f(b-4.5*u)}" r="${f(2.6*u)}" fill="#ff6b6b" stroke="${k}" stroke-width="${f(1.2*u)}"/><circle cx="${f(x-9*u)}" cy="${f(b-4*u)}" r="${f(1.8*u)}" fill="#6fb4ff"/><circle cx="${f(x+9*u)}" cy="${f(b-4*u)}" r="${f(1.8*u)}" fill="#7fdcb8"/>`;
    case'wizard':return`<path d="M${f(x-17*u)} ${f(b)} L${f(x+5*u)} ${f(b-36*u)} L${f(x+17*u)} ${f(b)}Z" fill="#7b5cd6" stroke="${k}" stroke-width="${w}" stroke-linejoin="round"/><ellipse cx="${f(x)}" cy="${f(b)}" rx="${f(24*u)}" ry="${f(4.4*u)}" fill="#6a4cc4" stroke="${k}" stroke-width="${w}"/><path d="M${f(x-3*u)} ${f(b-14*u)} l${f(1.4*u)} ${f(3*u)} l${f(3.2*u)} ${f(0.4*u)} l${f(-2.4*u)} ${f(2.2*u)} l${f(0.7*u)} ${f(3.2*u)} l${f(-2.9*u)} ${f(-1.6*u)} l${f(-2.9*u)} ${f(1.6*u)} l${f(0.7*u)} ${f(-3.2*u)} l${f(-2.4*u)} ${f(-2.2*u)} l${f(3.2*u)} ${f(-0.4*u)}Z" fill="#ffe266"/><circle cx="${f(x+6*u)}" cy="${f(b-25*u)}" r="${f(1.6*u)}" fill="#ffe266"/>`;

/* 꾸미기 상점: 모은 포인트(누적)는 그대로, 쓸 수 있는 포인트 = 누적 − 쓴 포인트 */
const SHOP=[
 {cat:'shape',nm:'몸 모양',items:[{id:'cube',nm:'정육면체',p:0},{id:'tetra',nm:'정사면체',p:30},{id:'octa',nm:'정팔면체',p:60},{id:'dodeca',nm:'정십이면체',p:120},{id:'icosa',nm:'정이십면체',p:150}]},
 {cat:'color',nm:'몸 색',items:[{id:'sky',nm:'하늘',p:0,c:'#8ec5ff'},{id:'mint',nm:'민트',p:20,c:'#7fdcb8'},{id:'peach',nm:'복숭아',p:20,c:'#ffb59b'},{id:'lemon',nm:'레몬',p:20,c:'#ffe066'},{id:'lilac',nm:'라일락',p:30,c:'#c7a7ff'},{id:'coral',nm:'산호',p:30,c:'#ff8f8f'},{id:'leaf',nm:'잎새',p:30,c:'#9bd36a'},{id:'night',nm:'밤하늘',p:50,c:'#5b6b9a'}]},
 {cat:'eyes',nm:'눈',items:[{id:'dot',nm:'콩눈',p:0},{id:'sparkle',nm:'반짝눈',p:25},{id:'sleepy',nm:'졸린 눈',p:25},{id:'wink',nm:'윙크',p:30},{id:'glasses',nm:'동그란 안경',p:40}]},
 {cat:'hat',nm:'모자',items:[{id:'none',nm:'없음',p:0},{id:'sprout',nm:'새싹',p:20},{id:'ribbon',nm:'리본',p:30},{id:'cap',nm:'야구 모자',p:40},{id:'headphones',nm:'헤드폰',p:50},{id:'grad',nm:'졸업 모자',p:70},{id:'crown',nm:'왕관',p:100},{id:'wizard',nm:'마법사 모자',p:120}]},
 {cat:'hi',nm:'형광펜 색',items:[{id:'yellow',nm:'노랑',p:0,c:'#ffe266',s:'#fff6c7'},{id:'pink',nm:'분홍',p:40,c:'#ffb8d6',s:'#ffeaf3'},{id:'mint',nm:'민트',p:40,c:'#9ff0d0',s:'#e3fbf2'},{id:'sky',nm:'하늘',p:40,c:'#aee0ff',s:'#e6f5ff'},{id:'orange',nm:'주황',p:40,c:'#ffcb8e',s:'#fff0dd'}]}];
const shopCat=c=>SHOP.find(x=>x.cat===c);
const shopItem=(c,id)=>{const C=shopCat(c);return C?(C.items.find(x=>x.id===id)||C.items[0]):null};
function shopState(){const S=OBJ(DB._shop);S.spent=NUM(S.spent);S.own=OBJ(S.own);S.eq=OBJ(S.eq);DB._shop=S;return S}
function owns(c,id){const C=shopCat(c),it=C&&C.items.find(x=>x.id===id);return!!it&&(it.p===0||!!shopState().own[c+':'+id])}
function myEq(){const S=shopState(),o={};SHOP.forEach(C=>{const id=S.eq[C.cat];o[C.cat]=(id&&owns(C.cat,id))?id:C.items[0].id});return o}
const balance=()=>Math.max(0,NUM(me().pts)-shopState().spent+bbLedger());
let themePreview=null;
function applyTheme(){const it=themePreview||shopItem('hi',myEq().hi),r=document.documentElement.style;r.setProperty('--hi',it.c);r.setProperty('--hi-soft',it.s)}
function equipItem(c,id){if(!owns(c,id))return false;shopState().eq[c]=id;save();applyTheme();return true}
function buyItem(c,id){const it=shopItem(c,id);if(!it||it.id!==id)return false;if(owns(c,id))return equipItem(c,id);
  if(balance()<it.p){toast(`포인트가 ${it.p-balance()}만큼 모자라요.`);return false}
  const S=shopState();S.spent+=it.p;S.own[c+':'+id]=1;S.eq[c]=id;save();applyTheme();return true}
function avatarSVG(eq,size=120,yaw=0.6,opt={}){const m=avMesh(eq.shape),cx=size/2,cy=size*0.58,r=size*0.27,u=r/40;
  const{svg,top}=solidSVG(m,{yaw,pitch:0.36,cx,cy,r,color:shopItem('color',eq.color).c,sw:Math.max(1.4,size/52)});
  return`<svg class="avatar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${opt.shadow===false?'':`<ellipse cx="${cx}" cy="${(cy+r*1.12).toFixed(1)}" rx="${(r*0.85).toFixed(1)}" ry="${(r*0.15).toFixed(1)}" fill="rgba(29,38,64,.13)"/>`}${svg}${faceSVG(eq.eyes,cx,cy+r*0.06,u)}${hatSVG(eq.hat,cx,top,u,cy,r)}</svg>`}
function mountSpin(host,render,{speed=0.6}={}){let yaw=0.6,last=0;host.innerHTML=render(yaw);if(reduced)return;
  const tick=ts=>{if(!host.isConnected)return;if(ts-last>45){yaw+=Math.min(0.2,(ts-last)/1000*speed);last=ts;host.innerHTML=render(yaw)}requestAnimationFrame(tick)};
  requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(tick)})}
function viewShop(){
  crumbs.innerHTML=`<span class="sep">›</span><a href="#me">내 기록</a><span class="sep">›</span><span>꾸미기 상점</span>`;
  let cat='shape',preview=null;
  app.innerHTML=`<div class="unit-head"><div><h1>꾸미기 상점</h1><p>포인트로 내 캐릭터를 꾸며요. 물건을 사도 <b>모은 포인트 기록은 줄지 않고</b>, 쓸 수 있는 포인트만 줄어요.</p></div></div>
   <div class="card panel shop"><div class="shop-top"><div class="av-stage" id="avBig"></div><div class="shop-info"><div class="stat"><small>쓸 수 있는 포인트</small><b class="rm" id="bal"></b></div><div class="shop-act" id="shopAct" aria-live="polite"></div></div></div>
   <div class="seg shopTabs" role="tablist">${SHOP.map(C=>`<button type="button" data-c="${C.cat}" role="tab">${C.nm}</button>`).join('')}</div><div class="shop-grid" id="shopGrid"></div></div>`;
  const eqNow=()=>{const e=myEq();if(preview&&preview.cat!=='hi')e[preview.cat]=preview.id;return e};
  mountSpin($('#avBig',app),y=>avatarSVG(eqNow(),220,y));
  function setPreview(p){preview=p;themePreview=p&&p.cat==='hi'?shopItem('hi',p.id):null;applyTheme();draw()}
  function draw(){$('#bal',app).textContent=balance();$$('.shopTabs button',app).forEach(b=>{const on=b.dataset.c===cat;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
    const C=shopCat(cat),E=myEq();
    $('#shopGrid',app).innerHTML=C.items.map(it=>{const own=owns(cat,it.id),on=E[cat]===it.id,sel=preview&&preview.cat===cat&&preview.id===it.id;
      const pic=cat==='hi'?`<span class="hi-sw"><span style="background:linear-gradient(transparent 52%,${it.c} 52%)">형광펜</span></span>`:avatarSVG(Object.assign({},E,{[cat]:it.id}),96,0.6,{shadow:false});
      return`<button type="button" class="shop-item ${on?'on':''} ${sel?'sel':''}" data-id="${it.id}" aria-pressed="${!!sel}"><span class="pic">${pic}</span><b>${it.nm}</b><small>${on?'쓰는 중':own?'가지고 있음':it.p+' 포인트'}</small></button>`}).join('');
    $$('#shopGrid .shop-item',app).forEach(b=>b.onclick=()=>setPreview({cat,id:b.dataset.id}));act()}
  function act(){const A=$('#shopAct',app);if(!preview){A.innerHTML='<span class="muted">아래에서 고르면 위 캐릭터에 먼저 입혀 볼 수 있어요.</span>';return}
    const it=shopItem(preview.cat,preview.id),own=owns(preview.cat,preview.id),on=myEq()[preview.cat]===preview.id;
    if(on){A.innerHTML=`<b>${it.nm}</b> <span class="muted">· 쓰는 중이에요</span>`;return}
    if(own){A.innerHTML=`<b>${it.nm}</b> <button type="button" class="btn primary">이걸로 바꾸기</button>`;$('button',A).onclick=()=>{equipItem(preview.cat,preview.id);setPreview(null);toast('바꿨어요!')};return}
    const lack=it.p-balance();
    A.innerHTML=`<b>${it.nm}</b> · <b class="rm">${it.p}</b> 포인트 ${lack>0?`<span class="muted">· ${lack}포인트 더 모으면 살 수 있어요</span>`:'<button type="button" class="btn primary">사기</button>'}`;
    const bb=$('button',A);if(bb)bb.onclick=()=>{if(buyItem(preview.cat,preview.id)){setPreview(null);celebrate(`${josa(it.nm,'을','를')} 샀어요!`)}}}
  $$('.shopTabs button',app).forEach(b=>b.onclick=()=>{cat=b.dataset.c;setPreview(null)});draw();refreshLedger().then(L=>{if(L&&$('#bal',app))draw()})}

/* 우리 반 보스전: 반 친구들이 이번 주에 받은 포인트의 합 = 보스에게 준 데미지 */
const BOSSES=[{id:'golem',nm:'큐브 골렘',mesh:'cube',c:'#a3adbf'},{id:'sphinx',nm:'피라미드 스핑크스',mesh:'y4',c:'#e9c46a'},{id:'turtle',nm:'육각기둥 거북',mesh:'p6',c:'#7cc6a4'},
  {id:'witch',nm:'정팔면체 마녀',mesh:'oct',c:'#b8a1ff'},{id:'drake',nm:'정십이면체 드래곤',mesh:'dod',c:'#ff8f7a'},{id:'king',nm:'정이십면체 대왕',mesh:'ico',c:'#6fb4ff'}];
const weekNo=ws=>Math.floor(Date.parse(ws+'T00:00:00Z')/864e5/7);
function bossPlan(st){const H=Math.max(50,NUM(st.per_student)*Math.max(NUM(st.members),5)),wi=weekNo(st.week_start)||0,dmg=NUM(st.damage),stages=[];let thr=0;

function digitPad({len,distinct=false,zero=true,btn='확인',auto=false,onSubmit}){
  const keys=[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')+`<button type="button" data-k="⌫" aria-label="지우기">⌫</button>`+(zero?'<button type="button" data-k="0">0</button>':'<span></span>')+(auto?'<span></span>':`<button type="button" class="dgo" data-k="go">${btn}</button>`);
  const w=el(`<div class="dpad"><div class="dslots">${'<span class="dslot"></span>'.repeat(len)}</div><div class="dkeys">${keys}</div></div>`);
  let v='',lock=false;
  const draw=()=>{$$('.dslot',w).forEach((d,i)=>{d.textContent=v[i]||'';d.classList.toggle('on',i<v.length)});
    $$('.dkeys button',w).forEach(b=>{const k=b.dataset.k;if(k==='go')b.disabled=lock||v.length!==len;else if(k==='⌫')b.disabled=lock||!v.length;else b.disabled=lock||v.length>=len||(distinct&&v.includes(k))})};
  const submit=()=>{if(lock||v.length!==len)return;lock=true;draw();const val=v;onSubmit(val,ok=>{lock=false;if(ok!==false)v='';draw()})};
  const press=k=>{if(lock)return;if(k==='go')return submit();if(k==='⌫')v=v.slice(0,-1);else if(v.length<len&&!(distinct&&v.includes(k))&&(zero||k!=='0'))v+=k;draw();if(auto&&v.length===len)setTimeout(submit,120)};
  $$('.dkeys button',w).forEach(b=>b.onclick=()=>press(b.dataset.k));w._press=press;w._lock=on=>{lock=on;draw()};draw();return w}

  <li>하루 10판까지 할 수 있어요.</li></ul>`;

    $$('.bbJoin',host).forEach(b=>b.onclick=()=>{b.disabled=true;join(b.dataset.code,()=>{b.disabled=false})})}
  load();clearInterval(bbLobbyT);bbLobbyT=setInterval(()=>{if(!host.isConnected){clearInterval(bbLobbyT);return}if(document.visibilityState!=='visible')return;

const BB={id:null,timer:null,tick:null,st:null,busy:false,deadline:0,shown:null,cpu:null,memo:{}};
function bbStop(){clearInterval(BB.timer);clearInterval(BB.tick);BB.timer=BB.tick=null}
function viewBBGame(id){crumbs.innerHTML=`<span class="sep">›</span><a href="#baseball">숫자야구</a><span class="sep">›</span><span>경기</span>`;
  bbStop();BB.id=id;BB.cpu=null;BB.st=null;BB.shown=null;BB.memo=OBJ(lsGet('hangeoreum-bbmemo:'+id,{}));
  if(!isStudent()){location.hash='#baseball';return}
  app.innerHTML='<div id="bbHost"><div class="card panel"><p class="muted" style="margin:0">불러오는 중…</p></div></div>';
  BB.act={secret:v=>API.call('hg_bb_secret',{p_token:AUTH.token,p_game:id,p_secret:v}),guess:v=>API.call('hg_bb_guess',{p_token:AUTH.token,p_game:id,p_guess:v}),leave:()=>API.call('hg_bb_leave',{p_token:AUTH.token,p_game:id})};
  let n=0;bbPoll();BB.timer=setInterval(()=>{n++;if(!$('#bbHost')){bbStop();return}if(document.visibilityState!=='visible')return;const st=BB.st;if(st&&st.my_turn&&n%3)return;bbPoll()},1500)}
async function bbPoll(){if(BB.busy||BB.cpu)return;BB.busy=true;const id=BB.id;
  try{const st=await API.call('hg_bb_state',{p_token:AUTH.token,p_game:id});if(BB.id!==id||!$('#bbHost'))return;setBBLedger(st.ledger);renderBB(st)}
  catch(e){if(isMissingFn(e)){GAME.off=true;location.hash='#baseball'}else if(isAuthErr(e))authExpired();else if(/찾을 수 없어요/.test(e.message)){bbStop();const h=$('#bbHost');if(h)h.innerHTML=`<div class="card panel"><p>경기를 찾을 수 없어요.</p><a class="btn" href="#baseball">숫자야구 처음으로</a></div>`}}
  finally{BB.busy=false}}
const BB_REASON={expired:'15분 동안 아무도 들어오지 않아 방이 닫혔어요.',setup_timeout:'3분 안에 비밀 숫자를 정하지 않아 경기가 취소됐어요.',replaced:'새 경기를 시작해서 이 방은 닫혔어요.',points:'포인트가 모자란 사람이 있어서 경기가 취소됐어요.',left:'방이 닫혔어요.'};
function bbLogHTML(st,who){const L=(st.guesses||[]).filter(g=>g.who===who);if(!L.length)return'<li class="empty muted">아직 없어요</li>';

function bbHead(st){const meP=st.me==='host'?st.host:st.guest,opP=st.me==='host'?st.guest:st.host;

function renderBB(st){const host=$('#bbHost');if(!host)return;const prev=BB.st;BB.st=st;const key=st.status+'|'+(st.status==='setup'?(st.my_secret?'set':'unset'):'');

    if(!st.my_secret){const pad=digitPad({len:NUM(st.digits),distinct:true,zero:false,btn:'이 숫자로 정하기',onSubmit:async(v,done)=>{const m=$('.bbSecMsg',host);try{const r=await BB.act.secret(v);if(r&&r.ok===false){m.textContent=r.msg;done(false);return}done();if(BB.cpu)renderBB(BB.cpu.state());else bbPoll()}catch(e){m.textContent=e.message;done(false)}}});$('.bbSecretPad',host).appendChild(pad);bbKeys(pad)}
    bbWireLeave(host,false);return}
  if(st.status==='playing'){const memo=[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" data-k="${k}" class="m${BB.memo[k]||0}">${k}</button>`).join('');
    host.innerHTML=`<div class="card panel bb-board">${bbHead(st)}<div class="bb-turn" aria-live="polite"></div>
     <div class="bb-cols"><div class="bb-col"><h3>내 추리 <small>상대 숫자 맞히기</small></h3><ol class="bb-log mineLog"></ol></div>
      <div class="bb-col"><h3>상대의 추리 <small>내 숫자 <b class="rm">${bbSpaced(st.my_secret)}</b></small></h3><ol class="bb-log oppLog"></ol></div></div>

     <p style="margin:12px 0 0">${leaveBtn(st.cpu?'연습 그만하기':'기권하기')}</p></div>`;
    const pad=digitPad({len:NUM(st.digits),distinct:true,zero:false,btn:'부르기',onSubmit:async(v,done)=>{const m=$('.bbGMsg',host);m.textContent='';

    BB.pad=pad;$('.bbGuessPad',host).appendChild(pad);bbKeys(pad);
    $$('.memo-keys button',host).forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=((BB.memo[k]||0)+1)%3;BB.memo[k]=v;b.className='m'+v;if(!BB.cpu)lsSet('hangeoreum-bbmemo:'+BB.id,BB.memo)});
    $('.memoClear',host).onclick=()=>{BB.memo={};$$('.memo-keys button',host).forEach(b=>b.className='m0');if(!BB.cpu)lsSet('hangeoreum-bbmemo:'+BB.id,{})};

  bbStop();pinKeyHandler=null;
  if(st.status==='done'){const win=st.winner===st.me,draw=st.winner==='draw',d=Number(st.delta)||0,n=(st.guesses||[]).filter(g=>g.who===st.me&&g.guess).length;

/* ── 칩 그림: 위에 + 칩, 아래에 − 칩, 짝(0 쌍)은 세로로 맞추어 묶음 ── */
function chipsSVG(pos,neg,o={}){
  const r=o.r||17,gap=r*2+9,cols=Math.max(pos,neg,1),W=Math.max(o.W||440,cols*gap+20),pairs=o.pairs||0,H=r*4+50,y1=r+12,y2=y1+gap+4;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chipsvg" role="img" aria-label="양의 칩 ${pos}개, 음의 칩 ${neg}개" style="font-family:${MATHF}">`;
  const x0=(W-cols*gap)/2+gap/2;
  for(let i=0;i<pairs;i++){const x=x0+i*gap;s+=`<rect x="${x-r-4}" y="${y1-r-4}" width="${2*r+8}" height="${y2-y1+2*r+8}" rx="${r+4}" fill="#f4f4f4" stroke="#8a8f99" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    if(o.zeroLab!==false)s+=`<text x="${x}" y="${y2+r+22}" text-anchor="middle" font-size="18" fill="${ZC}">0</text>`}
  const chip=(x,yy,p,dim,ghost)=>{const c=p?PC:NC;return`<g opacity="${dim?0.32:1}"><circle cx="${x}" cy="${yy}" r="${r}" fill="${ghost?'#fff':p?PCs:NCs}" stroke="${c}" stroke-width="2.4" ${ghost?'stroke-dasharray="4 3"':''}/><text x="${x}" y="${yy+8}" text-anchor="middle" font-size="${r*1.35}" font-weight="700" fill="${c}">${p?'+':MI}</text></g>`};
  for(let i=0;i<pos;i++)s+=chip(x0+i*gap,y1,true,o.cancel&&i<pairs,o.ghostP&&i>=pos-o.ghostP);
  for(let i=0;i<neg;i++)s+=chip(x0+i*gap,y2,false,o.cancel&&i<pairs,o.ghostN&&i>=neg-o.ghostN);
  if(o.cancel)for(let i=0;i<pairs;i++){const x=x0+i*gap;s+=`<line x1="${x-r}" y1="${y1-r}" x2="${x+r}" y2="${y2+r}" stroke="#8a8f99" stroke-width="2"/>`}
  return s+'</svg>'}

/* ── 온도계 ── */
function thermoSVG(t,o={}){const lo=o.lo??-10,hi=o.hi??10,H=360,W=o.wide||o.marks?250:170,x=70,top=24,bot=300,Y=v=>bot-(v-lo)/(hi-lo)*(bot-top),tb=!!o.tb;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="thermo" role="img" aria-label="온도계" style="font-family:${MATHF}">`;
  s+=`<rect x="${x-11}" y="${top-12}" width="22" height="${bot-top+24}" rx="11" fill="#fff" stroke="#1d2640" stroke-width="2.2"/><circle cx="${x}" cy="${bot+28}" r="20" fill="${tb?'#999':(t>=0?PC:NC)}" stroke="#1d2640" stroke-width="2.2"/>`;
  if(t!=null)s+=`<rect x="${x-6}" y="${Y(t)}" width="12" height="${bot+16-Y(t)}" fill="${tb?'#999':(t>=0?PC:NC)}"/>`;
  for(let v=lo;v<=hi;v++){const yy=Y(v),big=v%5===0;s+=`<line x1="${x+11}" y1="${yy}" x2="${x+11+(big?16:9)}" y2="${yy}" stroke="#1d2640" stroke-width="${big?2:1.2}"/>`;
    if(big)s+=`<text x="${x+33}" y="${yy+7}" font-size="20" fill="${v===0||tb?'#1d2640':v>0?PC:NC}">${v<0?MI+(-v):v}</text>`}
  s+=`<text x="${x+33}" y="${top-14}" font-size="16" fill="#1d2640">(°C)</text>`;
  if(!tb&&!o.noWords){s+=`<text x="8" y="${(Y(hi)+Y(0))/2}" font-size="16" fill="${PC}" font-family="sans-serif" font-weight="700">영상</text><text x="8" y="${(Y(lo)+Y(0))/2}" font-size="16" fill="${NC}" font-family="sans-serif" font-weight="700">영하</text><line x1="${x-30}" y1="${Y(0)}" x2="${x-12}" y2="${Y(0)}" stroke="#1d2640" stroke-width="1.5" stroke-dasharray="3 3"/>`}
  (o.marks||[]).forEach(m=>{s+=`<path d="M${x+52} ${Y(m.v)} l14 -8 v16 z" fill="${m.c||'#e08a1e'}"/><text x="${x+70}" y="${Y(m.v)+6}" font-size="15" font-family="sans-serif" fill="#1d2640">${m.l||''}</text>`});
  return s+'</svg>'}

/* 덧셈 그림: 수직선 화살표 + 칩 */
function addNL(a,b,o={}){const s=a+b,[mn,mx]=nlRange([a,s],5);return nlSVG({min:mn,max:mx,arrows:[{a:0,b:a,lab:(a>0?'+':MI)+Math.abs(a)},{a,b:s,lab:(b>0?'+':MI)+Math.abs(b)}],pts:o.ans?[{v:s,l:sgnTxt(s)}]:[],tb:o.tb,W:o.W})}
function addChips(a,b,o={}){const P=(a>0?a:0)+(b>0?b:0),N=(a<0?-a:0)+(b<0?-b:0);return chipsSVG(P,N,{pairs:o.pair?Math.min(P,N):0,cancel:o.pair})}

     <p class="rm" style="font-size:19px">(+2) ${MI} (+5) = (+2) + (${MI}5) = ${MI}3<br>(${MI}4) ${MI} (${MI}6) = (${MI}4) + (+6) = +2</p>

/* ── 탐구 공통: 라운드 진행 ── */
function rounds(host,list,show,done,onceKey){let i=0;const log=[];
  host.innerHTML=`<div class="ix"><div class="ixTop"><span class="ixN rm"></span></div><div class="ixFig"></div><div class="ixQ"></div><div class="ixA"></div><div class="flmsg ixMsg" aria-live="polite"></div><div class="ixLog chips"></div></div>`;

    msg:(h,ok)=>{const m=$('.ixMsg',host);m.className='flmsg ixMsg'+(ok===false?' bad':'');m.innerHTML=h},
    next:(logTxt)=>{if(logTxt)log.push(logTxt);$('.ixLog',host).innerHTML=log.map(t=>`<span class="chip">○ ${t}</span>`).join('');i++;setTimeout(go,700)},host};
  function go(){if(i>=list.length){api.q('');api.a('');api.msg(`<span class="ok">${list.length}개를 모두 해냈어요!</span>`);done();if(onceKey)award(3,onceKey);return}
    $('.ixN',host).textContent=`${i+1} / ${list.length}`;api.msg('');show(list[i],api,i)}

function snAsk(api,ans,o,onOk){window.__ia={k:'sn',v:ans};const st={type:'sn',ans,suffix:o.suffix||'',needSign:!!o.needSign};let tries=0;
  api.a(answerUI(st,v=>{const c=check(st,v);if(c===true){onOk(v);return true}if(c==='nosign'){api.msg('✕ 양수는 + 를 붙여요. + 를 먼저 누르고 숫자를 눌러요.',false);return false}tries++;api.msg('✕ '+(typeof o.hint==='function'?o.hint(tries):o.hint||'다시 해 볼까요?'),false);
    if(tries>=3)api.msg(`✕ 정답은 <b class="rm">${o.ansText||sgnTxt(ans)}</b>이에요. 확인하고 넘어가요.`,false),setTimeout(()=>onOk(null),1600);return false}))}
function numAsk(api,ans,o,onOk){window.__ia={k:'num',v:ans};const st={type:'num',ans,suffix:o.suffix||''};let tries=0;
  api.a(answerUI(st,v=>{if(check(st,v)){onOk(v);return true}tries++;api.msg('✕ '+(o.hint||'다시 해 볼까요?'),false);if(tries>=3){api.msg(`✕ 정답은 <b class="rm">${ans}</b>이에요.`,false);setTimeout(()=>onOk(null),1600)}return false}))}
function choiceAsk(api,choices,ans,o,onOk){window.__ia={k:'ch',v:ans};const box=el('<div class="choices"></div>');choices.forEach(c=>{const b=el('<button type="button"></button>');b.innerHTML=c;
  b.onclick=()=>{if(c===ans){b.classList.add('picked');onOk(c)}else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);api.msg('✕ '+(o.hint||'다시 생각해 볼까요?'),false)}};box.appendChild(b)});api.a(box)}
const shk=n=>{n.classList.add('shake');setTimeout(()=>n.classList.remove('shake'),400)};

/* 1차시 탐구 */
function thermoAct(host,done){const r=mulberry(newSeed());const L=shuffle(r,[ri(r,2,9),-ri(r,2,9),-ri(r,1,4),ri(r,1,4),-ri(r,5,10)]);
  rounds(host,L,(t,api)=>{api.fig(`<div class="thermobox">${thermoSVG(t,{wide:true})}</div>`);api.q('온도계가 가리키는 기온을 부호 +, −를 사용하여 나타내면?');
    snAsk(api,t,{suffix:'°C',needSign:true,hint:n=>n===1?'0 °C보다 위인가요, 아래인가요? 위면 + 를, 아래면 − 를 먼저 눌러요.':`눈금 한 칸은 1 °C예요. 0에서부터 세어 보세요.`},()=>{api.msg(`<span class="ok">○ ${t>0?'영상':'영하'} ${Math.abs(t)} °C → ${sgnTxt(t)} °C</span>`);api.next(`${t>0?'영상':'영하'} ${Math.abs(t)} °C = ${sgnTxt(t)} °C`)})},done,'i:thermo')}
function oppAct(host,done){const r=mulberry(newSeed());const L=shuffle(r,SIT.slice()).slice(0,6);
  rounds(host,L,(S,api)=>{const k1=pick(r,S.ks),k2=pick(r,S.ks.filter(k=>k!==k1)),flip=r()<0.35;
    const given=flip?S.n:S.p,giv=flip?-k1:k1,ask=flip?S.p:S.n,av=flip?k2:-k2;
    api.fig(`<div class="oppcard"><div><span class="w" style="color:${giv>0?PC:NC}">${S.ph(given,k1)}</span><span class="arr">→</span><b class="rm" style="color:${giv>0?PC:NC}">${sgnTxt(giv)} ${S.u}</b></div><div><span class="w" style="color:${av>0?PC:NC}">${S.ph(ask,k2)}</span><span class="arr">→</span><b class="rm">?</b></div><small>기준: ${S.base}</small></div>`);
    api.q(`‘${given}’${jong(given)?'과':'와'} 반대인 ‘${ask}’${jong(ask)?'은':'는'} 어떻게 나타낼까요?`);
    const ch=shuffle(r,[sgnTxt(k2)+' '+S.u,sgnTxt(-k2)+' '+S.u]);
    choiceAsk(api,ch,sgnTxt(av)+' '+S.u,{hint:`${josa(given,'이','가')} ${sgnTxt(giv)[0]}이면 반대말 ${josa(ask,'은','는')} 반대 부호예요.`},()=>{api.msg(`<span class="ok">○ ${S.ph(ask,k2)} = ${sgnTxt(av)} ${S.u}</span>`);api.next(`${S.ph(ask,k2)} = ${sgnTxt(av)}`)})},done,'i:opp')}
function sortAct(host,done){const r=mulberry(newSeed());
  const pool=[Q(5),Q(-2),Q(0),Q(7),Q(-9),Q(3,10,true),Q(-8,10,true),Q(1,2),Q(-3,4),Q(12),Q(-1)];/* 1차시라 양수도 + 를 붙여 보여 줌 */
  const L=shuffle(r,pool).slice(0,9);if(!L.some(x=>x.p===0))L[ri(r,2,8)]=Q(0);
  const cat=x=>x.p>0?'p':x.p<0?'n':'z';const NM={p:'양수',n:'음수',z:'둘 다 아님'};const placed={p:[],n:[],z:[]};

    <div class="sort3">${['p','n','z'].map(k=>`<div class="bin ${k}"><b>${NM[k]}</b><div class="binIn" data-b="${k}"></div></div>`).join('')}</div></div>`;
  let i=0,miss=0;const msg=(h,bad)=>{const m=$('.ixMsg',host);m.className='flmsg ixMsg'+(bad?' bad':'');m.innerHTML=h};

    $('.ixN',host).textContent=`${i+1} / ${L.length}`;$('.sortcard',host).innerHTML=qH(L[i]);window.__ia={k:'sort',v:cat(L[i])}};

    else{miss++;shk(b);msg('✕ '+(x.p===0?'0은 기준이에요. 0보다 큰가요, 작은가요?':'0보다 큰 수가 양수, 작은 수가 음수예요.'),true)}});

function readAct(host,done){const r=mulberry(newSeed());const L=[ri(r,1,4),-ri(r,2,5),-ri(r,1,5),Q(-ri(r,1,4)*2-1,2),Q(ri(r,0,3)*2+1,2),Q(-ri(r,0,2)*2-1,2)].map(x=>typeof x==='number'?Q(x):x);
  rounds(host,L,(x,api,i)=>{const sub=x.q===2?2:1,v=qv(x);let hint=0;const draw=h=>api.fig(`<div class="figbox">${nlSVG({min:-5,max:5,sub,pts:[{v,l:'P'}],hops:h?{a:0,b:v}:null})}</div>`);draw(false);
    api.q(sub===2?'점 P가 나타내는 수는? <small class="muted">(한 칸을 둘로 나눴어요. 분수로 답할 때는 / 를 써요. 예: −3/2)</small>':'점 P가 나타내는 수는?');

function placeAct(host,done){const r=mulberry(newSeed());const L=[Q(-3),Q(4),Q(-1),Q(0),Q(-5,2),Q(3,2)];L.splice(0,4,...shuffle(r,L.slice(0,4)));

      $$('.nlhit',api.host).forEach(h=>h.onclick=()=>{const t=+h.dataset.v;if(Math.abs(t-v)<1e-9){draw([{v,l:qS(x),x:''}]);api.msg(`<span class="ok">○ ${qS(x)}의 자리예요.</span>`,true);api.next(qS(x))}
        else{tries++;draw([{v:t,hollow:true,x:'✕'}]);api.msg('✕ '+(tries>=2?`원점에서 ${v>0?'오른쪽':'왼쪽'}으로 ${sub===2?'작은 눈금 '+Math.abs(v*2)+'개':Math.abs(v)+'칸'}이에요.`:v===0?'0은 원점이에요.':`${v>0?'+는 오른쪽':'− 는 왼쪽'}이에요. 몇 칸인지 세어 보세요.`),false)}})};
    draw([]);window.__ia={k:'tap',v};api.q(`수직선에서 <b class="rm">${qH(x)}</b>의 자리를 눌러 보세요.`);api.a('')},done,'i:place')}
function moveAct(host,done){const r=mulberry(newSeed());const L=[[ri(r,-3,1),ri(r,2,4)],[ri(r,0,3),-ri(r,3,5)],[-ri(r,1,3),-ri(r,1,2)],[ri(r,2,4),-ri(r,5,7)]];

      else if(moves>=Math.abs(k)||(Math.sign(d)!==Math.sign(k))){api.msg(Math.sign(d)!==Math.sign(k)?`✕ ${k>0?'오른쪽':'왼쪽'}으로 가야 해요. ‘처음부터’를 눌러요.`:'✕ 칸 수를 다시 세어 볼까요? ‘처음부터’를 눌러요.',false)}};

function hopAct(host,done){const r=mulberry(newSeed());const L=shuffle(r,[-ri(r,3,6),ri(r,2,5),-ri(r,1,2),ri(r,5,7),-7]);
  rounds(host,L,(x,api)=>{let pos=x,hops=0;const draw=()=>api.fig(`<div class="figbox">${nlSVG({min:nlRange([x],4)[0],max:nlRange([x],4)[1],pts:[{v:x,l:sgnTxt(x)}],robot:pos,hops:hops?{a:x,b:pos}:null})}</div>`);draw();
    window.__ia={k:'hop'};api.q(`로봇이 <b class="rm">${sgnTxt(x)}</b>에서 원점 O까지 가요. 버튼을 눌러 한 칸씩 가 보세요.`);
    const b=el(`<div class="mv"><button type="button" class="btn primary">원점 쪽으로 한 칸 <span class="rm hopN">0</span></button></div>`);api.a(b);

function pairAct(host,done){const L=[3,5,0,2.5,6];
  rounds(host,L,(a,api)=>{const sub=a%1?2:1,need=a===0?[0]:[a,-a];let got=[];const draw=(bad)=>{api.fig(`<div class="figbox nlTap">${nlSVG({min:-7,max:7,sub,hit:true,pts:[...got.map(v=>({v,l:sgnTxt(v)})),...(bad!=null?[{v:bad,hollow:true,x:'✕'}]:[])],span:got.length===need.length&&a?[{a:-a,b:0,lab:String(a)},{a:0,b:a,lab:String(a)}]:null})}</div>`);
      $$('.nlhit',api.host).forEach(h=>h.onclick=()=>{const t=+h.dataset.v;if(need.includes(t)&&!got.includes(t)){got.push(t);draw();if(got.length<need.length)api.msg('○ 하나 찾았어요. 또 있을까요?',true);}
        else if(!got.includes(t)){draw(t);api.msg(`✕ ${sgnTxt(t)}은(는) 원점에서 ${Math.abs(t)}만큼 떨어져 있어요.`,false)}})};
    draw();window.__ia={k:'taps',v:need};api.q(`절댓값이 <b class="rm">${a}</b>인 수를 <b>모두</b> 찾아 눌러요. 다 찾았으면 아래 버튼을 눌러요.`);
    const b=el('<div class="mv"><button type="button" class="btn primary">다 찾았어요</button></div>');api.a(b);
    $('button',b).onclick=()=>{if(got.length===need.length){api.msg(`<span class="ok">○ 절댓값이 ${a}인 수는 ${need.map(sgnTxt).join(', ')} · ${need.length}개${a===0?' (0은 하나뿐이에요!)':''}</span>`);api.next(`|x| = ${a} → ${need.map(sgnTxt).join(', ')}`)}

function farAct(host,done){const r=mulberry(newSeed());const L=range(5).map(()=>{let a,b;do{a=ri(r,-8,8);b=ri(r,-8,8)}while(a===b||Math.abs(a)===Math.abs(b)||!a||!b||Math.sign(a)===Math.sign(b)&&r()<0.6);return[a,b]});
